a{color:#5fe0c8;text-decoration:none}.wrap{max-width:560px;margin:0 auto;padding:12px 14px 96px}

.card.hot{border-color:#5fe0c8}.card.risk{border-color:#ff8f6b}.muted{color:#93a0c2;font-size:14px}
