      note(st, 'students', 'moveBack', 'Перенос отменён: ' + subject, fmt.dayLong(c.date) + ': пара снова в ' + SLOTS[c.from][0] + ', аудитория ' + (c.wasRoom || '—') + '.', '#schedule', now, null, LIVE);
      return { back: true, subject };
    } },
    announce: { roles: ['staff'], run(st, u, p, now) {
      const text = clean(p.text, 280);
      if (!text) return { error: 'Напишите текст объявления.' };
      note(st, 'students', 'announce', 'Объявление деканата', text, '#notifications', now, null, LIVE);
    } }
  };

  /* Единственное место, где решается, что можно прочитать: записи одного вида, положенные этой сессии.
     Через него идут и одна запись (DB.get), и списки, и счётчик непрочитанного. Нет сессии или вида — пусто. */
  const told = (x, prev) => { const y = Object.assign({}, x, prev || {}); delete y.hold; return y; };
  function readable(kind, session) {
    const u = who(session), table = pick(TABLE, kind), rule = pick(OWN, kind);
    if (!u || !table || !rule) return [];
    const rows = load()[table].filter(x => rule(x, u));
    if (u.role === 'staff') return rows;
    /* Студент видит то, что ему уже сообщили: пока сообщение ждёт отправки — прежнее состояние. */
    if (kind === 'request') return rows.map(r => (r.hold ? told(r, r.hold.prev) : r));
    if (kind === 'change') return rows.filter(c => !c.hold || c.hold.prev).map(c => (c.hold ? told(c, c.hold.prev) : c));
    return rows;
  }

  const DB = {
    /* Чтение одной записи. Чужое и несуществующее неразличимы: в обоих случаях null. */
    get(kind, id, session) {
      if (id === null || id === undefined) return null;
      const x = readable(kind, session).find(r => String(r.id) === String(id));
      return x ? copy(x) : null;
    },
    /* Список записей одного вида: только то, что положено этой сессии. */
    list(kind, session) { return readable(kind, session).map(copy); },
    /* Срез данных для ленты и расписания: тот же фильтр владельца по всем видам сразу. */
    view(session) {
      const out = { me: null };
      Object.keys(TABLE).forEach(kind => { out[TABLE[kind]] = DB.list(kind, session); });
      const u = who(session);
      out.me = u ? copy(u) : null;
      return out;
    },
    /* Любое изменение: проверка сессии и роли, свежая копия из хранилища (в ней правки других вкладок), запись.
       opt.dry — только проверка: действие считается на копии, ничего не записывается и никто не узнаёт. */
    act(session, name, payload, opt) {
      const u = who(session), def = pick(ACTS, name);
      if (!u) return fail('Сессия закончилась. Войдите ещё раз.');
      if (name === 'reset') {
        if (u.role !== 'staff') return fail('Не найдено.');
        put(seed(demoDay(new Date()), new Date()));
        emit('data');
        return { ok: true };
      }
      if (!def || !def.roles.includes(u.role)) return fail('Не найдено.');
      const st = copy(load());
      const me = st.users.find(x => x.id === u.id);
      const pl = payload || {};
      /* Следующее действие сотрудника: его ждущие сообщения уходят в той же записи, что и само действие (одна запись —
         другая вкладка не успеет вклиниться между двумя). Кроме отката того же самого: «Отменить» и «Вернуть…». */
      if (u.role === 'staff' && name !== 'commit' && !(opt && opt.dry)) {
        /* вопрос студенту (need) уходит и перед сменой статуса той же заявки: откатывать при «Готова» нечего */
        const keep = w => (name === 'undo' && w.id === String(pl.pid)) || ((name === 'status' || name === 'moveBack') && w.ref === String(pl.id) && !(w.note && w.note.kind === 'need'));
        deliver(st, w => w.by === u.id && !keep(w));
      }
      const res = def.run(st, me, pl, Clock.now()) || {};
      if (res.error) return Object.assign(fail(res.error), res.field ? { field: res.field } : {});
      if (opt && opt.dry) return Object.assign({ ok: true, dry: true }, res);
      if (res.same) return { ok: true, sent: 0 };
      put(st);
      emit('data');
      return Object.assign({ ok: true }, res);
    },
    unread(session) {
      const u = who(session);
      return u ? readable('note', session).filter(n => !(n.read && n.read[u.id])).length : 0;
    },
    /* Новые сообщения от деканата, о которых в этой вкладке ещё не показывали плашку. Отметка «показано» живёт во вкладке
       (как вход) и в общие данные не пишется: показ плашки не должен спорить с правками сотрудника в соседней вкладке. */
    fresh(session) {
      const u = who(session);
      if (!u) return [];
      const shown = popSeen(u.id);
      return readable('note', session).filter(n => n.live && !shown.includes(n.id) && !(n.read && n.read[u.id])).map(copy);
    },
    popped(session, ids) {
      const u = who(session);
      if (!u || !Array.isArray(ids)) return;
      let all = {};
      try { all = JSON.parse(tab.get(QKEY) || '{}'); } catch (e) { all = {}; }
      if (!all || typeof all !== 'object' || Array.isArray(all)) all = {};
      all[u.id] = popSeen(u.id).concat(ids.map(String)).slice(-120);
      tab.set(QKEY, JSON.stringify(all));
    },
    /* Что ждёт отправки от этого сотрудника: id, срок и цель — для плашки «Отменить». */
    pending(session) {
      const u = who(session);
      return u && u.role === 'staff' ? load().pending.filter(p => p.by === u.id).map(p => ({ id: p.id, due: p.due, target: p.target, ref: p.ref })) : [];
    },
    /* Черновики полей: живут во вкладке, как вход, и переживают перезагрузку; при выходе стираются. */
    drafts(session) {
      const u = who(session);
      if (!u) return {};
      try { const all = JSON.parse(tab.get(DKEY) || '{}'), mine = all && typeof all === 'object' ? all[u.id] : null; return mine && typeof mine === 'object' ? Object.assign({}, mine) : {}; } catch (e) { return {}; }
    },
    draft(session, key, value) {
      const u = who(session);
      if (!u || typeof key !== 'string' || !key || key.length > 80) return;
      let all = {};
      try { all = JSON.parse(tab.get(DKEY) || '{}'); } catch (e) { all = {}; }
      if (!all || typeof all !== 'object' || Array.isArray(all)) all = {};
      const mine = all[u.id] && typeof all[u.id] === 'object' ? all[u.id] : {};
      const v = String(value === null || value === undefined ? '' : value).slice(0, 2000);
      if (v) mine[key] = v; else delete mine[key];
      all[u.id] = mine;
      tab.set(DKEY, JSON.stringify(all));
    },
    /* Настройки вида (тема, демо-часы): общие для вкладок, как и данные. */
    pref(key, value) {
      const p = prefs();
      if (arguments.length < 2) return p[key];
      if (value === null || value === undefined) delete p[key]; else p[key] = value;
      local.set(PKEY, JSON.stringify(p));
      emit('prefs');
      return value;
    },
    on(fn) { subs.push(fn); },
    /* Аварийный выход: если сохранённые данные испорчены так, что экран не рисуется, посев кладётся заново.
       Это не «сброс демо» сотрудника, а починка: её предлагает только экран ошибки. */
    recover() {
      cache = null; cacheRaw = null;
      put(seed(demoDay(new Date()), new Date()));
      emit('data');
    },
    info: () => ({ persistent: local.isLive(), tabSession: tab.isLive(), seedDay: load().seedDay }),
    /* «Начался новый демо-день»: отметку ставит посев поверх данных прошлого дня (load), плашку показывают один раз
       на весь браузер. DB.newDay() — показать ли сейчас; DB.newDay(true) — показали. */
    newDay(mark) {
      let x = null;
      try { x = JSON.parse(local.get(NKEY) || 'null'); } catch (e) { x = null; }
      if (!x || typeof x !== 'object' || x.day !== load().seedDay) return false;
      if (mark) { x.shown = true; local.set(NKEY, JSON.stringify(x)); return false; }
      return !x.shown;
    }
  };
  /* Другая вкладка изменила данные или настройки: перечитываем и сообщаем экранам. */
  try {
    window.addEventListener('storage', e => {
      if (e.key === null || e.key === KEY || e.key === PKEY) { cacheRaw = null; emit(e.key === PKEY ? 'prefs' : 'data'); }
    });
  } catch (e) { /* без события вкладки просто не видят друг друга */ }

  /* ------------------------------------------------------------------ вход и сессия вкладки */
  const unhex = h => new Uint8Array(h.match(/../g).map(b => parseInt(b, 16)));
  const tohex = a => Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
  const same = (a, b) => { let d = a.length ^ b.length; for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ (b.charCodeAt(i) || 0); return d === 0; };
  const NO_CRYPTO = 'Этот браузер открыл страницу без защищённого режима, поэтому проверить пароль нельзя. Войдите одной из кнопок демо.';
  let fails = 0, lockedUntil = 0;
  const Auth = {
    session() {
      let s = null;
      try { s = JSON.parse(tab.get(SKEY) || 'null'); } catch (e) { s = null; }
      const u = who(s);
      if (!u) { if (s) tab.del(SKEY); return null; }
      return { userId: u.id, role: u.role };
    },
    user() { const s = Auth.session(); return s ? DB.get('user', s.userId, s) : null; },
    start(userId) {
      const u = load().users.find(x => x.id === userId);
      if (!u) return null;
      const before = Auth.session();                               /* сменился вход: ждущие сообщения прежнего уходят */
      if (before && before.userId !== u.id) commitBy(before.userId);
      const s = JSON.stringify({ userId: u.id, role: u.role });
      tab.set(SKEY, s);
      try { local.set(LKEY, s); } catch (e) { /* без localStorage вход живёт только во вкладке, как раньше */ }
      return { userId: u.id, role: u.role };
    },
    /* Три кнопки демо-входа создают сессию напрямую, без пароля. */
    demo(userId) { return ACCOUNTS.some(a => a.userId === userId) ? Auth.start(userId) : null; },
    demoList: () => load().users.map(u => ({ id: u.id, tag: u.tag, role: u.role })),
    canCheck: () => !!(window.crypto && window.crypto.subtle && typeof TextEncoder === 'function'),
    /* Вход формой: PBKDF2-SHA-256 через crypto.subtle и сравнение с хэшем из кода. */
    async login(loginName, password) {
      const name = clean(loginName, 64).toLowerCase(), pass = String(password === null || password === undefined ? '' : password);
      if (!name || !pass) return { ok: false, code: 'empty', error: 'Введите логин и пароль.' };
      if (Date.now() < lockedUntil) return { ok: false, code: 'locked', error: 'Слишком много попыток. Подождите полминуты и попробуйте снова.' };
      if (!Auth.canCheck()) return { ok: false, code: 'nocrypto', error: NO_CRYPTO };
      const acc = ACCOUNTS.find(a => a.login === name) || NOBODY;
      let hex = '';
      try {
        const key = await window.crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
        const bits = await window.crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unhex(acc.salt), iterations: PBKDF2_ROUNDS }, key, 256);
        hex = tohex(new Uint8Array(bits));
      } catch (e) { return { ok: false, code: 'nocrypto', error: NO_CRYPTO }; }
      if (acc !== NOBODY && same(hex, acc.hash)) { fails = 0; return { ok: true, session: Auth.start(acc.userId) }; }
      if (++fails >= 5) { fails = 0; lockedUntil = Date.now() + 30000; }
      return { ok: false, code: 'bad', error: 'Логин или пароль не подошли.' };
    },
    logout() {
      const s = Auth.session();
      if (s) commitBy(s.userId);                                   /* вышли: ждущие сообщения уходят сразу */
      tab.del(SKEY);
      tab.del(DKEY);
      try { local.del(LKEY); } catch (e) { /* нечего забывать */ }   /* вышли явно: новая вкладка откроется без входа */
    },
    /* Заставка главной показывается один раз за сеанс вкладки: дальше гостю сразу открывается блок входа. */
    introSeen(mark) { if (mark) tab.set(IKEY, '1'); return tab.get(IKEY) === '1'; },
    NO_CRYPTO
  };
  /* Вход запоминается между вкладками: новая вкладка без своего входа один раз при открытии берёт последний вход
     этого браузера (localStorage). Дальше у вкладки свой вход в sessionStorage: выход или смена входа в одной вкладке
     не трогают другую, и студент с сотрудником живут в соседних вкладках. Без localStorage — как раньше: вход во вкладке. */
  try {
    if (!tab.get(SKEY)) { const last = local.get(LKEY); if (last) tab.set(SKEY, last); }
  } catch (e) { /* хранилище недоступно: вход только во вкладке */ }

  /* ------------------------------------------------------------------ допуск */
  /* Баллы по предмету с учётом отмеченных работ плана и шаг «что сделать». */
  /* Баллы студента ставит преподаватель: галочка «Сдано» их не меняет. Отмеченные работы считаются отдельно —
     «до N после проверки» — и уменьшают только остаток плана (need). Допуск есть (ok), когда хватает самих баллов;
     wait — работ сдано достаточно, ждём проверки. */
  function admission(st, userId) {
    return (st.grades || []).filter(g => g.owner === userId).map(g => {
      const plan = (st.plans || []).find(p => p.owner === userId && p.subject === g.subject) || null;
      const items = plan ? plan.items : [];
      const points = g.points;
      const pending = Math.min(g.max - points, items.filter(w => w.done).reduce((s, w) => s + w.max, 0));
      const ok = points >= g.thr;
      const need = Math.max(0, g.thr - points - pending);
      const wait = !ok && need === 0;
      const left = items.filter(w => !w.done).sort((a, b) => b.max - a.max);
      let take = [], sum = 0;
      for (const w of left) { if (sum >= need) break; take.push(w); sum += w.max; }
      const enough = sum >= need;
      let step = '', short = '';
      if (ok) {
        step = 'Порог пройден' + (points > g.thr ? ', запас ' + fmt.points(points - g.thr) : '') + '. Для допуска больше ничего не нужно.';
        short = 'Допуск есть';
      } else if (wait) {
        step = 'Сданных работ хватит: ' + points + ' + до ' + pending + ' после проверки при пороге ' + g.thr + '. Допуск появится, когда преподаватель поставит баллы.';
        short = 'Ждёт проверки';
      } else if (!enough) {
        step = 'Работ из плана не хватит. Напишите в деканат: подскажем, что можно досдать.';
        short = 'Нужна помощь деканата';
      } else {
        const names = take.slice().sort((a, b) => a.max - b.max).map((w, i) => w.acc + ' (до ' + (i === 0 ? fmt.pointsGen(w.max) : w.max) + ')');
        const count = ['', 'Этого хватит.', 'Двух работ хватит.', 'Трёх работ хватит.'][take.length] || 'Этих работ хватит.';
        step = 'Сдать ' + (names.length > 1 ? names.slice(0, -1).join(', ') + ' и ' + names[names.length - 1] : names[0]) + '. ' + count;
        short = ['', 'Закроет одна работа', 'Закроют две работы', 'Закроют три работы'][take.length] || 'Закроют работы из плана';
      }
      const nextDue = take.length ? take.map(w => w.due).sort()[0] : null;
      return { subject: g.subject, points, pending, base: g.points, max: g.max, thr: g.thr, need, ok, wait, enough, plan, step, short, works: take.length, nextDue };
    });
  }

  /* ------------------------------------------------------------------ лента: что важно этому студенту сейчас */
  /* Чистая функция: тот же вход — тот же выход. Возвращает только данные и обычный текст, без разметки. */
  function feed(st, user, now) {
    const items = [];
    const today = ymd(now);
    const empty = { items, main: null, rest: items, calm: true, today, studyDay: today, next: null };
    if (!st || !user || user.role !== 'student') return empty;
    const group = user.group;
    const sd = studyDay(st, group, now);
    const ms = s => (String(s).length > 10 ? parseStamp(s) : parseYmd(s)).getTime();

    /* 1. Переносы. Срочно, пока пара сегодня или в ближайший учебный день и ещё не началась в новое время. */
    (st.changes || []).forEach(c => {
      if (c.group !== group) return;
      const p = dayPairs(st, group, c.date).pairs.find(x => x.changeId === c.id);
      if (!p || at(c.date, p.start) <= now) return;                 /* пара началась: перенос уходит с ленты */
      if (c.ack && c.ack[user.id]) return;                          /* «Понятно»: остаётся только в расписании */
      const isToday = c.date === today, near = isToday || c.date === sd;
      const dayWord = isToday ? 'сегодня' : diffDays(c.date, today) === 1 ? 'завтра' : fmt.onDay(c.date) + ', ' + fmt.date(c.date);
      items.push({
        id: 'move-' + c.id, kind: 'move', word: 'перенос', level: near ? 'urgent' : 'important', sort: near ? -ms(c.at) : ms(c.date), tie: 2,
        title: p.subject + ', ' + p.type.toLowerCase(), value: p.start,
        line: (isToday ? '' : cap(dayWord) + ': ') + p.was.start + ' → ' + p.start + ', ' + roomShift(p.was.room, p.room),
        subject: p.subject, type: p.type, date: c.date, isToday, dayWord, start: p.start, end: p.end, room: p.room, was: p.was, changeId: c.id, changedAt: c.at,
        why: isToday
          ? 'Пара сегодня, и её время изменилось. Это срочно, пока она не началась в ' + p.start + '. Потом здесь появится следующее по важности.'
          : near ? 'Это ближайший учебный день, и время пары изменилось. Сообщение срочное, пока пара не началась в ' + p.start + '.'
            : 'Время пары изменилось. До неё ещё несколько дней, поэтому это важно, но не срочно.',
        act: { name: 'ack', id: c.id, label: 'Понятно' }, href: '#schedule'
      });
    });

    /* 2. Сроки. Важно за неделю до даты; «сегодня» выше, чем «через четыре дня». */
    (st.deadlines || []).forEach(d => {
      if (d.owner !== user.id || d.done) return;
      const left = diffDays(d.due, today);
      items.push({
        id: 'dl-' + d.id, kind: 'deadline', word: 'срок', level: left <= 7 ? 'important' : 'fyi', sort: ms(d.due), tie: 1,
        title: d.title, line: fmt.until(d.due, today), value: left === 0 ? 'Сегодня' : left === 1 ? 'Завтра' : fmt.date(d.due),
        due: d.due, left, deadlineId: d.id, subject: d.subject,
        why: left <= 0 ? 'Срочного сейчас нет. Срок истекает сегодня: из важного это ближайшее по дате.' : 'Срочного сейчас нет. Из важного это ближайшее по дате.',
        act: { href: '#study', label: 'Открыть работу' }, href: '#study', jump: 'dl-' + d.id
      });
    });

    /* 3. Риск недопуска: баллов меньше порога. */
    admission(st, user.id).forEach(a => {
      if (a.ok || a.wait) return;                                    /* всё нужное сдано и ждёт проверки — делать нечего */
      const exam = (st.exams || []).find(e => e.group === group && e.subject === a.subject);
      items.push({
        id: 'risk-' + a.subject, kind: 'risk', word: 'допуск', level: 'important', sort: ms(a.nextDue || (exam && exam.date) || today), tie: 3,
        title: 'До допуска ' + fmt.points(a.need), line: a.subject + '. ' + a.short, value: fmt.points(a.need),
        subject: a.subject, need: a.need, points: a.points, pending: a.pending, max: a.max, thr: a.thr, step: a.step, short: a.short,
        why: 'Срочного сейчас нет. Без допуска на экзамен не пустят, а закрыть разрыв можно уже сейчас.',
        act: { href: '#study', label: 'План до допуска' }, href: '#study'
      });
    });

    /* 4. Заявки: деканат ждёт ответа; справка готова и ещё не открыта. */
    (st.requests || []).forEach(r => {
      if (r.owner !== user.id) return;
      if (r.status === 'need') {
        const q = r.thread.filter(m => m.from === 'staff').slice(-1)[0];
        items.push({
          id: 'need-' + r.id, kind: 'need', word: 'вопрос', level: 'important', sort: ms(r.replyBy || today), tie: 0,
          title: 'Деканат ждёт ответа', line: r.title + (q ? ': ' + q.text : ''), value: 'Ответить', reqId: r.id, reqTitle: r.title, question: q ? q.text : '',
          why: 'Срочного сейчас нет. Деканат ждёт вашего ответа: без него справку не подготовят.',
          act: { href: '#req-' + r.id, label: 'Ответить' }, href: '#req-' + r.id
        });
      } else if (r.status === 'done' && !r.seen) {
        items.push({
          id: 'ready-' + r.id, kind: 'ready', word: 'справка', level: 'fyi', sort: -ms(r.doneAt || r.created), tie: 0,
          title: r.title + ' готова', line: 'Открыть образец', value: 'Готова', reqId: r.id,
          why: '', act: { href: '#req-' + r.id, label: 'Открыть' }, href: '#req-' + r.id
        });
      }
    });

    /* 5. Непрочитанные объявления. */
    (st.notes || []).forEach(n => {
      if (n.kind !== 'announce' || n.to !== 'students' || (n.read && n.read[user.id])) return;
      items.push({
        id: 'ann-' + n.id, kind: 'announce', word: 'объявление', level: 'fyi', sort: -ms(n.at), tie: 1,
        title: 'Объявление деканата', line: n.text, value: 'Объявление', noteId: n.id,
        why: '', act: { href: '#notifications', label: 'Открыть' }, href: '#notifications'
      });
    });

    const rank = { urgent: 0, important: 1, fyi: 2 };
    items.sort((a, b) => rank[a.level] - rank[b.level] || a.sort - b.sort || a.tie - b.tie || (a.id < b.id ? -1 : 1));
    const main = items.length && items[0].level !== 'fyi' ? items[0] : null;
    return { items, main, rest: main ? items.slice(1) : items, calm: !main, today, studyDay: sd, next: nextPair(st, group, now) };
  }

  /* ------------------------------------------------------------------ шесть автопроверок ранжирования */
  /* Чистые функции на заготовках: настоящие данные и хранилище не трогают. 23.11.2026 — понедельник. */
  function runChecks() {
    const A = { id: 't-a', role: 'student', group: GROUP }, B = { id: 't-b', role: 'student', group: GROUP };
    const base = over => Object.assign({ users: [A, B], changes: [], exams: [], deadlines: [], grades: [], plans: [], requests: [], notes: [] }, over);
    const MON_D = '2026-11-23', SUN_D = '2026-11-22';
    const move = { id: 'x1', group: GROUP, date: MON_D, from: 1, to: 2, room: '4112', wasRoom: '3041', at: '2026-11-22T18:05', ack: {} };
    const dl = (id, owner, due) => ({ id, owner, title: 'Срок ' + id, subject: '', due, done: false });
    const list = [
      ['Перенос сегодня до начала пары: срочный и первый', () => {
        const f = feed(base({ changes: [move], deadlines: [dl('a', 't-a', MON_D)] }), A, at(MON_D, '08:40'));
        return f.items[0].kind === 'move' && f.items[0].level === 'urgent' && f.main === f.items[0];
      }],
      ['После начала пары перенос уже не срочный', () => {
        const f = feed(base({ changes: [move], deadlines: [dl('a', 't-a', MON_D)] }), A, at(MON_D, '12:25'));
        return !f.items.some(i => i.kind === 'move') && f.main.kind === 'deadline';
      }],
      ['Срок сегодня выше срока через четыре дня', () => {
        const f = feed(base({ deadlines: [dl('far', 't-a', '2026-11-27'), dl('near', 't-a', MON_D)] }), A, at(MON_D, '08:40'));
        const ids = f.items.map(i => i.id);
        return ids.indexOf('dl-near') === 0 && ids.indexOf('dl-far') === 1 && f.main.id === 'dl-near';
      }],
      ['Нет срочного и важного: «Всё под контролем»', () => {
        const ann = { id: 'n', to: 'students', kind: 'announce', title: '', text: 'Объявление', at: '2026-11-22T10:00', read: {} };
        const f = feed(base({ notes: [ann], deadlines: [dl('later', 't-a', '2026-12-20')] }), A, at(MON_D, '08:40'));
        return f.main === null && f.calm === true && f.rest.length === 2 && f.rest.every(i => i.level === 'fyi');
      }],
      ['В воскресенье ближайший учебный день — понедельник', () => {
        const f = feed(base({}), A, at(SUN_D, '12:00'));
        return f.studyDay === MON_D && studyDay(base({}), GROUP, at(SUN_D, '12:00')) === MON_D && demoDay(at(SUN_D, '12:00')) === MON_D;
      }],
      ['События другого студента в ленту не попадают', () => {
        const req = { id: '9', owner: 't-b', type: 'acad', title: 'Справка', status: 'need', created: '2026-11-22T10:00', due: MON_D, thread: [{ from: 'staff', at: '2026-11-22T11:00', text: 'Вопрос' }] };
        const st = base({
          deadlines: [dl('mine', 't-a', MON_D), dl('other', 't-b', MON_D)], requests: [req],
          grades: [{ id: 'g', owner: 't-b', subject: 'Предмет', points: 10, max: 60, thr: 40 }],
          notes: [{ id: 'p', to: 't-b', kind: 'announce', title: '', text: 'Личное', at: '2026-11-22T10:00', read: {} }]
        });
        const f = feed(st, A, at(MON_D, '08:40'));
        return f.items.length === 1 && f.items[0].id === 'dl-mine' && feed(st, B, at(MON_D, '08:40')).items.length === 3;
      }]
    ].map(([name, fn]) => { let ok = false; try { ok = fn() === true; } catch (e) { ok = false; } return { name, ok }; });
    return { total: list.length, passed: list.filter(x => x.ok).length, list };
  }

  /* ------------------------------------------------------------------ маршруты */
  /* Роль проверяется на каждом маршруте. Чужая роль, неизвестный адрес, чужая или несуществующая заявка — один ответ: notfound. */
  /* Гость видит главную: «home» — её начало, «login» — блок входа на ней же (старый адрес экрана входа).
     Любой другой адрес для гостя тоже ведёт к блоку входа. Вошедшего оба адреса отправляют в кабинет. */
  const ROUTES = {
    home: ['guest'], login: ['guest'], licenses: ['guest', 'student', 'staff'], about: ['guest', 'student', 'staff'],
    today: ['student'], schedule: ['student'], study: ['student'], requests: ['student'],
    req: ['student', 'staff'], notifications: ['student', 'staff'], profile: ['student', 'staff'], staff: ['staff']
  };
  let soft = null;                                   /* адрес в памяти, если менять адресную строку нельзя */
  const Router = {
    home: role => (role === 'staff' ? '#staff' : role === 'student' ? '#today' : '#home'),
    hash() { if (soft !== null) return soft; try { return window.location.hash || ''; } catch (e) { return ''; } },
    parse(hash) {
      const h = String(hash || '').replace(/^#/, '');
      if (!h) return { name: '' };
      const m = /^req-([a-z0-9]{1,12})$/.exec(h);
      if (m) return { name: 'req', id: m[1] };
      return { name: /^[a-z0-9-]{1,40}$/.test(h) && h !== 'req' ? h : '?' };
    },
    resolve(hash, session) {
      const r = Router.parse(hash), role = session ? session.role : 'guest';
      if (role === 'guest') {
        if (r.name === 'licenses' || r.name === 'about') return { view: r.name, name: r.name };
        return { view: 'home', name: r.name, anchor: r.name === 'home' || (!r.name && !Auth.introSeen()) ? '' : 'login' };
      }
      if (!r.name || r.name === 'login' || r.name === 'home') return { redirect: Router.home(role) };
      const roles = pick(ROUTES, r.name);
      if (!roles || !roles.includes(role)) return { view: 'notfound' };
      if (r.name === 'req') return DB.get('request', r.id, session) ? { view: 'req', id: r.id, name: 'req' } : { view: 'notfound' };
      return { view: r.name, name: r.name };
    },
    go(hash) {
      const h = hash.charAt(0) === '#' ? hash : '#' + hash;
      try {
        if (window.location.hash !== h) window.location.hash = h;
        if (window.location.hash === h) soft = null; else soft = h;
      } catch (e) { soft = h; }
      emit('route');
    },
    synced() { soft = null; }
  };

  /* Тема, выбранная раньше, ставится до первой отрисовки. */
  try { const t = prefs().theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* тема по системе */ }

  const api = Object.freeze({
    VERSION: '2.1', esc, clean, fmt, plural, cap, ymd, at, addDays, diffDays,
    DB, Auth, Clock, Sched, Router, feed, admission, runChecks, roomShift,
    SLOTS, REQ_TYPES, STATUS, LEVELS, GROUP, DEAN
  });
  /* Передача экранам — одноразовая: свойство отдаёт модуль первому, кто его прочитал (это c_views.html, следующий
     скрипт страницы), и тут же удаляет себя. После запуска из консоли до данных и входа не дотянуться.
     Это порядок в коде, а не защита: настоящую защиту даёт только сервер, которого в концепте нет. */
  try {
    Object.defineProperty(window, '__dekanat', { configurable: true, enumerable: false, get() { delete window.__dekanat; return api; } });
  } catch (e) { window.__dekanat = api; }
})();
</script>
<script>
/* «Цифровой деканат» · экраны: главная со входом, оболочка, разделы, события, перекидные цифры, тосты, диалоги.
   Данные берутся только через модуль ядра (b_core.html), полученный один раз при запуске и живущий в этом замыкании;
   хранилище браузера экраны не трогают.
   Эффекты (d_fx.html) подключаются по договору: mountFx() после каждой отрисовки и по событию fx:ready.
   Без window.FX всё работает так же, просто без сцены, наклона и пролёта.
   Приближение на главной — своё (homeScroll): оно читает долю прокрутки и от эффектов не зависит. */
(() => {
  'use strict';
  const S = window.__dekanat;                                        /* одноразовая передача: после чтения свойства в window уже нет */
  if (!S) return;
  const { esc, fmt, plural, cap, DB, Auth, Clock, Sched, Router } = S;
  const doc = document, root = doc.documentElement;
  const app = doc.getElementById('app');
  if (!app) return;
  const $ = (sel, el) => (el || doc).querySelector(sel);
  const $$ = (sel, el) => Array.from((el || doc).querySelectorAll(sel));
  const has = (map, key) => typeof key === 'string' && Object.prototype.hasOwnProperty.call(map, key);

  /* ------------------------------------------------------------------ разметка */
  /* Шаблон h`…`: каждое подставленное значение проходит через esc(). Без экранирования идёт только то,
     что само собрано таким же шаблоном или явно помечено raw() — так помечается только свой код, не данные. */
  function Safe(s) { this.s = s; }
  const raw = s => new Safe(String(s));
  const put = v => (v instanceof Safe ? v.s : Array.isArray(v) ? v.map(put).join('') : v === null || v === undefined || v === false ? '' : esc(v));
  const h = (parts, ...vals) => new Safe(parts.reduce((out, part, i) => out + part + (i < vals.length ? put(vals[i]) : ''), ''));
  const ico = (name, cls) => raw('<svg class="' + (cls || 'i') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>');
  /* Атрибуты действия: data-action, параметры и постоянный id, по которому после перерисовки возвращается фокус. */
  const on = (action, params, place) => {
    const p = params || {};
    const tail = [p.id, p.v, p.type, place].filter(x => x !== undefined && x !== null && x !== '').join('-');
    return raw(' data-action="' + esc(action) + '"' + Object.keys(p).map(k => ' data-' + k + '="' + esc(p[k]) + '"').join('') +
      ' id="' + esc('a-' + action + (tail ? '-' + tail : '')) + '"');
  };
  const pressed = yes => raw(' aria-pressed="' + (yes ? 'true' : 'false') + '"');
  const current = yes => (yes ? raw(' aria-current="page"') : '');
  const pct = x => Math.max(0, Math.min(100, Math.round(x * 1000) / 10));
  /* Внутренние ссылки из данных (уведомления): пропускаем только адреса вида #имя. */
  const hrefOf = v => (/^#[a-z0-9-]{1,40}$/.test(String(v || '')) ? String(v) : '#notifications');

  /* ------------------------------------------------------------------ состояние экрана (не данные) */
  const freshUi = () => ({
    why: false,                 /* раскрыт ли текст «Почему это главное» */
    plate: '',                  /* какая плашка уже появлялась: переворот играется один раз */
    open: {},                   /* раскрытые списки */
    drafts: {},                 /* недописанный текст в полях */
    errs: {},                   /* сообщения у форм */
    hints: {},                  /* подсказки, которые уже показаны (печать) */
    sched: { mode: '', date: '', week: 0, fly: false },   /* mode '' — как запомнено (DB.pref) */
    mv: { key: '', step: null },  /* перенос пары: выбранная пара и шаг проверки «кто и что» */
    q: { order: null, st: {} },   /* очередь сотрудника: порядок и статусы, какими их застали на экране */
    rq: { order: null, st: {}, fresh: [] },  /* «Заявки» студента: то же; fresh — заявки, которые человек заказал сам на этом экране */
    flash: '',                  /* id строки, которую подсветить после отрисовки (без прокрутки) */
    tab: 'queue',               /* экран сотрудника на телефоне: очередь, перенос пары или объявление */
    login: { err: '', busy: false },
    focus: '',                  /* id, куда поставить фокус после отрисовки */
    replace: {},                /* сотрудник открыл «Заменить вопрос» у заявки */
    kept: false,                /* черновики этой вкладки уже подняты из хранилища */
    jump: ''                    /* id строки, к которой надо прокрутить после перехода */
  });
  let ui = freshUi();
  let wanted = '';              /* адрес из прямой ссылки гостя (#requests): после входа ведём туда, если роли можно */

  /* ------------------------------------------------------------------ защита от двойного касания */
  /* После смены статуса и любой кнопки действия её место (строка, карточка, блок) 1 с не принимает касаний:
     новая кнопка, появившаяся под пальцем, неактивна, а касание в эту точку гасится. */
  const LOCK_MS = 1000;
  const locks = new Map();
  function lock(key) {
    if (!key) return;
    locks.set(key, Date.now() + LOCK_MS);
    setTimeout(() => { if (!locked(key)) { locks.delete(key); requestRender(); } }, LOCK_MS + 40);
  }
  const locked = key => (locks.get(key) || 0) > Date.now();
  /* data-locked: пока место заблокировано, его кнопки и ссылки не ловят касание (CSS pointer-events) */
  const guard = key => raw(' data-guard="' + esc(key) + '"' + (locked(key) ? ' data-locked' : ''));
  const off = key => (locked(key) ? raw(' disabled') : '');

  /* ------------------------------------------------------------------ перекидные цифры */
  /* Табло: барабан идёт только вперёд через промежуточные цифры, к цели замедляется, знаки меняются каскадом.
     Перелистывание играется один раз, когда значение изменилось; при «меньше движения» цифры просто меняются. */
  const DIGITS = '0123456789';
  const wait = ms => new Promise(done => setTimeout(done, ms));
  const calm = () => { try { return !!window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

  function buildFlaps(el, text) {
    el.textContent = '';
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', text);
    for (const ch of text) {
      const cell = doc.createElement('span');
      cell.setAttribute('aria-hidden', 'true');
      if (DIGITS.includes(ch)) {
        cell.className = 'flap';
        cell.dataset.ch = ch;
        ['half top', 'half bot', 'half top fold', 'half bot fold'].forEach(cls => {
          const half = doc.createElement('span'), sign = doc.createElement('i');
          half.className = cls;
          sign.textContent = ch;
          half.append(sign);
          cell.append(half);
        });
      } else {
        cell.className = 'flap-sep';
        cell.textContent = ch;
      }
      el.append(cell);
    }
  }
  function setCell(cell, ch) {
    cell.dataset.ch = ch;
    Array.from(cell.children).forEach(half => { half.firstChild.textContent = ch; });
  }
  /* Путь барабана от цифры к цифре: только вперёд, по кругу. */
  function drumPath(from, to) {
    const a = DIGITS.indexOf(from), b = DIGITS.indexOf(to);
    if (a < 0 || b < 0) return [to];
    const n = (b - a + DIGITS.length) % DIGITS.length, seq = [];
    for (let i = 1; i <= n; i++) seq.push(DIGITS[(a + i) % DIGITS.length]);
    return seq;
  }
  /* Один щелчок: верхняя половинка падает, нижняя встаёт на место. */
  async function flipStep(cell, next, dur) {
    const [top, bot, foldTop, foldBot] = cell.children;
    foldTop.firstChild.textContent = cell.dataset.ch;
    foldBot.firstChild.textContent = next;
    top.firstChild.textContent = next;
    foldTop.style.visibility = 'visible';
    await foldTop.animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(-90deg)' }], { duration: dur / 2, easing: 'ease-in' }).finished;
    foldTop.style.visibility = 'hidden';
    foldBot.style.visibility = 'visible';
    await foldBot.animate([{ transform: 'rotateX(90deg)' }, { transform: 'rotateX(0deg)' }], { duration: dur / 2, easing: 'ease-out' }).finished;
    bot.firstChild.textContent = next;
    foldBot.style.visibility = 'hidden';
    cell.dataset.ch = next;
  }
  async function flipCell(cell, to, delay) {
    if (cell.dataset.ch === to) return;
    await wait(delay);
    const seq = drumPath(cell.dataset.ch, to);
    for (let i = 0; i < seq.length; i++) {
      const t = seq.length > 1 ? i / (seq.length - 1) : 1;
      await flipStep(cell, seq[i], 56 + 120 * t * t);            /* сначала быстро, к цели медленнее */
    }
  }
  function setFlaps(el, text, instant) {
    text = String(text);
    const cells = $$('.flap', el), chars = Array.from(text).filter(ch => DIGITS.includes(ch));
    el.setAttribute('aria-label', text);
    if (chars.length !== cells.length || Array.from(text).length !== el.children.length) { buildFlaps(el, text); return Promise.resolve(); }
    const still = instant || calm() || !el.offsetParent || typeof el.animate !== 'function';
    if (still) { cells.forEach((cell, i) => setCell(cell, chars[i])); return Promise.resolve(); }
    return Promise.all(cells.map((cell, i) => flipCell(cell, chars[i], i * 70)))
      .catch(() => { if (el.isConnected) buildFlaps(el, text); });   /* блок убрали во время щелчка: показываем итог */
  }
  /* Что уже показывали под этим ключом. Новое значение под старым ключом перелистывается один раз. */
  const shown = new Map();
  /* Первые секунды после входа и после загрузки страница ещё собирается (шрифты, эффекты, переворот плашки):
     табло сразу показывает верное значение, без барабана. Перелистывание остаётся для изменений на глазах. */
  const QUIET_MS = 3000;
  let quietUntil = Date.now() + QUIET_MS;
  function hydrateFlaps(el, hold) {
    const text = el.dataset.flap || '', key = el.dataset.fk || '';
    const still = calm() || Date.now() < quietUntil;
    const before = still ? text : key && shown.has(key) ? shown.get(key) : (el.dataset.from || text);
    if (key) shown.set(key, text);
    buildFlaps(el, before);
    if (before === text) return;
    el.setAttribute('aria-label', text);                             /* вслух читается уже новое значение, пока цифры крутятся */
    wait(hold).then(() => { if (el.isConnected) setFlaps(el, text); });
  }

  /* ------------------------------------------------------------------ тосты и свои диалоги */
  /* Плашка внизу экрана, над нижней панелью: не закрывает ни панель, ни шапку. Уходит при смене раздела.
     opt.undo — функция отмены: в плашке кнопка «Отменить» (opt.label), плашка живёт 7 с.
     opt.held — плашка о сообщении студентам, которое ждёт отправки ({ pid, ref, kind, due }): «Отменить» и «Закрыть».
       Сообщение уходит по первому из событий — плашку закрыли, сделано следующее действие, сменился экран или вход,
       вышел срок, — и в тот же миг плашка исчезает: «Отменить», которое уже ничего не отменяет, на экране не остаётся.
     opt.go — кнопка перехода ({ label, href }), например «Открыть» у сообщения о новом статусе заявки.
     opt.travel — сообщение относится к переходу, который случится сразу за ним, и этот один переход переживает.
     opt.close — у простого сообщения есть «Закрыть», opt.life — сколько оно живёт (мс), например плашка о новом демо-дне.
     opt.valid — проверка «отменять ещё есть что»: как только она ложна (заявку взяли в работу в другой вкладке),
       плашка с «Отменить» уходит при ближайшей отрисовке.
     Кнопки плашки первую секунду неактивны: плашка может появиться прямо под пальцем. */
  let toastTimer = 0, toastTravel = false, held = null, toastValid = null;
  function hideToast() {
    const box = doc.getElementById('toast');
    clearTimeout(toastTimer);
    held = null;
    toastValid = null;
    root.classList.remove('toast-on');
    if (box) { box.hidden = true; box.textContent = ''; }
  }
  /* После следующего действия: если оно само писало в данные, ядро уже отправило ждущее сообщение в той же записи;
     если действие было только на экране (вкладка, «Обновить»), отправляем отдельной записью. */
  function sendAfter(was) {
    const s = Auth.session();
    if (!was || !s || !DB.pending(s).some(p => p.id === was.pid)) return;
    DB.act(s, 'commit', { pid: was.pid });
  }
  /* Отправить ждущее сообщение сейчас и убрать плашку. */
  function commitHeld() {
    if (!held) return;
    const pid = held.pid, s = Auth.session();
    hideToast();
    if (s) DB.act(s, 'commit', { pid });
  }
  function toastButton(id, cls, label, fn) {
    const btn = doc.createElement('button');
    btn.type = 'button';
    btn.className = cls;
    btn.id = id;
    if (cls === 'toast-x') {                                          /* значок собирается узлами: innerHTML здесь не нужен */
      const NS = 'http://www.w3.org/2000/svg', svg = doc.createElementNS(NS, 'svg'), use = doc.createElementNS(NS, 'use');
      svg.setAttribute('class', 'i sm');
      svg.setAttribute('aria-hidden', 'true');
      use.setAttribute('href', '#i-close');
      svg.append(use);
      btn.setAttribute('aria-label', label);
      btn.append(svg);
    }
    else btn.textContent = label;
    btn.disabled = true;
    btn.addEventListener('click', fn);
    return btn;
  }
  function toast(text, opt) {
    const box = doc.getElementById('toast'), o = opt || {};
    if (!box) return;
    if (held && (!o.held || o.held.pid !== held.pid)) commitHeld();  /* новое сообщение — уже следующее действие */
    clearTimeout(toastTimer);
    held = o.held ? Object.assign({}, o.held) : null;
    toastValid = typeof o.valid === 'function' ? o.valid : null;
    box.textContent = '';
    box.classList.toggle('over-nav', painted.layout === 'shell');
    const line = doc.createElement('span');
    line.className = 'toast-t';
    line.textContent = text;
    box.append(line);
    const btns = [];
    if (typeof o.undo === 'function') btns.push(toastButton('toast-undo', 'toast-btn', o.label || 'Отменить', () => { const fn = o.undo; held = null; hideToast(); fn(); }));
    if (o.go) btns.push(toastButton('toast-go', 'toast-btn', o.go.label, () => { const href = o.go.href; hideToast(); Router.go(href); }));
    if (o.held || o.go || o.close) btns.push(toastButton('toast-close', 'toast-x', 'Закрыть', () => (held ? commitHeld() : hideToast())));
    btns.forEach(b => box.append(b));
    if (btns.length) setTimeout(() => btns.forEach(b => { if (b.isConnected) b.disabled = false; }), LOCK_MS);
    box.hidden = false;
    root.classList.add('toast-on');
    toastTravel = !!o.travel;
    const life = o.held ? Math.max(0, Number(o.held.due) - Date.now()) : o.undo ? 7000 : o.life ? o.life : o.go ? 8000 : 4200;
    toastTimer = setTimeout(() => (held ? commitHeld() : hideToast()), life);
  }
  /* Вопрос «да / нет» внутри страницы: alert и confirm в рамке предпросмотра не работают. */
  function ask(opts) {
    return new Promise(resolve => {
      const box = doc.createElement('dialog');
      const backId = doc.activeElement && doc.activeElement.id;
      box.className = 'dlg';
      box.setAttribute('aria-labelledby', 'dlg-t');
      box.setAttribute('aria-describedby', 'dlg-d');
      /* opts.alt — третий исход (ответ 'alt'), opts.noCancel — без кнопки «Отмена» (закрыть можно Esc или мимо окна) */
      box.innerHTML = h`<h2 id="dlg-t">${opts.title}</h2><p id="dlg-d">${opts.text}</p>
        <div class="dlg-actions">${opts.noCancel ? '' : h`<button class="ghost" type="button" data-dlg="no">${opts.cancel || 'Отмена'}</button>`}${opts.alt ? h`<button class="ghost" type="button" data-dlg="alt">${opts.alt}</button>` : ''}<button class="btn" type="button" data-dlg="yes">${opts.ok}</button></div>`.s;
      let done = false;
      const born = Date.now();                                       /* двойной щелчок по кнопке, открывшей окно, не закрывает его */
      const finish = yes => {
        if (done) return;
        done = true;
        try { if (box.open && typeof box.close === 'function') box.close(); } catch (e) { /* закрыт и так */ }
        box.remove();
        const back = backId && doc.getElementById(backId);
        if (back) back.focus();
        resolve(yes);
      };
      box.addEventListener('click', e => {
        if (Date.now() - born < 600) { e.preventDefault(); return; }
        const b = e.target.closest('[data-dlg]');
        if (b) { finish(b.dataset.dlg === 'yes' ? true : b.dataset.dlg === 'alt' ? 'alt' : false); return; }
        const r = box.getBoundingClientRect();                      /* щелчок мимо окна — отмена */
        if (e.target === box && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) finish(false);
      });
      box.addEventListener('cancel', e => { e.preventDefault(); finish(false); });
      box.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); finish(false); } });
      doc.body.append(box);
      let modal = false;
      if (typeof box.showModal === 'function') { try { box.showModal(); modal = true; } catch (e) { modal = false; } }
      if (!modal) { box.setAttribute('open', ''); box.classList.add('dlg-plain'); }
      const first = $('[data-dlg="no"]', box) || $('[data-dlg="yes"]', box);
      if (first) first.focus();
    });
  }

  /* ------------------------------------------------------------------ тема и демо-время */
  const themeNow = () => {
    const t = DB.pref('theme');
    if (t === 'light' || t === 'dark') return t;
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; }
  };
  function applyTheme() {
    const t = DB.pref('theme');
    if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  }
  const themeSeg = place => h`<span class="seg" role="group" aria-label="Тема оформления">
    <button type="button"${on('theme', { v: 'light' }, place)}${pressed(themeNow() === 'light')}>Светлая</button>
    <button type="button"${on('theme', { v: 'dark' }, place)}${pressed(themeNow() === 'dark')}>Тёмная</button></span>`;
  const clockSeg = place => h`<span class="seg" role="group" aria-label="Время на экранах, демо">
    <button type="button"${on('clock', { v: 'now' }, place)}${pressed(Clock.mode() === 'now')}>Сейчас</button>
    <button type="button"${on('clock', { v: 'morning' }, place)}${pressed(Clock.mode() === 'morning')}>Утро учебного дня</button></span>`;

  /* ------------------------------------------------------------------ оболочка: меню, шапка, подвал */
  const BRAND = 'Цифровой деканат';
  /* Сборка ставит сюда «1», если в ней есть и эффекты, и фото сцены: главная заранее знает, что кадр будет тёмным. */
  const SCENE = '1' === '1';
  const SECTION = { today: 'today', schedule: 'schedule', study: 'study', requests: 'requests', notifications: 'notifications', profile: 'profile', licenses: 'profile', about: '', staff: 'staff' };
  function navPart(c, section) {
    const n = c.unread, staff = c.me.role === 'staff';
    const link = (name, label, icon, cls, extra) =>
      h`<a href="#${name}"${cls ? raw(' class="' + cls + '"') : ''}${current(section === name)}>${ico(icon)}<span>${label}</span>${extra || ''}</a>`;
    const count = n ? h`<span class="cnt" aria-hidden="true">${n > 99 ? '99+' : n}</span><span class="vh">, непрочитанных: ${n}</span>` : '';
    return h`<div class="brand"><span class="word">${BRAND}</span></div>
      ${staff ? link('staff', 'Очередь', 'queue') : [link('today', 'Сегодня', 'today'), link('schedule', 'Расписание', 'cal'), link('study', 'Учёба', 'book'), link('requests', 'Заявки', 'doc')]}
      ${link('notifications', 'Уведомления', 'bell', staff ? '' : 'wide', count)}
      ${link('profile', 'Профиль', 'user', staff ? '' : 'wide')}
      ${staff ? '' : h`<a class="narrow" href="#profile"${current(section === 'profile')}>${ico('user')}<span>Профиль</span></a>`}
      <span class="grow"></span>
      <div class="who wide"><span class="ava" aria-hidden="true">${c.me.initials}</span><span><b>${c.me.name}</b><br>${c.me.about}</span></div>
      <button type="button"${on('logout', {}, 'nav')}>${ico('out')}<span>Выйти</span></button>`;
  }
  function barPart(c, section) {
    const n = c.unread;
    return h`<a class="word" href="${Router.home(c.me.role)}">${BRAND}</a><span class="sp"></span>
      <a class="ico" href="#notifications" aria-label="${n ? 'Уведомления, непрочитанных: ' + n : 'Уведомления'}"${current(section === 'notifications')}>${ico('bell')}${n ? h`<span class="unread n" aria-hidden="true">${n > 99 ? '99+' : n}</span>` : ''}</a>
      <a class="ava" href="#profile" aria-label="Профиль: ${c.me.name}">${c.me.initials}</a>`;
  }
  /* Подвал кабинета — две ссылки. Тема живёт в профиле, демо-время и всё для жюри — на экране «О концепте». */
  function footPart(view) {
    return h`<a href="#about"${current(view === 'about')}>О концепте</a><a href="#licenses"${current(view === 'licenses')}>Лицензии</a>`;
  }
  /* Метка прототипа (образец — GOV.UK Phase banner): одна строка под шапкой каждого экрана кабинета, не закреплена,
     уходит при прокрутке. На главной она стоит у блока входа, а не поверх сцены. */
  const PROTO = '<p class="proto"><b>Прототип.</b> Не официальный сервис вуза</p>';
  const guestBar = () => h`<a class="word" href="#home">${BRAND}</a><span class="sp"></span><a class="ghost" href="#login">Ко входу</a>`;
  /* У гостя профиля нет: тема остаётся в подвале. */
  const guestFoot = () => h`<span class="foot-set"><span>Тема</span>${themeSeg('foot')}</span><a href="#about">О концепте</a><a href="#licenses">Лицензии</a>`;

  /* ------------------------------------------------------------------ отрисовка */
  /* Экран собирается из частей. Часть перерисовывается, только если её разметка изменилась:
     чужое событие из другой вкладки не трогает то, что человек сейчас читает или печатает. */
  const SKELETON = {
    shell: '<div class="shell"><nav class="nav" aria-label="Разделы" data-part="nav"></nav><header class="bar" data-part="bar"></header>' +
      '<div class="phase" data-part="proto"></div><main class="main" id="main" tabindex="-1" data-part="main"></main><footer class="foot" data-part="foot"></footer></div>',
    plain: '<div class="shell plain"><header class="bar" data-part="bar"></header><div class="phase" data-part="proto"></div>' +
      '<main class="main" id="main" tabindex="-1" data-part="main"></main><footer class="foot" data-part="foot"></footer></div>',
    /* Главная: шапка с меткой и кнопкой «Войти», закреплённый первый экран, страница деканата со входом, подвал.
       Класс photo — «на первом экране будет фото»: ставится сразу, чтобы кадр не мигал, пока сцена грузится. */
    home: '<div class="home' + (SCENE ? ' photo' : '') + '"><header class="home-top" data-part="top"></header><main id="main" tabindex="-1">' +
      '<section class="hero" aria-label="MGIMO University. Цифровой деканат" data-part="hero"></section>' +
      '<div class="home-body" data-part="enter"></div></main><footer class="home-foot" data-part="foot"></footer></div>'
  };
  let painted = { layout: '', parts: {} }, lastKey = null, lastHash = null, booted = false, queued = false;

  /* Эффекты по договору: каждая функция FX возвращает очистку; очистка зовётся перед перерисовкой части. */
  const fxOff = new Map();
  let fxSlots = [];
  function unmountFx(box) {
    fxOff.forEach((off, el) => {
      if (box && !box.contains(el)) return;
      try { off(); } catch (e) { /* очистка эффекта не должна ломать экран */ }
      fxOff.delete(el);
    });
  }
  function mountFx() {
    const FX = window.FX;
    const start = (el, run) => {
      if (!el || fxOff.has(el)) return;
      let off = null;
      try { off = run(); } catch (e) { off = null; }
      fxOff.set(el, typeof off === 'function' ? off : () => {});
    };
    const hero = $('.hero', app);
    if (hero) start(hero, () => homeScroll(hero));                  /* приближение на главной: своё, работает и без эффектов */
    $$('[data-fx]', app).forEach(el => { el.hidden = !FX; });
    if (!FX) return;
    /* Плашка переноса больше не зовёт FX.now: кнопки «Показать, как было» и слоя «как было» на «Сегодня» нет (NEXT 3.2.4). */
    const photo = $('.login-photo', app), fly = $('.fly', app);
    if (photo && typeof FX.login === 'function') {
      const fresh = !fxOff.has(photo);
      start(photo, () => FX.login(photo));
      /* Сцена приходит позже приближения (fx:ready): повторяем ей текущую просьбу fx:hold, иначе она не знает, что кадр
         уже закрыт завесой (например, страница открыта сразу у блока входа), и кнопки обложки остаются над входом. */
      const n = Number(photo.dataset.hold || 0);
      if (fresh && n) { try { photo.dispatchEvent(new CustomEvent('fx:hold', { detail: n })); } catch (e) { /* сцена просто не притихнет */ } }
    }
    if (fly && typeof FX.fly === 'function') start(fly, () => FX.fly(fly, fxSlots));
  }

  /* Образец справки дублируется в отдельный блок страницы: на печать уходит только он. */
  function syncPrint() {
    const paper = $('.paper', app);
    let box = doc.getElementById('print-root');
    if (!paper) {
      if (box) box.remove();
      root.classList.remove('has-paper');
      return;
    }
    if (!box) {
      box = doc.createElement('div');
      box.id = 'print-root';
      box.setAttribute('aria-hidden', 'true');
      doc.body.append(box);
    }
    if (box.innerHTML !== paper.outerHTML) box.innerHTML = paper.outerHTML;
    root.classList.add('has-paper');
  }

  /* Мелкое состояние экрана, которое не входит в разметку частей: применяется после каждой отрисовки. */
  function applyUi() {
    const plate = $('.now[data-plate]', app);
    if (plate) {
      const text = $('.why', plate), btn = $('[data-action="why"]', plate);
      if (text) text.hidden = !ui.why;
      if (btn) btn.setAttribute('aria-expanded', String(!!ui.why));
    }
    $$('[data-err]', app).forEach(el => { const t = ui.errs[el.dataset.err] || el.dataset.fallback || ''; el.textContent = t; el.hidden = !t; });
    $$('[data-hint]', app).forEach(el => { el.hidden = !ui.hints[el.dataset.hint]; });
    const go = doc.getElementById('lg-go');
    if (go) { go.disabled = ui.login.busy; go.textContent = ui.login.busy ? 'Проверяем…' : 'Войти'; }
    syncPrint();
  }
  function hydrate(boxes) {
    const plate = $('.now[data-plate]', app);
    let hold = 0;
    if (plate && ui.plate !== plate.dataset.plate) {
      ui.plate = plate.dataset.plate;                               /* новая плашка: один переворот при появлении */
      ui.why = false;
      plate.classList.add('enter');
      plate.addEventListener('animationend', e => { if (e.target === plate) plate.classList.remove('enter'); });
      hold = calm() ? 0 : 640;
    }
    boxes.forEach(box => {
      $$('.flaps[data-flap]', box).forEach(el => hydrateFlaps(el, plate && plate.contains(el) ? hold : 0));
      $$('details[data-open]', box).forEach(d => { d.open = !!ui.open[d.dataset.open]; });
      $$('[data-draft]', box).forEach(el => {
        const v = ui.drafts[draftKey(el)];
        if (v === undefined) return;
        if (el.tagName === 'SELECT' && !Array.from(el.options).some(o => o.value === v)) return;
        el.value = v;
      });
    });
    applyUi();
  }

  function paint(page) {
    const active = doc.activeElement;
    const focusId = active && active !== doc.body && app.contains(active) ? active.id : '';
    let caret = null, lost = null;
    if (focusId && typeof active.selectionStart === 'number') { try { caret = [active.selectionStart, active.selectionEnd]; } catch (e) { caret = null; } }
    if (painted.layout !== page.layout) {
      unmountFx(null);
      app.innerHTML = SKELETON[page.layout];
      painted = { layout: page.layout, parts: {} };
    }
    const changed = [];
    Object.keys(page.parts).forEach(name => {
      const html = page.parts[name];
      if (painted.parts[name] === html) return;
      const box = $('[data-part="' + name + '"]', app);
      if (!box) return;
      if (active && box.contains(active)) lost = box;
      unmountFx(box);
      box.innerHTML = html;
      painted.parts[name] = html;
      changed.push(box);
    });
    fxSlots = page.slots || [];
    hydrate(changed);
    doc.title = page.docTitle || page.title + ' · ' + BRAND;
    const moved = page.key !== lastKey, hashNow = Router.hash(), routed = hashNow !== lastHash;
    lastKey = page.key;
    lastHash = hashNow;
    if (moved) {                                                   /* сообщение прежнего раздела в новый не переезжает */
      if (held) commitHeld();                                      /* сменился экран: ждущее сообщение студентам уходит */
      if (toastTravel) toastTravel = false; else hideToast();
    }
    if (page.layout === 'home' && page.anchor === 'login' && (moved || routed)) {
      toLogin(booted);                                             /* старый адрес #login и кнопка «Войти»: сразу к блоку входа */
    } else if ((moved || (routed && page.layout === 'home')) && booted) {
      try { window.scrollTo(0, 0); } catch (e) { /* не страшно */ }
      const top = $('h1', app);
      if (top) { top.setAttribute('tabindex', '-1'); top.focus({ preventScroll: true }); }
    } else if (lost) {
      /* Часть с фокусом перерисована: возвращаем фокус туда же, а если кнопки больше нет — на главный блок части. */
      const same = focusId ? doc.getElementById(focusId) : null;
      const target = same && !same.disabled ? same : $('[data-autofocus]', lost);
      if (target) {
        target.focus({ preventScroll: true });
        if (same && caret && typeof target.setSelectionRange === 'function') { try { target.setSelectionRange(caret[0], caret[1]); } catch (e) { /* не текстовое поле */ } }
      }
    }
    /* Ссылка вела к конкретной строке (срок, блок «О концепте»): показываем её, а не верх страницы. */
    if (ui.jump) {
      const row = doc.getElementById(ui.jump);
      ui.jump = '';
      if (row) {
        try { row.scrollIntoView({ block: 'center' }); } catch (e) { /* останется верх страницы */ }
        row.classList.add('flash');
      }
    }
    if (ui.flash) {                                                /* своя новая строка: короткая подсветка, страница не двигается */
      const row = doc.getElementById(ui.flash);
      ui.flash = '';
      if (row) row.classList.add('flash-in');
    }
    if (ui.focus) {                                                /* шаг проверки, поле ответа: фокус туда, где продолжать */
      const el = doc.getElementById(ui.focus);
      ui.focus = '';
      if (el) { if (!el.hasAttribute('tabindex') && !/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(el.tagName)) el.setAttribute('tabindex', '-1'); el.focus({ preventScroll: false }); }
    }
    booted = true;
    mountFx();
    return page;
  }

  /* ------------------------------------------------------------------ общие куски экранов */
  const head = (title, sub) => h`<h1 class="h1" tabindex="-1">${title}</h1>${sub ? h`<p class="sub">${sub}</p>` : ''}`;
  const levelTag = level => h`<span class="tag ${level}">${S.LEVELS[level]}</span>`;
  const moveSign = () => ico('move', 'sign');
  const EXAM_WORD = { test: 'Зачёт', exam: 'Экзамен' };
  const shortDay = date => fmt.dayShort(date).slice(0, 2) + ', ' + fmt.date(date);              /* Пт, 27 ноября */
  const startOf = n => Sched.SLOTS[n][0];
  const low = s => String(s).charAt(0).toLowerCase() + String(s).slice(1);
  /* «две пары», «одна пара и зачёт», «пар нет» */
  function dayCount(pairs) {
    const ex = pairs.filter(p => p.exam), reg = pairs.length - ex.length;
    if (!ex.length) return fmt.pairs(reg).toLowerCase();
    const tail = ex.length === 1 ? ex[0].type.toLowerCase() : ex.length + ' ' + plural(ex.length, 'испытание', 'испытания', 'испытаний');
    return reg ? fmt.pairs(reg).toLowerCase() + ' и ' + tail : tail;
  }
  /* «две пары, обе перенесены», «три пары, одна перенесена», «одна пара, она перенесена» */
  function movedNote(m, n) {
    if (!m) return '';
    if (m === n) return n === 1 ? ', она перенесена' : n === 2 ? ', обе перенесены' : ', все перенесены';
    const w = ['', 'одна', 'две', 'три', 'четыре'][m] || String(m);
    return ', ' + w + (m === 1 ? ' перенесена' : ' перенесены');
  }
  function slotRow(p, now) {
    const past = S.at(p.date, p.end) <= now, live = !past && S.at(p.date, p.start) <= now;
    return h`<div class="slot${p.moved ? ' moved' : ''}${past ? ' past' : ''}">
      <time datetime="${p.date}T${p.start}">${p.start}<small>до ${p.end}</small>${p.moved ? h`<s><span class="vh">было в </span>${p.was.start}</s>` : ''}</time>
      <div class="info">
        <p class="t">${p.exam ? h`<span class="tag exam">${p.type}</span> ` : ''}${p.subject}</p>
        <p class="m">${p.exam ? '' : p.type + ' · '}ауд. ${p.room}${p.moved && p.was.room !== p.room ? ' (была ' + p.was.room + ')' : ''}${past ? ' · прошла' : live ? ' · идёт сейчас' : ''}</p>
        ${p.moved ? h`<span class="chip-move">${moveSign()}Перенос с ${p.was.start}</span>` : ''}
      </div></div>`;
  }
  const dayBlock = (day, now, title) => h`<section class="day" aria-label="${title}"><h2>${title}</h2>
    ${day.pairs.length ? day.pairs.map(p => slotRow(p, now)) : h`<p class="empty">В этот день пар нет.</p>`}</section>`;
  /* Полоса допуска: сплошная — баллы, пунктир — порог. Число стоит над ней, шаг «что сделать» — под ней. */
  /* Свои баллы — сплошная полоса: их ставит преподаватель. Сданные, но не проверенные работы — штриховка «до N». */
  const admBar = (points, max, thr, pending) => h`<div class="barx" role="img" aria-label="${points} из ${max} баллов${pending ? ', ещё до ' + pending + ' после проверки' : ''}, порог допуска ${thr}">
    <div class="bar-track"><div class="bar-fill" style="width:${pct(points / max)}%"></div>${pending ? h`<div class="bar-hope" style="left:${pct(points / max)}%;width:${pct(pending / max)}%"></div>` : ''}<div class="bar-thr" style="left:${pct(thr / max)}%"><span>порог ${thr}</span></div></div>
    <span class="bar-me${pending ? ' wide' : ''}" style="left:${pct(points / max)}%">у вас ${points}${pending ? ' + до ' + pending + ' после проверки' : ''}</span>
    <div class="bar-ends"><span>0</span><span>${max}</span></div></div>`;

  /* ------------------------------------------------------------------ «Главное сейчас» */
  const whyBtn = () => h`<button class="link-btn" type="button" data-action="why" id="a-why" aria-expanded="false" aria-controls="why">Почему это главное</button>`;
  const whyText = m => h`<p class="why" id="why" hidden>${m.why}</p>`;
  function calmPlate(f) {
    return h`<section class="now" data-plate="calm" data-autofocus${guard('plate')} tabindex="-1" aria-label="Главное сейчас: всё под контролем">
      <div class="now-head"><span class="kind">${ico('check')}Всё под контролем</span></div>
      <p class="now-line">Срочного и важного нет.</p>
      <div class="now-actions"><a class="btn" href="#schedule" id="a-open-sched">Посмотреть расписание</a></div>
    </section>`;
  }
  /* Вопрос деканата прямо на «Сегодня»: вопрос и кнопки ответа видны без раскрытий (0 касаний до кнопок).
     Обе кнопки ответа — одного, второстепенного стиля. Заголовок ведёт в заявку: там можно ответить своими словами.
     main — вопрос и есть «Главное сейчас» (плашка с переворотом); иначе это карточка под главным. */
  function askCard(i, c, main) {
    const r = c.v.requests.find(x => x.id === i.reqId);
    const q = r ? r.thread.filter(m => m.from === 'staff').slice(-1)[0] : null;
    const opts = q && Array.isArray(q.options) ? q.options : [];
    const g = main ? 'plate' : 'thr-' + i.reqId;
    const label = main ? 'Главное сейчас: ' + S.LEVELS[i.level].toLowerCase() + ', вопрос деканата' : 'Вопрос деканата';
    return h`<section class="${main ? 'now important ask' : 'card ask'}"${main ? raw(' data-plate="' + esc(i.id) + '" data-autofocus tabindex="-1"') : ''}${guard(g)} aria-label="${label}">
      <div class="now-head">${levelTag(i.level)}<span class="kind">Вопрос деканата</span></div>
      <h3><a href="#req-${i.reqId}" id="a-ask-${i.reqId}">${i.reqTitle}</a></h3>
      ${i.question ? h`<p class="msg staff">${i.question}</p>` : ''}
      ${opts.length ? h`<div class="answers" role="group" aria-label="Варианты ответа">${opts.map((o, k) => h`<button class="ghost" type="button"${on('answer', { id: i.reqId, v: String(k) }, 'today')}${off(g)}>${o}</button>`)}</div>`
        : h`<div class="now-actions"><a class="btn" href="#req-${i.reqId}" id="a-open-need">Ответить</a></div>`}
    </section>`;
  }
  /* Три события выглядят по-разному: перенос — янтарная плашка со старым и новым временем;
     срок — спокойная строка с датой; риск недопуска — число над полосой и шаг «что сделать».
     Метка на карточке одна — уровень важности; что за событие, сказано словами рядом. */
  function plate(f, c) {
    const m = f.main;
    if (!m) return calmPlate(f);
    const label = 'Главное сейчас: ' + S.LEVELS[m.level].toLowerCase();
    if (m.kind === 'move') {
      /* Пара не сегодня: день стоит крупно, отдельной строкой над временем, а не мелко рядом с аудиторией. */
      const dayLine = m.isToday ? '' : h`<p class="now-day">${cap(m.dayWord)}</p>`;
      return h`<section class="now urgent on-amber" data-plate="${m.id}" data-autofocus${guard('plate')} tabindex="-1" aria-label="${label}, пара перенесена">
        <div class="now-head">${levelTag(m.level)}<span class="kind">${moveSign()}Пара перенесена</span></div>
        <h3>${m.title}</h3>${dayLine}
        <div class="shift"><s class="was"><span class="vh">было в </span>${m.was.start}</s>${ico('arrow')}<span class="vh">стало в</span><span class="flaps" data-flap="${m.start}" data-from="${m.was.start}" data-fk="${m.id}"></span></div>
        <p class="room">Аудитория ${m.was.room !== m.room ? h`<s><span class="vh">была </span>${m.was.room}</s>${ico('arrow', 'i sm')}` : ''}<b>${m.room}</b></p>
        <div class="now-actions"><button class="btn" type="button"${on('ack', { id: m.changeId })}>Убрать с главного</button>${whyBtn()}</div>
        ${whyText(m)}
      </section>`;
    }
    if (m.kind === 'risk') {
      return h`<section class="now important" data-plate="${m.id}" data-autofocus${guard('plate')} tabindex="-1" aria-label="${label}, допуск к экзамену">
        <div class="now-head">${levelTag(m.level)}<span class="kind">Допуск к экзамену</span></div>
        <h3>${m.subject}</h3>
        <p class="adm-big"><span class="flaps" data-flap="${m.need}" data-fk="adm-${m.subject}"></span><span>${plural(m.need, 'балл', 'балла', 'баллов')} ${m.pending ? 'осталось закрыть' : 'до допуска'}</span></p>
        ${admBar(m.points, m.max, m.thr, m.pending)}
        <p><b>Что сделать.</b> ${m.step}</p>
        <div class="now-actions"><a class="btn" href="#study" id="a-open-plan">Посмотреть план</a>${whyBtn()}</div>
        ${whyText(m)}
      </section>`;
    }
    if (m.kind === 'need') return askCard(m, c, true);
    return h`<section class="now important" data-plate="${m.id}" data-autofocus${guard('plate')} tabindex="-1" aria-label="${label}, срок">
      <div class="now-head">${levelTag(m.level)}<span class="kind">${m.left < 0 ? m.line : 'Срок: ' + low(m.line)}</span></div>
      <h3>${m.title}</h3>
      ${m.subject ? h`<p class="muted">${m.subject}</p>` : ''}
      <div class="now-actions"><a class="btn" href="#study" id="a-open-study" data-action="jump" data-jump="${m.jump || ''}">Открыть работу</a>${whyBtn()}</div>
      ${whyText(m)}
    </section>`;
  }

  /* ------------------------------------------------------------------ Сегодня: три вещи */
  const jumpTo = i => (i.jump ? raw(' data-action="jump" data-jump="' + esc(i.jump) + '"') : '');
  const restItem = i => h`<a class="item" href="${hrefOf(i.href)}"${jumpTo(i)}>${levelTag(i.level)}<p class="t">${i.kind === 'move' ? moveSign() : ''}${i.title}</p><p class="m">${i.line}</p></a>`;
  /* Плитка «Остальное» на ноутбуке: одна метка (важность), что за событие — словами в крупной строке. */
  function restTile(i) {
    const value = i.kind === 'move' ? 'Перенос на ' + i.start
      : i.kind === 'deadline' ? 'Срок: ' + low(i.value)
      : i.kind === 'risk' ? h`${i.value} <small>до допуска</small>`
      : i.kind === 'announce' ? i.title : i.value;
    const note = i.kind === 'move' ? (i.isToday ? '' : cap(i.dayWord) + ' · ') + i.subject + ': ' + i.was.start + ' → ' + i.start + ', ' + S.roomShift(i.was.room, i.room, true)
      : i.kind === 'deadline' ? i.title
      : i.kind === 'risk' ? i.subject + '. ' + i.short
      : i.line;
    return h`<a class="tile" href="${hrefOf(i.href)}"${jumpTo(i)}><span class="k">${levelTag(i.level)}${i.kind === 'move' ? moveSign() : ''}</span>
      <span class="v${i.kind === 'announce' ? ' sm' : ''}">${value}</span><span class="m">${note}</span></a>`;
  }
  /* «Следующая пара: 10:40, ауд. 1011» — крупно, первой строкой экрана. */
  function nextLine(f) {
    const p = f.next;
    if (!p) return h`<section class="next" aria-label="Следующая пара"><p class="next-t">Ближайших пар нет</p></section>`;
    const when = p.date === f.today ? '' : S.diffDays(p.date, f.today) === 1 ? 'завтра, ' : fmt.onDay(p.date) + ', ';
    return h`<section class="next" aria-label="Следующая пара"><p class="next-t">Следующая пара: ${when}<b class="num">${p.start}</b>, <span class="nw">ауд. <b class="num">${p.room}</b></span></p>
      <p class="next-m">${p.moved ? moveSign() : ''}${p.subject}, ${p.type.toLowerCase()}${p.moved ? ' · перенос с ' + p.was.start : ''}</p></section>`;
  }
  /* Готовая справка — одной строкой. */
  const readyRow = i => h`<a class="due ready" href="${hrefOf(i.href)}">${ico('check')}<span class="due-t"><b>${i.title}</b></span>${ico('arrow', 'i sm')}</a>`;
  function viewToday(c) {
    const f = S.feed(c.v, c.me, c.now), group = c.me.group;
    const day = Sched.day(c.v, group, f.studyDay), mine = Sched.day(c.v, group, f.today).pairs;
    const isToday = f.studyDay === f.today, movedN = day.pairs.filter(p => p.moved).length;
    const about = isToday
      ? dayCount(day.pairs) + movedNote(movedN, day.pairs.filter(p => !p.exam).length)
      : mine.length ? 'пары на сегодня закончились' : 'сегодня пар нет';
    const sub = fmt.dayLong(f.today) + ' · ' + about;
    const title = isToday ? 'Пары сегодня' : 'Ближайший учебный день: ' + fmt.weekday(f.studyDay) + ', ' + fmt.date(f.studyDay);
    /* Срок, который истекает сегодня, не прячется в «Остальное»: он стоит отдельной строкой сразу под главным.
       Вопрос деканата — карточкой с кнопками ответа над главной плашкой: на телефоне кнопки ответа оказываются в средней
       части первого экрана (0 касаний, решение 11), а плашка переноса с её кнопкой — следом, тоже в первом экране.
       Готовая справка — строкой. В «Остальное» они не уходят. */
    const hot = f.rest.filter(i => i.kind === 'deadline' && i.left <= 0);
    const asks = f.rest.filter(i => i.kind === 'need'), ready = f.rest.filter(i => i.kind === 'ready');
    const rest = f.rest.filter(i => !hot.includes(i) && !asks.includes(i) && !ready.includes(i));
    const n = rest.length, words = Array.from(new Set(rest.map(i => i.word))).slice(0, 3).join(', ');
    const hotRow = i => h`<a class="due" href="#study"${jumpTo(i)}>${levelTag(i.level)}<span class="due-t"><b>${i.left < 0 ? 'Срок прошёл' : 'Срок сегодня'}: ${i.title}</b>
      <small>${i.subject ? i.subject + ' · ' : ''}${low(i.line)}</small></span>${ico('arrow', 'i sm')}</a>`;
    return { title: 'Сегодня', main: h`${head('Сегодня', sub)}
      <div class="cols">
        <div class="stack"${guard('today')}>
          ${nextLine(f)}
          <h2 class="side-h main-h">Главное сейчас</h2>
          ${asks.map(i => askCard(i, c, false))}
          ${plate(f, c)}
          ${hot.map(hotRow)}
          ${ready.map(readyRow)}
          ${dayBlock(day, c.now, title)}
          <details class="more only-narrow" data-open="rest">
            <summary id="rest-sum"><b>Остальное: ${n}</b><span>${n ? words : 'больше ничего нет'}</span><span class="sp"></span>${ico('chev')}</summary>
            ${n ? rest.map(restItem) : h`<p class="empty">Всё важное — выше.</p>`}
          </details>
        </div>
        <aside class="stack only-wide" aria-label="Остальное">
          <h2 class="side-h">Остальное: ${n}</h2>
          <div class="tiles">${n ? rest.map(restTile) : h`<div class="tile"><span class="m">Больше ничего нет: всё важное — слева.</span></div>`}</div>
        </aside>
      </div>` };
  }

  /* ------------------------------------------------------------------ Расписание: день и неделя */
  const WEEK_MIN = -1, WEEK_MAX = 5;
  function weekSpan(a, b) {                                          /* 23–28 ноября · 30 ноября – 5 декабря */
    const da = fmt.date(a).split(' '), db = fmt.date(b).split(' ');
    return da[1] === db[1] ? da[0] + '–' + db.join(' ') : da.join(' ') + ' – ' + db.join(' ');
  }
  function weekGrid(week, c) {
    const used = [3];
    week.forEach(d => { d.pairs.forEach(p => used.push(p.n)); d.ghosts.forEach(g => used.push(g.n)); });
    const last = Math.max.apply(null, used);
    const cells = [h`<div class="wk-h"><span class="vh">Время</span></div>`];
    week.forEach(d => cells.push(h`<div class="wk-h${d.date === c.today ? ' today' : ''}">${fmt.dayShort(d.date)}${d.date === c.today ? ', сегодня' : ''}</div>`));
    for (let n = 0; n <= last; n++) {
      cells.push(h`<div class="wk-t">${startOf(n)}</div>`);
      week.forEach(d => {
        const p = d.pairs.find(x => x.n === n), g = d.ghosts.find(x => x.n === n);
        const where = h`<span class="vh">${fmt.dayLong(d.date)}, ${startOf(n)}: </span>`;
        cells.push(h`<div>${g ? h`<div class="ev ghost">${where}<b><s>${g.subject}</s></b><span>перенесено на ${g.to}</span></div>` : ''}${p
          ? h`<div class="ev ${p.moved ? 'moved' : p.kind}">${where}<b>${p.subject}</b><span>${p.type} · ${p.room}</span>${p.moved ? h`${moveSign()}<span class="vh">перенос с ${p.was.start}</span>` : ''}</div>` : ''}</div>`);
      });
    }
    return h`<div class="wk-grid"><div class="week-wrap" tabindex="0" role="region" aria-label="Сетка недели">
      <div class="week">${cells}</div></div></div>`;
  }
  const weekCards = (week, c) => h`<div class="wk-cards">${week.map(d => h`<div class="dcard">
    <h2>${fmt.dayLong(d.date)} <small>${d.date === c.today ? 'сегодня · ' : ''}${dayCount(d.pairs)}</small></h2>
    ${d.pairs.length ? h`<ul>${d.pairs.map(p => h`<li><time datetime="${p.date}T${p.start}">${p.start}</time><span>${p.exam ? h`<span class="tag exam">${p.type}</span> ` : ''}${p.subject} · ${p.exam ? '' : p.type.toLowerCase() + ' · '}${p.room}${p.moved
      ? h`<br><span class="chip-move">${moveSign()}Перенос</span> <s><span class="vh">было в </span>${p.was.start}</s>${p.was.room !== p.room ? h` <span class="was-room">(была ауд. ${p.was.room})</span>` : ''}` : ''}</span></li>`)}</ul>` : ''}
  </div>`)}</div>`;
  const legend = () => h`<div class="legend" aria-label="Обозначения">
    <span><i class="key lec"></i>Лекция</span><span><i class="key sem"></i>Семинар или практикум</span><span><i class="key exam"></i>Зачёт или экзамен</span>
    <span><i class="key moved"></i>Перенос, новое время</span><span><i class="key ghost"></i>Перенос, прежнее время</span></div>`;
  /* Вид «День / Неделя» запоминается для этого человека в этом браузере (как тема). */
  const schedMode = me => {
    const m = ui.sched.mode || (me ? DB.pref('week:' + me.id) : '');
    return m === 'week' ? 'week' : 'day';
  };
  function viewSchedule(c) {
    const group = c.me.group, sd = Sched.studyDay(c.v, group, c.now);
    const shift = Math.max(WEEK_MIN, Math.min(WEEK_MAX, ui.sched.week | 0));
    const week = Sched.week(c.v, group, S.addDays(sd, 7 * shift));
    const dates = week.map(d => d.date);
    const date = dates.includes(ui.sched.date) ? ui.sched.date : dates.includes(sd) ? sd : dates[0];
    const mode = schedMode(c.me);
    const day = week[dates.indexOf(date)];
    /* «К сегодня» — когда открыта не текущая неделя. На широком экране кнопка встаёт после стрелок, на узком —
       в первый ряд рядом с «День / Неделя» (там есть место): стрелки и ряд дней не сдвигаются. */
    const away = shift !== 0;
    const tools = h`<div class="toolbar">
      <span class="seg" role="group" aria-label="Вид расписания">
        <button type="button"${on('sched-mode', { v: 'day' })}${pressed(mode === 'day')}>День</button>
        <button type="button"${on('sched-mode', { v: 'week' })}${pressed(mode === 'week')}>Неделя</button></span>
      <span class="wk-nav"><button class="ico" type="button"${on('sched-week', { v: 'prev' })} aria-label="Предыдущая неделя"${shift <= WEEK_MIN ? raw(' disabled') : ''}>${ico('back')}</button>
        <b class="num">${weekSpan(dates[0], dates[5])}</b>
        <button class="ico" type="button"${on('sched-week', { v: 'next' })} aria-label="Следующая неделя"${shift >= WEEK_MAX ? raw(' disabled') : ''}>${ico('arrow')}</button></span>
      ${away ? h`<button class="ghost to-today" type="button"${on('sched-today')}>К сегодня</button>` : ''}
    </div>`;
    /* «Пролистать день» (пролёт по парам, d_fx.html) — не в верхнем ряду, а тихой ссылкой под парами дня. */
    const flyBtn = h`<p class="fly-row" data-fx hidden><button class="link-btn" type="button"${on('fly')}${pressed(ui.sched.fly)}>${ui.sched.fly ? 'Свернуть пролёт' : 'Пролистать день'}</button></p>`;
    if (mode === 'week') {
      return { title: 'Расписание', main: h`${head('Расписание', 'Неделя: ' + weekSpan(dates[0], dates[5]))}${tools}
        ${weekGrid(week, c)}${weekCards(week, c)}${legend()}` };
    }
    const moves = [];
    week.forEach(d => d.pairs.forEach(p => { if (p.moved) moves.push(p); }));
    const exam = c.v.exams.filter(e => e.date >= c.today).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.slot - b.slot))[0];
    const tail = date === c.today ? ' · сегодня' : S.diffDays(date, c.today) === 1 ? ' · завтра' : '';
    const slots = day.pairs.map(p => ({ n: p.n + 1, start: p.start, end: p.end, title: p.subject, room: p.room, kind: p.type, moved: p.moved,
      past: S.at(p.date, p.end) <= c.now, was: p.was ? { start: p.was.start, end: p.was.end, room: p.was.room } : null }));
    return { title: 'Расписание', slots, main: h`${head('Расписание', fmt.dayLong(date) + tail + ' · ' + dayCount(day.pairs))}${tools}
      <div class="seg days" role="group" aria-label="День недели">${dates.map(d => h`<button type="button"${on('sched-day', { id: d })}${pressed(d === date)}${d === c.today ? raw(' class="today"') : ''}>
        <span>${fmt.dayShort(d).slice(0, 2)}</span><b class="num">${Number(d.slice(8))}</b>${d === c.today ? h`<span class="vh">, сегодня</span>` : ''}</button>`)}</div>
      <div class="cols">
        <div class="stack">${dayBlock(day, c.now, fmt.dayLong(date) + tail)}${flyBtn}${ui.sched.fly ? h`<div class="fly" data-fx></div>` : ''}</div>
        <aside class="stack" aria-label="На неделе">
          <h2 class="side-h">На неделе ${weekSpan(dates[0], dates[5])}</h2>
          <div class="tiles">
            <div class="tile"><span class="k">${moveSign()}переносы</span><span class="v">${moves.length ? moves.length : 'Нет'}</span>
              ${moves.length ? moves.map(p => h`<span class="m">${fmt.dayShort(p.date)}: ${p.subject}, ${p.was.start} → ${p.start}, ${S.roomShift(p.was.room, p.room, true)}</span>`) : h`<span class="m">Все пары идут по расписанию.</span>`}</div>
            ${exam ? h`<a class="tile" href="#study"><span class="k"><span class="tag exam">${EXAM_WORD[exam.type] || 'Экзамен'}</span>ближайший</span>
              <span class="v">${fmt.date(exam.date)}</span><span class="m">${exam.subject} · ${shortDay(exam.date).slice(0, 2)}, ${startOf(exam.slot)} · ауд. ${exam.room}</span></a>` : ''}
          </div>
        </aside>
      </div>` };
  }

  /* ------------------------------------------------------------------ Учёба: допуск с планом, баллы, зачёты и экзамены, сроки */
  /* Первый экран — баллы до допуска, план и ближайшие зачёты. Таблица баллов и зачётка свёрнуты, у каждого свёрнутого
