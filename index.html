<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровой деканат — концепт</title>
<meta name="description" content="Цифровой деканат: конкурсный концепт личного кабинета студента. Одно главное сразу и деканат без похода. Не официальный сервис вуза.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FFB000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%231B1400'/%3E%3C/svg%3E">
<style>
:root{
  /* «Табло с указателями»: тёплая бумага и графит, один янтарь только для срочного и переносов.
     До 840 px одна колонка и нижняя панель, от 840 px меню сбоку и две колонки 70/30, контент до 1120 px. */
  --bg:#F4F1EA; --surface:#FCFAF5; --sunken:#E9E4D7; --tone:#E9E4D7; --solid:#4A463D; --on-solid:#F7F4EC;
  --ink:#1B1915; --ink-2:#5A554A; --line:#D3CCBB;
  --amber:#FFB000; --on-amber:#1B1400; --on-amber-2:#4A3600; --flap:#1B1915; --flap-ink:#F7F4EC;
  --ground:#CFC8B5; --ground-2:#B9B19C; --wall:#FCFAF5; --wall-2:#E2DCCD; --wall-3:#C4BDAA;
  --font-display:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Golos Text",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* надпись на главной, приветствие и название в шапке кабинета — и больше нигде */
  --font-title:"Lora","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1B18; --sunken:#0A0A09; --tone:#2B2A26; --solid:#524E44; --on-solid:#F7F4EC;
    --ink:#F1EEE6; --ink-2:#ABA598; --line:#35332D; --flap:#2D2B26; --flap-ink:#F7F4EC;
    --ground:#2E2C27; --ground-2:#23221E; --wall:#4A473F; --wall-2:#3A3832; --wall-3:#2A2824; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1B18; --sunken:#0A0A09; --tone:#2B2A26; --solid:#524E44; --on-solid:#F7F4EC;
  --ink:#F1EEE6; --ink-2:#ABA598; --line:#35332D; --flap:#2D2B26; --flap-ink:#F7F4EC;
  --ground:#2E2C27; --ground-2:#23221E; --wall:#4A473F; --wall-2:#3A3832; --wall-3:#2A2824; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body)}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.012em}
p{margin:0}
a{color:inherit;text-underline-offset:.2em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
s{text-decoration-thickness:.09em}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
svg.sign{width:36px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:50}
.skip:focus{top:8px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.fine{font-size:13px;color:var(--ink-2)}

/* кнопки и метки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font:600 15px/1 var(--font-body);text-decoration:none}
.btn[disabled]{opacity:.5;cursor:default}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--ink);background:none;font:500 15px/1 var(--font-body);text-decoration:none}
.link-btn{background:none;border:0;padding:0;min-height:44px;text-decoration:underline;text-underline-offset:.2em;font-size:14.5px;display:inline-flex;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:0 13px;min-height:44px;font:500 14px/1 var(--font-body);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font:600 13px/1.3 var(--font-body);white-space:nowrap}
.tag.urgent{background:var(--amber);color:var(--on-amber)}
.tag.important{border:1.5px solid currentColor;padding:2.5px 8.5px}
.tag.fyi{padding-left:0;padding-right:0;color:var(--ink-2)}
.tag.need{background:var(--solid);color:var(--on-solid)}
.tag.work{background:var(--tone)}
.tag.new{border:1.5px dashed var(--ink-2);padding:2.5px 8.5px}
.tag.done{padding-left:0;padding-right:0}
.tag.exam{background:var(--solid);color:var(--on-solid)}
.tag svg.i{width:18px;height:18px;margin:-1px 0}
.chip-move{display:inline-flex;gap:7px;align-items:center;background:var(--amber);color:var(--on-amber);border-radius:7px;padding:2px 9px;font:600 12.5px/1.4 var(--font-body)}
.concept{font:500 12px/1 var(--font-body);border:1px solid var(--ink-2);border-radius:99px;padding:3px 8px;color:var(--ink-2);white-space:nowrap}

/* перекидные плашки */
.flaps{--fs:44px;--cw:.78em;display:inline-flex;align-items:center;gap:.07em;font:600 var(--fs)/1 var(--font-display);font-variant-numeric:tabular-nums;vertical-align:middle;white-space:nowrap}
.flap{position:relative;display:inline-block;width:var(--cw);height:1.3em;border-radius:.11em;color:var(--flap-ink);perspective:3.2em}
.flap .half{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--flap)}
.flap .top{top:0;border-radius:.11em .11em 0 0;background:color-mix(in srgb,var(--flap) 90%,#fff)}
.flap .bot{bottom:0;border-radius:0 0 .11em .11em}
.flap .half i{position:absolute;left:0;right:0;height:200%;display:grid;place-items:center;font-style:normal;font-size:.92em}
.flap .top i{top:0}
.flap .bot i{bottom:0}
.flap::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .5px);height:1px;background:rgba(0,0,0,.72);z-index:3}
.flap .fold{visibility:hidden;z-index:2;backface-visibility:hidden}
.flap .top.fold{transform-origin:50% 100%}
.flap .bot.fold{transform-origin:50% 0}
.flap-sep{padding:0 .03em}
.on-amber .flap{--flap:#1B1915}

/* каркас */
.shell{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 8px 4px 16px}
.word{font:700 19px/1 var(--font-display);letter-spacing:-.02em;text-decoration:none}
.sp{flex:1}
.ico{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:0;background:none;position:relative;text-decoration:none}
.ico .unread{position:absolute;top:9px;right:9px;min-width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.ava{width:44px;height:44px;border-radius:50%;background:var(--tone);display:grid;place-items:center;font:600 14px/1 var(--font-display);margin:0;text-decoration:none}
.main{flex:1;padding:8px 16px 20px;width:100%;max-width:1120px;margin:0 auto;outline:0}
.h1{font:600 24px/1.2 var(--font-display);padding:6px 0 4px}
.sub{font-size:14px;color:var(--ink-2);margin-bottom:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0;z-index:5;order:9}
.nav a{flex:1;display:grid;justify-items:center;gap:3px;padding:8px 0 10px;font:500 12px/1.2 var(--font-body);color:var(--ink-2);text-decoration:none;min-height:58px}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600}
.nav a:focus-visible{outline-offset:-3px}
.nav .brand,.nav .wide{display:none}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--ink);margin-left:6px}
.foot{padding:10px 16px 14px;font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;max-width:1120px;margin:0 auto;width:100%}
.foot .seg button{min-height:44px;font-size:13px}
@media (min-width:840px){
  .shell{display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:auto 1fr auto}
  .shell>.phase{grid-column:2;grid-row:1}.shell>.main{grid-column:2;grid-row:2}.shell>.foot{grid-column:2;grid-row:3}
  .bar{display:none}
  .nav{grid-column:1;grid-row:1 / -1;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:20px 12px;gap:2px;position:sticky;top:0;height:100vh;height:100dvh;order:0}
  .nav a{flex:none;display:flex;align-items:center;gap:12px;font-size:15px;padding:0 12px;border-radius:10px;min-height:44px}
  .nav a[aria-current="page"]{background:var(--tone)}
  .nav .brand{display:flex;align-items:center;gap:8px;padding:4px 12px 18px}
  .nav .wide{display:flex}
  .nav .narrow{display:none}
  .nav .grow{flex:1}
  .main{padding:28px 32px 28px}
  .foot{padding:0 32px 20px}
  .h1{font-size:28px}
  .cols{grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:24px}
  .cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* главное сейчас */
.now{position:relative;border-radius:20px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line)}
.now.urgent{background:var(--amber);color:var(--on-amber);border-color:transparent}
.now.important{border:1.5px solid var(--ink)}
.now.urgent :focus-visible{outline-color:var(--on-amber)}
.now-head{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font:500 13.5px/1.3 var(--font-body)}
.now-head .kind{display:inline-flex;gap:8px;align-items:center}
.now.urgent .tag.urgent{background:var(--on-amber);color:var(--amber)}
.now h2{font:600 21px/1.2 var(--font-display)}
.shift{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.was{font:500 22px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.now.urgent .was,.now.urgent .room s{color:var(--on-amber-2)}
.room{font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.room b{font:600 17px/1 var(--font-display);font-variant-numeric:tabular-nums}
.now-line{font:500 17px/1.3 var(--font-display)}
.now-actions{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.now.urgent .btn{background:var(--on-amber);color:#FFF4D6}
.why{font-size:14px;line-height:1.45;border-top:1px solid currentColor;padding-top:10px}
.now.urgent .why{border-color:var(--on-amber-2)}
.now.enter{animation:plate-in .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes plate-in{0%{transform:perspective(900px) rotateY(-150deg) rotateX(16deg) scale(.86);opacity:0}45%{opacity:1}100%{transform:perspective(900px) rotateY(0) rotateX(0) scale(1)}}
@media (min-width:840px){.now{padding:24px;gap:14px}.now h2{font-size:24px}.now .flaps{--fs:56px}}

/* карточки, лента дня, списки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card>h3,.cap{font:600 13px/1.3 var(--font-body);color:var(--ink-2);margin-bottom:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 0 4px}
.day>h3{font:600 13px/1.3 var(--font-body);color:var(--ink-2);padding:0 16px 8px}
.slot{display:grid;grid-template-columns:58px minmax(0,1fr);gap:0 12px;padding:0 16px}
.slot time{font:600 16px/1.25 var(--font-display);font-variant-numeric:tabular-nums;padding-top:11px}
.slot time small{display:block;font:400 12px/1.3 var(--font-body);color:var(--ink-2)}
.slot time s{display:block;font-weight:500;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.slot .info{padding:11px 0 13px 18px;position:relative;min-width:0}
.slot .info::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line)}
.slot:first-of-type .info::after{top:22px}
.slot:last-of-type .info::after{bottom:auto;height:22px}
.slot:first-of-type:last-of-type .info::after{display:none}
.slot .info::before{content:"";position:absolute;left:-4px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);z-index:1}
.slot.moved .info::before{background:var(--amber)}
.slot.past{opacity:.55}
.slot .t{font-weight:600}
.slot .m{color:var(--ink-2);font-size:13.5px}
.slot .chip-move{margin-top:6px}
.empty{padding:14px 16px;color:var(--ink-2);font-size:14.5px}
.more{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.more summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;min-height:52px;padding:8px 12px 8px 16px;cursor:pointer;font-weight:600}
.more summary::-webkit-details-marker{display:none}
.more summary b{font-weight:600;white-space:nowrap}
.more summary span{font-weight:400;color:var(--ink-2);font-size:13.5px;min-width:0}
.more summary .sp{flex:1 0 0}
.more{scroll-margin-top:68px}
.more[open] summary svg{transform:rotate(180deg)}
.item{display:grid;gap:3px;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none}
.item .tag{justify-self:start}
.item .t{font-weight:600}
.item .m{color:var(--ink-2);font-size:13.5px}
.tiles{display:grid;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.tile{padding:16px;border-top:1px solid var(--line);display:grid;gap:4px;align-content:start;text-decoration:none}
.tile:first-child{border-top:0}
.tile .k{font:500 12.5px/1.3 var(--font-body);color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tile .k .tag{font-size:12px}
.tile .v{font:600 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile .v .flaps{--fs:26px}
.tile .m{font-size:13.5px;color:var(--ink-2)}
a.tile:hover .v,a.item:hover .t{text-decoration:underline;text-underline-offset:.2em}
.side-h{font:600 13px/1.3 var(--font-body);color:var(--ink-2);padding:4px 0 0}
.only-wide{display:none}
@media (min-width:840px){.only-wide{display:grid}.only-narrow{display:none!important}}

.rows{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;list-style:none;margin:0;padding:0}
.rows li+li{border-top:1px solid var(--line)}
.rowb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:14px 16px;min-height:64px;text-decoration:none}
.rowb:focus-visible{outline-offset:-3px}
.rowb .t{font-weight:600;text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px}
.rowb:hover .t{text-decoration-thickness:2.5px}
.rowb .m{color:var(--ink-2);font-size:13.5px;grid-column:1}
.rowb .st{grid-row:1 / span 2;grid-column:2;justify-self:end;text-align:right}
.rowb.unread .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:8px;vertical-align:middle}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));list-style:none;margin:6px 0 0;padding:0}
.steps li{position:relative;padding-top:22px;font-size:13.5px;padding-right:8px}
.steps li b{display:block;font:600 14.5px/1.3 var(--font-body)}
.steps li span{color:var(--ink-2)}
.steps li::before{content:"";position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--ink)}
.steps li::after{content:"";position:absolute;top:8px;left:18px;right:4px;height:2px;background:var(--ink)}
.steps li:last-child::after{display:none}
.steps li.todo::before{background:var(--surface)}
.steps li.todo b{color:var(--ink-2)}
.steps li.next::after{background:none;border-top:2px dashed var(--ink-2);height:0}
.steps li.cur::before{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.steps li.cur::after{left:24px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:2px;min-height:64px}
.quick button b{font:600 15px/1.25 var(--font-display)}
.quick button span{font-size:13px;color:var(--ink-2)}
.quick button:hover{border-color:var(--ink)}
.thread{display:grid;gap:10px}
.msg{border-radius:14px;padding:10px 14px;max-width:46ch;font-size:15px}
.msg small{display:block;font-size:12px;color:var(--ink-2);margin-bottom:2px}
.msg.staff{background:var(--tone);justify-self:start}
.msg.me{border:1px solid var(--ink);justify-self:end}
.form{display:grid;gap:10px}
.form label{font:500 13px/1.3 var(--font-body);color:var(--ink-2)}
.form input,.form select,.form textarea{min-height:46px;border:1.5px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--surface);width:100%}
.form textarea{min-height:88px;resize:vertical}
.err{color:var(--ink);background:var(--tone);border-radius:10px;padding:8px 12px;font-size:14px}
/* плашка: внизу, над нижней панелью (класс over-nav ставит кабинет), панель и шапку не закрывает */
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 10px 8px 16px;font-size:14.5px;z-index:40;width:max-content;max-width:min(92vw,520px);display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 10px;text-align:left;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.over-nav{bottom:calc(71px + env(safe-area-inset-bottom,0px))}
.toast-t{flex:1 1 auto;min-width:0;padding:4px 0}
.toast-btn{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid currentColor;background:none;color:inherit;font:600 14.5px/1 var(--font-body)}
.toast-x{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:inherit;margin-right:-4px}
.toast-btn[disabled],.toast-x[disabled]{opacity:.7;cursor:default}
@media (max-width:839px){html.toast-on .main{padding-bottom:150px}}
@media (min-width:840px){.toast,.toast.over-nav{left:auto;right:28px;bottom:24px;transform:none;max-width:440px}}

/* учёба */
.adm{display:grid;gap:14px}
.adm-big{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:600 22px/1.15 var(--font-display)}
.adm-big .flaps{--fs:52px}
.barx{padding:36px 0 30px;position:relative}
.bar-track{height:18px;border-radius:9px;background:var(--bg);border:1px solid var(--ink-2);position:relative}
.bar-fill{position:absolute;left:-1px;top:-1px;bottom:-1px;border-radius:9px;background:var(--ink)}
.bar-thr{position:absolute;top:-12px;bottom:-12px;border-left:2px dashed var(--ink);width:0}
.bar-thr span{position:absolute;bottom:100%;left:0;transform:translateX(-50%);white-space:nowrap;font:600 12.5px/1.5 var(--font-body)}
.bar-me{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;font:600 12.5px/1.3 var(--font-body)}
.bar-ends{display:flex;justify-content:space-between;font:400 12.5px/1.3 var(--font-body);color:var(--ink-2);position:absolute;left:0;right:0;bottom:0}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.plan li b{font-weight:600}
.plan .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:600 13px/1 var(--font-display)}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th,table.t td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle;font-weight:400}
table.t th{font:600 12.5px/1.3 var(--font-body);color:var(--ink-2)}
table.t tr:last-child td{border-bottom:0}
table.t td.n{font:600 15px/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-bar{position:relative;display:inline-block;width:86px;height:10px;border-radius:5px;border:1px solid var(--ink-2);background:var(--bg);vertical-align:middle;margin-left:8px}
.mini-bar i{position:absolute;left:-1px;top:-1px;bottom:-1px;border-radius:5px;background:var(--ink)}
.mini-bar em{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--ink)}
.tw{overflow-x:auto}

/* расписание */
.week-wrap{overflow-x:auto;border-radius:14px}
.week{display:grid;grid-template-columns:54px repeat(6,minmax(118px,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:12px;min-width:780px;overflow:hidden}
.week>div{border-left:1px solid var(--line);border-top:1px solid var(--line);min-height:76px;padding:5px}
.week>div:nth-child(7n+1){border-left:0}
.week>.wk-h{border-top:0;min-height:0;padding:9px 8px;font:500 12.5px/1.2 var(--font-body);color:var(--ink-2)}
.week>.wk-h.today{color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--ink)}
.week>.wk-t{font:600 12.5px/1.2 var(--font-display);font-variant-numeric:tabular-nums;padding:9px 6px;color:var(--ink-2)}
.ev{border-radius:9px;padding:6px 8px;height:100%;display:grid;align-content:start;gap:2px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.ev b{font:600 12.5px/1.2 var(--font-display)}
.ev span{font-size:12px}
.ev.lec{background:var(--tone)}
.ev.sem{border:1.5px solid var(--ink);padding:4.5px 6.5px}
.ev.exam{background:var(--solid);color:var(--on-solid)}
.ev.moved{background:var(--amber);color:var(--on-amber)}
.ev.ghost{border:1.5px dashed var(--ink-2);color:var(--ink-2);padding:4.5px 6.5px}
.ev .sign{width:30px;height:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;color:var(--ink-2);margin-top:12px}
.legend>span{display:inline-flex;gap:8px;align-items:center}
.key{display:inline-block;width:26px;height:16px;border-radius:5px}
.key.lec{background:var(--tone)}.key.sem{border:1.5px solid var(--ink)}.key.exam{background:var(--solid)}.key.moved{background:var(--amber)}.key.ghost{border:1.5px dashed var(--ink-2)}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.dcard h3{font:600 16px/1.2 var(--font-display);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dcard h3 small{font:400 13px/1.3 var(--font-body);color:var(--ink-2)}
.dcard ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14.5px}
.dcard li{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px}
.dcard li time{font:600 14.5px/1.4 var(--font-display);font-variant-numeric:tabular-nums}
.dcard li s{color:var(--ink-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-bottom:14px}

/* полёт по дню */
.fly{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;height:min(60vh,460px);min-height:340px;perspective:900px;perspective-origin:50% 42%}
.fly .world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.fly .floor{position:absolute;width:2400px;height:6400px;left:-1200px;top:-6400px;transform-origin:50% 100%;transform:translateY(190px) rotateX(90deg);background:repeating-linear-gradient(0deg,transparent 0 198px,var(--line) 198px 200px),repeating-linear-gradient(90deg,transparent 0 198px,var(--line) 198px 200px)}
.fly .st{position:absolute;width:300px;margin-left:-150px;margin-top:-120px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:8px;backface-visibility:hidden}
.fly .st.moved{background:var(--amber);color:var(--on-amber);border-color:transparent}
.fly .st h3{font:600 19px/1.2 var(--font-display)}
.fly .st p{font-size:14px}
.fly .st .flaps{--fs:52px}
.fly-cap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 14px;background:linear-gradient(transparent,color-mix(in srgb,var(--surface) 94%,transparent) 42%);display:grid;gap:2px;pointer-events:none}
.fly-cap b{font:600 18px/1.2 var(--font-display)}
.fly-cap span{font-size:14px;color:var(--ink-2)}
.scrub{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin-top:12px}
.scrub input{width:100%;accent-color:var(--ink);min-height:44px}

/* вход */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr)}
.login-photo{position:relative;min-height:280px;background:var(--sunken);overflow:hidden;display:grid;align-content:end;padding:20px}
.login-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.login-photo canvas{position:absolute;inset:0;width:100%;height:100%}
.login-photo.has-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.62))}
.login-cap{position:relative;z-index:2;font:600 26px/1.15 var(--font-display);max-width:16ch}
.login-photo.has-photo .login-cap{color:#F7F4EC}
.leaf{position:absolute;left:var(--x);top:-30px;width:22px;height:22px;fill:var(--ink);opacity:.28;animation:fall linear infinite;z-index:1}
.login-photo.has-photo .leaf{fill:#FFB000;opacity:.85}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0)}50%{transform:translate(26px,42vh) rotate(160deg)}100%{transform:translate(-8px,92vh) rotate(330deg)}}
.login-form{padding:24px 20px 28px;display:grid;gap:10px;align-content:center;width:100%;max-width:440px;margin:0 auto}
.login-form h1{font:700 30px/1.1 var(--font-display);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-row{display:grid;gap:8px}
.demo-row button{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;text-align:left;display:grid;gap:1px}
.demo-row button b{font:600 15px/1.2 var(--font-display)}
.demo-row button span{font-size:12.5px;color:var(--ink-2)}
.demo-row button:hover{border-color:var(--ink)}
@media (min-width:840px){.login{grid-template-columns:minmax(0,11fr) minmax(0,9fr)}.login-photo{min-height:100vh;padding:40px}.login-cap{font-size:40px}}

/* печатный образец */
.paper{background:#fff;color:#1B1915;border:1px solid var(--line);border-radius:6px;padding:36px 32px;position:relative;overflow:hidden;font:15px/1.6 Georgia,"Times New Roman",serif;max-width:640px}
.paper h3{font:700 18px/1.3 Georgia,serif;text-align:center;margin:18px 0}
.paper .wm{position:absolute;inset:0;display:grid;place-items:center;font:700 64px/1 var(--font-display);color:rgba(27,25,21,.09);transform:rotate(-24deg);pointer-events:none;letter-spacing:.1em}
@media print{body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;border:0}}

/* ===== дополнения к каркасу: то, чего не хватило экранам (сборка 24.11) ===== */
.main{overflow-wrap:break-word}
.msg,.item .m,.tile .m,.rowb .t,.rowb .m{overflow-wrap:anywhere}
.h1:focus,.login-form h1:focus{outline:0}
.btn svg.i,.ghost svg.i,.link-btn svg.i{width:18px;height:18px}
.ghost[disabled]{opacity:.5;cursor:default}
.ico[disabled]{opacity:.35;cursor:default}
.ico[aria-current="page"]{background:var(--tone)}
.bar .word{display:inline-flex;align-items:center;min-height:44px}
.ico .unread.n{top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;color:var(--bg);font:600 12px/18px var(--font-display);text-align:center;font-variant-numeric:tabular-nums}
.nav .cnt,.nav button,.nav .who{display:none}
@media (min-width:840px){
  .nav .cnt{display:block;margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ink);color:var(--bg);font:600 12px/22px var(--font-display);text-align:center;font-variant-numeric:tabular-nums}
  .nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink-2);font:500 15px/1.2 var(--font-body);text-align:left}
  .nav a:hover,.nav button:hover{color:var(--ink)}
  .nav .who{display:flex;align-items:center;gap:10px;padding:12px 8px 6px;margin-top:8px;border-top:1px solid var(--line);font-size:13px;line-height:1.35;color:var(--ink-2)}
  .nav .who b{color:var(--ink);font-weight:600}
  .nav .who .ava{margin:0;flex:none}
}
.shell.plain{display:flex;flex-direction:column}
@media (min-width:840px){.shell.plain .bar{display:flex;width:100%;max-width:1120px;margin:0 auto;padding:16px 32px 0}}
.foot-set,.set-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.foot>a{display:inline-flex;align-items:center;min-height:44px}
.set-row{gap:8px 12px}
.flow>*+*{margin-top:10px}
.flow>.cap+*{margin-top:0}
.after{margin-top:12px}
.crumb{margin-top:-6px}
.prose{max-width:720px}
.hrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-bottom:6px}
.hrow .cap{margin:0}
/* прошедшая пара: тише, но текст остаётся читаемым (было opacity .55, контраст падал ниже 4,5:1) */
.slot.past{opacity:1}
.slot.past time,.slot.past .t{color:var(--ink-2);font-weight:500}
.slot.past .info::before{border-color:var(--ink-2)}
.day>h2{font:600 13px/1.3 var(--font-body);color:var(--ink-2);padding:0 16px 8px;letter-spacing:0}
.dcard h2{font:600 16px/1.2 var(--font-display);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dcard h2 small{font:400 13px/1.3 var(--font-body);color:var(--ink-2)}
.dcard{align-content:start}
/* плашка «Главное сейчас» */
.now:focus{outline:0}
.now h3{font:600 21px/1.2 var(--font-display)}
@media (min-width:840px){.now h3{font-size:24px}}
.now-next{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.now .now-next .flaps{--fs:30px}
.now .msg{max-width:none}
.item .t svg.sign,.rowb .t svg.sign,.list .t svg.sign{margin-right:6px;vertical-align:-1px}
@media (max-width:359px){.now .flaps{--fs:36px}.adm-big .flaps{--fs:44px}}
/* списки, отметки, шаги */
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}
.list li:last-child{padding-bottom:0}
.list .t{font-weight:600}
.list .m{color:var(--ink-2);font-size:13.5px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14.5px;cursor:pointer}
.check.wide{display:flex;align-items:flex-start;gap:10px;min-height:0}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ink)}
.check.wide input{margin-top:2px}
.check.done b{font-weight:500;text-decoration:line-through;color:var(--ink-2)}
.how{margin:0;padding-left:20px;display:grid;gap:6px}
.thread+.form{margin-top:14px}
@media (min-width:600px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:479px){.mini-bar{display:none}}
/* расписание */
.wk-nav{display:inline-flex;align-items:center;gap:2px}
.wk-nav b{font:600 14.5px/1.2 var(--font-display);min-width:9.6em;text-align:center}
.seg.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;max-width:520px;margin-bottom:14px}
.seg.days button{display:grid;justify-items:center;align-content:center;gap:3px;padding:6px 2px;min-height:52px;font-size:12.5px}
.seg.days button b{font:600 16px/1 var(--font-display)}
.seg.days .today b{text-decoration:underline;text-underline-offset:.22em;text-decoration-thickness:2px}
.fly{margin-bottom:14px}
.wk-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.wk-grid{display:none}
@media (min-width:600px){.wk-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.wk-grid{display:block}.wk-cards{display:none}}
.ev+.ev{margin-top:4px}
/* класс .ghost занят кнопкой с контуром; ячейке и ключу «прежнее время» её размеры и выравнивание не нужны */
.ev.ghost{min-height:0;justify-content:normal;align-items:normal;font:inherit;line-height:1.25;gap:2px;border-radius:9px}
.key.ghost{min-height:0;padding:0;border-radius:5px}
/* очередь сотрудника */
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.qrow>.ghost,.qrow>.btn{margin-right:16px;min-height:44px;white-space:nowrap}
@media (max-width:559px){.qrow{grid-template-columns:minmax(0,1fr)}.qrow>.ghost,.qrow>.btn{margin:0 16px 14px;justify-self:start}}
/* подпись строки очереди занимает две строки всегда — «подана … · ответить до …» сменяется на «готова сегодня»,
   а высота строки та же, и строки ниже не поднимаются под палец (решение 2) */
.qrow .rowb .m{min-height:3.1em}
/* метка статуса — флекс-блок: у «Готова» со значком та же высота строки, что у «В работе» (без сдвига на полпикселя) */
.rowb .st{display:flex}
/* ноутбук: у метки статуса и у кнопки строки постоянная ширина — «Взять в работу» сменяется на «Отметить готовой»,
   «В работе» на «Готова», а колонка с текстом той же ширины: подпись не переносится, строки ниже не сдвигаются */
@media (min-width:560px){
  .qrow{grid-template-columns:minmax(0,1fr) 196px}
  .qrow>.ghost,.qrow>.btn{width:180px;justify-self:end}
  .qrow .rowb{grid-template-columns:minmax(0,1fr) 140px}
}
/* вход */
.login-form .cap{margin:8px 0 0}
.login-form .form .cap{margin:0}
/* свой диалог вместо confirm */
dialog.dlg{border:1.5px solid var(--ink);border-radius:20px;background:var(--surface);color:var(--ink);padding:22px;width:min(92vw,420px);max-width:none}
dialog.dlg::backdrop{background:rgba(10,10,9,.55)}
dialog.dlg.dlg-plain{position:fixed;inset:0;margin:auto;height:max-content;z-index:60;box-shadow:0 0 0 100vmax rgba(10,10,9,.55)}
.dlg h2{font:600 20px/1.25 var(--font-display);margin-bottom:8px}
.dlg p{font-size:15px;color:var(--ink-2)}
.dlg-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
/* образец справки: на печать уходит только его копия из #print-root */
.paper p{position:relative;margin:0 0 10px}
.paper .paper-note{font:13px/1.45 var(--font-body);color:#5A554A}
.paper .wm{font-size:clamp(40px,13vw,64px)}
@media (max-width:479px){.paper{padding:24px 18px}}
#print-root{display:none}
@media print{
  html.has-paper body>*:not(#print-root){display:none!important}
  html.has-paper #print-root{display:block}
  html.has-paper,html.has-paper body{background:#fff}
  html.has-paper #print-root .paper{position:relative;left:auto;top:auto;border:0;border-radius:0;max-width:none;margin:0;min-height:60vh}
  html.has-paper #print-root .wm{color:rgba(27,25,21,.14);font-size:96px}
}

/* ===== название продукта в кабинете: «Цифровой деканат» длиннее прежнего слова ===== */
/* то же начертание, что у надписи на главной: кабинет и главная читаются как одно целое */
.word{font:500 20px/1.1 var(--font-title);letter-spacing:0}
.nav .brand{flex-wrap:wrap;gap:6px 8px}
.nav .brand .word{font-size:20px}
@media (max-width:419px){.bar .word{font-size:17px;line-height:1.05;max-width:min-content}}

/* ===== главная: надпись, приближение при прокрутке, страница деканата со входом (слово заказчика 24.11) =====
   Первый экран закреплён (sticky) внутри высокой дорожки .hero; долю прокрутки читает и сглаживает код в c_views.html.
   Высоты в svh/lvh: на телефоне адресная строка прячется, а кадр не прыгает и не оголяет низ.
   Слои закреплённого кадра снизу вверх: сцена (.hero-cam) → затемнение (.hero-shade) → свет из проёма (.hero-bloom)
   → надпись (.hero-stage) → завеса цвета темы (.hero-veil). Приветствие — заголовок блока входа (#enter-h). */
.home{position:relative}
.home main{display:block;outline:0}
.home-top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:flex-start;gap:12px;padding:10px 12px 10px 16px;color:var(--ink);border-bottom:1px solid transparent;pointer-events:none}
.home-top>*{pointer-events:auto}
.home-enter{flex:none;margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:99px;background:var(--ink);color:var(--bg);font:600 15px/1 var(--font-body);text-decoration:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--bg) 45%,transparent)}
.home.photo:not(.lit) .home-top{color:#F7F4EC}
.home.photo:not(.lit) .home-top :focus-visible{outline-color:#F7F4EC}
.home.photo:not(.lit) .home-enter{background:#F7F4EC;color:#1B1915;box-shadow:0 0 0 1px rgba(5,8,13,.28)}
@media (prefers-reduced-motion:no-preference){.home-top,.home-enter{transition:color .22s ease,background-color .22s ease,border-color .22s ease,opacity .22s ease,visibility .22s}}
/* демо-кнопка блока входа в окне: «Войти» в шапке вести некуда — шапка уходит, на экране одна главная кнопка «Студент А».
   Демо-кнопка ушла за край (вверх или вниз) — шапка с «Войти» возвращается (класс ставит homeScroll) */
.home.at-enter .home-top{opacity:0;visibility:hidden}
/* Страницу начали листать — у шапки сплошной фон: надпись и заголовки проходят под ней и не просвечивают. */
.home.moved .home-top{background:var(--bg);border-bottom-color:var(--line)}
.home.photo.moved:not(.lit) .home-top{background:#0b1018;border-bottom-color:rgba(247,244,236,.16)}
@media (min-width:720px){.home-top{padding:14px 24px 14px 28px;align-items:center}}

/* закреплённый путь — один экран; блок входа поднимается над обложкой листом с первого шага прокрутки (круг 4, Н4):
   пустой полосы между обложкой и входом нет (экрана «Добро пожаловать» тоже нет) */
.hero{position:relative;height:200vh;height:200svh;background:var(--bg)}
.hero-pin{position:sticky;top:0;height:100vh;height:100lvh;overflow:hidden;background:var(--bg);color:var(--ink)}
.home.photo .hero-pin{background:#0b1018;color:#F7F4EC}
.hero-cam{position:absolute;inset:0;will-change:transform}
.hero-cam .login-photo{position:absolute;inset:0;min-height:0;padding:0;display:block;background:none}
.hero-shade,.hero-bloom,.hero-veil,.hero-stage{pointer-events:none}
.hero-shade{position:absolute;inset:0;will-change:opacity;background:color-mix(in srgb,var(--bg) 84%,transparent)}
.home.photo .hero-shade{background:linear-gradient(rgba(5,8,13,.68) 0,rgba(5,8,13,.6) 16%,rgba(5,8,13,.6) 76%,rgba(5,8,13,.72) 100%)}
.hero-bloom{position:absolute;left:50%;top:44%;width:40vmax;height:40vmax;margin:-20vmax 0 0 -20vmax;border-radius:50%;opacity:0;visibility:hidden;will-change:transform,opacity;
  background:radial-gradient(closest-side,var(--bg) 0,color-mix(in srgb,var(--bg) 86%,transparent) 20%,color-mix(in srgb,var(--bg) 52%,transparent) 44%,color-mix(in srgb,var(--bg) 18%,transparent) 70%,transparent 100%)}
.hero-stage{position:absolute;left:0;right:0;top:0;height:100vh;height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:84px 16px 92px}
.hero-title{position:relative;text-align:center;will-change:opacity}
.hero-h{margin:0;font:400 54px/.94 var(--font-title);font-size:clamp(54px,min(20vw,30vh),208px);font-size:clamp(54px,min(20vw,30svh),208px);letter-spacing:.02em;text-wrap:nowrap}
.hero-h:focus{outline:0}
.hero-word{display:block;margin-right:-.02em;white-space:nowrap}
.hero-uni{display:block;font:italic 400 .31em/1.2 var(--font-title);letter-spacing:.005em;margin-top:.06em}
.hero-sub{margin-top:clamp(16px,3vh,30px);font:500 13px/1.4 var(--font-body);font-size:clamp(12.5px,.5vw + 10.5px,16px);letter-spacing:.3em;margin-right:-.3em;white-space:nowrap}
.hero-sub::before{content:"";display:block;width:40px;height:1px;background:currentColor;opacity:.55;margin:0 auto clamp(14px,2.6vh,24px);transform:translateX(-.15em)}
.hero-hint{position:absolute;left:0;right:0;bottom:16px;margin:0;display:grid;justify-items:center;gap:9px;font:500 12px/1 var(--font-body);letter-spacing:.32em;text-indent:.32em}
.hero-hint i{display:block;width:1px;height:30px;background:currentColor;transform-origin:50% 0;animation:hero-hint 2.6s cubic-bezier(.65,0,.25,1) infinite}
@keyframes hero-hint{0%{transform:scaleY(0);opacity:.9}55%{transform:scaleY(1);opacity:.9}100%{transform:scaleY(1);opacity:0}}
.hero-veil{position:absolute;inset:0;background:var(--bg);opacity:0;visibility:hidden;will-change:opacity}
@media (max-height:460px){.hero-stage{padding:64px 16px 56px}.hero-hint i{height:16px}.hero-sub::before{display:none}}

.home-body{position:relative;width:100%;max-width:1120px;margin:0 auto;padding:8px 20px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
/* страница деканата со входом не короче окна: переход ко входу ставит блок к верху окна, и первый экран целиком уходит выше */
.home-body{min-height:calc(100vh + 8px);min-height:calc(100svh + 8px);align-content:start}
/* лист входа: свой фон во всю ширину окна и над кадром обложки (и над её кнопками) */
.home-body{z-index:2;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
@media (prefers-reduced-motion:no-preference){.home-body{margin-top:-100vh;margin-top:-100svh}}
/* подвал главной — тоже над кадром обложки (кадр закреплён и геометрически доходит до конца дорожки) */
.home-foot{position:relative;z-index:2;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
/* строка прототипа на обложке — мелко под «Цифровой деканат», на своей подложке (решение Вадима 25.11) */
.hero-proto{margin-top:clamp(10px,1.8vh,18px);font:500 12.5px/1.35 var(--font-body);letter-spacing:.01em;white-space:normal}
.hero-proto span{display:inline-block;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--ink)}
.home.photo .hero-proto span{background:rgba(5,8,13,.78);color:#F7F4EC}
/* «Пауза» обложки (d_fx ставит кнопке #fx-pause класс fx-on) останавливает и линию подсказки «листайте» */
.home:has(#fx-pause.fx-on) .hero-hint i{animation-play-state:paused}
.home-lead{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
.home-kick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font:600 14px/1.2 var(--font-display)}
.home-lead h2{font:600 28px/1.12 var(--font-display);font-size:clamp(27px,3.3vw,42px);letter-spacing:-.022em}
.home-lead>p{font-size:16.5px;max-width:48ch}
.home-points{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.home-points li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.home-points li>span{display:grid;gap:2px}
.home-points b{font:600 15.5px/1.3 var(--font-display)}
.home-points small{font-size:14px;color:var(--ink-2)}
.home-login.login-form{max-width:none;margin:0;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 18px 20px;scroll-margin-top:8px}
.home-login h2:not(.cap){font:600 24px/1.15 var(--font-display)}
.home-login h2:focus{outline:0}
.home-foot{width:100%;max-width:1120px;margin:0 auto;padding:4px 20px 28px;font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.home-foot .seg button{min-height:44px;font-size:13px}
/* тема в подвале главной — переключатель, а не главная кнопка: выбранное отмечено спокойно, тёмная на экране входа одна — «Студент А» */
.home-foot .seg button[aria-pressed="true"]{background:var(--tone);color:var(--ink);font-weight:600}
.home-foot>a{display:inline-flex;align-items:center;min-height:44px}
@media (min-width:840px){
  .home-body{grid-template-columns:minmax(0,11fr) minmax(0,9fr);gap:72px;padding:16px 32px 56px;align-items:start}
  .home-lead{padding-top:12px;gap:18px;order:-1}
  .home-login.login-form{padding:30px 30px 26px}
  .home-foot{padding:0 32px 36px}
}
/* планшет 720–839 px: вход и описание рядом (как на ноутбуке), чтобы в конце прокрутки блок входа стоял целиком (круг 5, Н6) */
@media (min-width:720px) and (max-width:839px){
  .home-body{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;padding:16px 20px 40px;align-items:start}
  .home-lead{order:-1}
}
/* «Меньше движения»: приближения нет. Первый экран и страница деканата со входом идут один под другим. */
@media (prefers-reduced-motion:reduce){
  .hero{height:auto!important}
  .hero-pin{position:relative;height:auto;overflow:visible;background:none}
  .hero-cam,.hero-shade{bottom:auto;height:100vh;height:100svh}
  .hero-stage{position:relative}
  .hero-bloom,.hero-veil{display:none}
  .hero-hint i{animation:none}
}

/* ===== правки по замечаниям рецензентов (24.11, вторая волна) ===== */
/* запас под нижнее меню на телефоне; раскрытый список подводится к верху окна */
@media (max-width:839px){.main{padding-bottom:36px}}
.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--ink)}100%{box-shadow:0 0 0 3px transparent}}
/* срок, который истекает сегодня: спокойная строка сразу под главным */
.due{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;background:var(--surface);border:1.5px solid var(--ink);border-radius:16px;padding:12px 14px;min-height:56px;text-decoration:none}
.due-t{display:grid;gap:2px;min-width:0}
.due-t b{font:600 15.5px/1.3 var(--font-display)}
.due-t small{font-size:13.5px;color:var(--ink-2)}
@media (max-width:419px){.due{grid-template-columns:minmax(0,1fr) auto}.due>.tag{grid-column:1 / -1;justify-self:start}}
.card.hot{border:1.5px solid var(--ink)}
/* допуск: сданное, но не проверенное — штриховкой */
.bar-hope{position:absolute;top:-1px;bottom:-1px;border-radius:0 9px 9px 0;background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 6px);border:1px solid var(--ink)}
.bar-me.wide{transform:translateX(-35%)}
@media (max-width:479px){.bar-me.wide{left:0!important;transform:none}}
table.t td.n small{font:500 12.5px/1 var(--font-body);color:var(--ink-2)}
.book-h{font:600 15px/1.3 var(--font-display);margin-top:14px}
table.t.book td:last-child{white-space:nowrap}
/* заявки */
.sample-note{background:var(--tone);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:500;margin-bottom:10px;max-width:640px}
.answers{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answers .cap{flex:1 0 100%;margin:0}
.msg .opts{margin:6px 0 0}
@media (max-width:559px){
  .rowb{grid-template-columns:minmax(0,1fr)}
  .rowb .st{grid-row:auto;grid-column:1;justify-self:start;text-align:left}
}
.card-link{background:var(--surface);border:1px solid var(--line);border-radius:16px}
/* расписание: обозначения нужны только сетке недели; у карточек этих цветов нет */
.legend{display:none}
@media (min-width:1080px){.legend{display:flex}}
/* сотрудник: выбор пары — списком, названия переносятся, а не обрезаются */
.picks{border:0;margin:0;padding:0;display:grid;gap:6px;min-width:0}
.picks legend{font:500 13px/1.3 var(--font-body);color:var(--ink-2);padding:0;margin-bottom:6px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;cursor:pointer}
.pick:has(input:checked){border-color:var(--ink)}
.pick input{width:24px;height:24px;min-height:0;padding:0;margin:0;border:0;background:none;accent-color:var(--ink)}
.pick span{display:grid;gap:1px;min-width:0;overflow-wrap:anywhere}
.pick b{font:600 15px/1.3 var(--font-display)}
.pick small{font-size:13px;color:var(--ink-2)}
/* профиль: на телефоне «Вид и выход» наверху, потом сведения; «О концепте» — отдельный экран по ссылке из подвала */
.cols.prof{grid-template-areas:"view" "main"}
.prof-view{grid-area:view}.prof-main{grid-area:main}
.prof-view .set-row{gap:10px 12px}
.tile .v.name{font-size:21px;line-height:1.2}
.contacts .t{font-weight:600;overflow-wrap:anywhere}
/* почта и телефон деканата — ссылками mailto: и tel: (вымышленные), зона касания 44 px */
.contacts a.t{display:inline-flex;align-items:center;min-height:44px;margin:-8px 0 -4px}
.contacts .m{font-size:13.5px;color:var(--ink-2)}
@media (min-width:840px){.cols.prof{grid-template-areas:"main view"}}
.facts{margin:0;display:grid;gap:12px}
.facts>div{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.facts dt{font:600 14.5px/1.3 var(--font-display);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.facts dd{margin:0;font-size:14px;color:var(--ink-2)}
.facts dd .seg{margin:4px 0 6px}
.facts dd .ghost{margin-top:8px}
.about .more{margin-top:2px}

/* ===== защита от ошибок (задание А1, 24.11) ===== */
/* полоса над списком: высота постоянная, «Порядок изменился · Обновить» встаёт поверх правого края, строки не сдвигаются */
.qbar{position:relative;display:flex;align-items:center;gap:6px 10px;min-height:44px;margin-bottom:6px}
.qbar .cap{margin:0}
.qbar-n{font-size:14px;color:var(--ink-2)}
.qbar-alert{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:2px;padding-left:12px;background:var(--bg)}
.qbar-t{font:600 14px/1.3 var(--font-body);white-space:nowrap}
.qbar-alert .link-btn{padding:0 4px;min-width:44px;justify-content:center;font-weight:600}
@media (max-width:399px){.qbar.stale:not(.rq)>:first-child{visibility:hidden}}
/* «Заявки» студента: подпись «Мои заявки» не пропадает — «Порядок изменился · Обновить» стоит рядом с ней справа;
   на самых узких окнах — второй строкой, место под неё зарезервировано (строки списка не сдвигаются) */
.qbar.rq .qbar-alert{position:static;margin-left:auto;padding-left:8px;background:none}
@media (max-width:359px){.qbar.rq{flex-wrap:wrap;align-content:flex-start;min-height:80px}.qbar.rq .qbar-alert{margin-left:0;padding-left:0}}
/* своя новая заявка: короткая подсветка внутри строки (список обрезан по скруглению, внешняя тень не видна) */
.rowb.flash-in{animation:flash-in 1.8s ease-out 1}
/* вопрос, заменённый новым (круг 5, Н7): виден в переписке, но бледнее и без кнопок ответа */
.msg.replaced{background:none;border:1px dashed var(--ink-2)}
.msg.replaced small{font-weight:600}
.ask-wait p+p{margin-top:4px}
@keyframes flash-in{0%,45%{box-shadow:inset 0 0 0 3px var(--ink);background:var(--tone)}100%{box-shadow:inset 0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.rowb.flash-in{animation:none;box-shadow:inset 0 0 0 3px var(--ink)}}
/* строка, у которой сменился статус, стоит на месте и бледнеет до «Обновить» */
.rows li.pale{background:color-mix(in srgb,var(--bg) 75%,var(--surface))}
.rows li.pale .rowb .t{color:var(--ink-2);text-decoration-style:dotted}
.btn[disabled],.ghost[disabled]{cursor:default}
/* место, которое только что сменило статус: секунду его кнопки и ссылки не ловят касание */
[data-locked] a,[data-locked] button,[data-locked] input,[data-locked] select,[data-locked] label{pointer-events:none}
/* экран сотрудника: на телефоне — вкладки; на ноутбуке слева очередь и объявление, справа перенос пары */
.seg.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;max-width:520px;margin-bottom:14px}
.seg.tabs button{padding:0 6px;font-size:13.5px}
/* .staff:not(.msg): у пузыря сообщения деканата тоже класс staff («msg staff») — сетка экрана сотрудника его не задевает */
.staff:not(.msg){display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:839px){.staff>.tab-off{display:none!important}}
@media (min-width:840px){
  .staff:not(.msg){grid-template-columns:minmax(0,7fr) minmax(0,3fr);grid-template-rows:auto 1fr;gap:24px;grid-template-areas:"queue move" "ann move"}
  .sq{grid-area:queue}.smv{grid-area:move}.sann{grid-area:ann}
  /* без блока «О концепте» левая колонка короче правой: карточка объявления тянется до низа переноса пары,
     поле текста растёт вместе с ней — пустого левого столбца нет */
  .sann{align-self:stretch;display:flex;flex-direction:column}
  .sann .form{flex:1;display:flex;flex-direction:column}
  .sann textarea{flex:1 1 auto}
}
.form select[disabled],.form input[disabled]{border-color:var(--line);color:var(--ink-2);background:var(--bg)}
.mv-check{display:grid;gap:10px}
.mv-check:focus,.mv-check h3:focus{outline:0}
.mv-sum{font-size:15.5px;line-height:1.45}
.mv-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.list li.mvd .ghost{margin-top:8px}
/* пара не сегодня: день крупно, отдельной строкой над временем */
.now-day{font:600 21px/1.2 var(--font-display)}
@media (min-width:840px){.now-day{font-size:24px}}
/* «К сегодня»: на узком экране — в первом ряду рядом с «День / Неделя», стрелки и ряд дней не сдвигаются */
@media (max-width:839px){.toolbar>.seg{order:0}.toolbar>.to-today{order:1}.toolbar>.wk-nav{order:2}.toolbar>.sp,.toolbar>[data-action="fly"]{order:3}}
/* подпись недели постоянной ширины: «30 ноября – 5 декабря» не толкает стрелку «вперёд» из-под пальца */
.wk-nav b{min-width:12.8em}

/* ===== меньше текста, понятные слова (задание А2, 24.11) ===== */
/* метка прототипа: одна строка под шапкой каждого экрана кабинета, не закреплена (уходит при прокрутке) */
.phase{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.proto{font:500 12.5px/1.4 var(--font-body);color:var(--ink-2);padding:2px 0}
.proto b{font-weight:600;color:var(--ink)}
@media (min-width:840px){.phase{padding:16px 32px 0}.shell:not(.plain) .main{padding-top:12px}}
.home-login .proto{margin:-4px 0 2px}
/* приветствие — заголовок блока входа, тем же шрифтом, что надпись на главной (замысел Вадима: «…и там добро пожаловать в цифровой деканат») */
.home-login h2.hello{font:400 30px/1.08 var(--font-title);letter-spacing:-.005em;text-wrap:balance}
.home-login h2.hello em{display:block;font-style:italic}
@media (min-width:840px){.home-login h2.hello{font-size:36px}}
/* «Сегодня»: следующая пара крупно */
.next{display:grid;gap:3px}
.next-t{font:600 19px/1.25 var(--font-display);letter-spacing:-.012em}
@media (min-width:400px){.next-t{font-size:21px}}
.next-t b{font-weight:700;font-variant-numeric:tabular-nums}
.next-t .nw{white-space:nowrap}
.next-m{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.next-m svg.sign{width:30px;height:12px}
@media (min-width:840px){.next-t{font-size:26px}}
/* вопрос деканата с кнопками ответа прямо на «Сегодня» */
.card.ask{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border:1.5px solid var(--ink)}
.ask h3{font:600 19px/1.25 var(--font-display);color:var(--ink);margin:0}
.ask h3 a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;display:inline-flex;align-items:center;min-height:44px;margin:-10px 0}
.ask .msg{max-width:none;justify-self:stretch}
.ask .answers .ghost{flex:1 1 220px;min-height:48px;padding:8px 14px;line-height:1.25;text-align:center}
@media (min-width:840px){.ask h3{font-size:21px}}
/* готовая справка — одной строкой */
.due.ready{grid-template-columns:auto minmax(0,1fr) auto;border-width:1px;border-color:var(--line)}
.due.ready .due-t b{font-weight:600}
/* плитки «Остальное»: одна метка, событие словами в крупной строке */
.tile .k:empty{display:none}
.tile .v small{font:500 15px/1.2 var(--font-body);color:var(--ink-2)}
.tile .v.sm{font-size:18px;line-height:1.25}
/* «Готова» — самая заметная метка статуса: справку можно забирать */
.tag.done{background:var(--ink);color:var(--bg);padding:4px 10px 4px 8px}
/* свёрнутые блоки «Учёбы»: заголовок называет содержимое */
.fold-in{padding:0 16px 14px}
.fold-in>.tw:first-child{margin-top:-4px}
details.sub{border-top:1px solid var(--line);margin-top:10px}
details.sub summary{list-style:none;display:flex;align-items:center;gap:2px 10px;min-height:48px;cursor:pointer}
details.sub summary span:not(.sp){min-width:0}
details.sub summary::-webkit-details-marker{display:none}
details.sub summary b{font-weight:600}
details.sub summary span{color:var(--ink-2);font-size:13.5px}
details.sub[open] summary svg{transform:rotate(180deg)}
details.sub>.list{padding-bottom:2px}
/* телефон: допуск и план, затем ближайшие зачёты, сроки и уже потом свёрнутые таблицы */
@media (max-width:839px){
  .cols.study>.stack{display:contents}
  .st-hot{order:0}.st-adm{order:1}.st-exams{order:2}.st-dl{order:3}.st-points{order:4}.st-book{order:5}
  .st-points:empty,.st-book:empty{display:none}
}
/* «Главное сейчас»: на телефоне подписи нет — вопрос и плашка стоят сразу под следующей парой; у самой плашки
   есть aria-label «Главное сейчас: …», так что экранный диктор её назовёт */

<noscript><p style="padding:24px">«Цифровой деканат» — конкурсный концепт. Он работает в браузере и требует включённого JavaScript.</p></noscript>
<script>
/* «Цифровой деканат» · ядро: хранилище, вход, демо-часы, расписание, лента, автопроверки, маршруты.
   Экраны (c_views.html) получают модуль один раз при запуске и держат его в замыкании: в window после этого ничего нет.
   Хранилище браузера экраны напрямую не трогают.
   Сервера нет; здесь показана логика доступа. Чтобы подключить сервер, достаточно заменить модуль DB. */
(() => {
  'use strict';

  /* ------------------------------------------------------------------ мелочи */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const stamp = d => ymd(d) + 'T' + hm(d);
  const parseYmd = s => { const a = String(s).slice(0, 10).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
  const at = (date, time) => { const d = parseYmd(date); const t = String(time || '00:00').split(':').map(Number); d.setHours(t[0] || 0, t[1] || 0, 0, 0); return d; };
  const parseStamp = s => at(String(s).slice(0, 10), String(s).slice(11) || '00:00');
  const addDays = (date, n) => { const d = parseYmd(date); d.setDate(d.getDate() + n); return ymd(d); };
  const dow = date => parseYmd(date).getDay();                      /* 0 — воскресенье */
  const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
  const copy = x => JSON.parse(JSON.stringify(x));
  /* Поиск в справочнике только по его собственным ключам: имя вроде «constructor» из адреса или из разметки
     не должно достать встроенное свойство объекта. */
  const pick = (map, key) => (typeof key === 'string' && Object.prototype.hasOwnProperty.call(map, key) ? map[key] : undefined);

  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  /* Единственный способ вывести на страницу текст, который пришёл из данных или от человека. */
  const esc = v => (v === null || v === undefined ? '' : String(v).replace(/[&<>"']/g, c => ESC[c]));
  /* Текст от человека: одна строка, без лишних пробелов, не длиннее max. */
  const clean = (v, max) => String(v === null || v === undefined ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max);

  /* ------------------------------------------------------------------ слова и даты */
  const WD = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  const WD_GEN = ['воскресенья', 'понедельника', 'вторника', 'среды', 'четверга', 'пятницы', 'субботы'];
  const WD_ACC = ['в воскресенье', 'в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу'];
  const WD_SHORT = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
  /* «аудитория 1011 → 5005» — было и стало; если аудитория не менялась — одна. Для всех строк о переносе. */
  const roomShift = (was, now, short) => (short ? 'ауд. ' : 'аудитория ') + (was && was !== now ? was + ' → ' + now : now);
  const fmt = {
    date: s => parseYmd(s).getDate() + ' ' + MON[parseYmd(s).getMonth()],                 /* 23 ноября */
    dayLong: s => cap(WD[dow(s)]) + ', ' + fmt.date(s),                                   /* Понедельник, 23 ноября */
    dayShort: s => WD_SHORT[dow(s)] + ' ' + parseYmd(s).getDate(),                        /* Пн 23 */
    weekday: s => WD[dow(s)],
    onDay: s => WD_ACC[dow(s)],                                                           /* во вторник */
    rel(s, today) {                                                                       /* сегодня / завтра / вчера / 27 ноября */
      const n = diffDays(s, today);
      return n === 0 ? 'сегодня' : n === 1 ? 'завтра' : n === -1 ? 'вчера' : fmt.date(s);
    },
    when: (st, today) => fmt.rel(st, today) + ', ' + String(st).slice(11),                /* вчера, 18:05 */
    until(s, today) {                                                                     /* срок словами */
      const n = diffDays(s, today);
      if (n < 0) return 'Срок прошёл ' + fmt.date(s);
      if (n === 0) return 'Сегодня, до конца дня';
      if (n === 1) return 'До завтра, ' + fmt.date(s);
      return 'До ' + WD_GEN[dow(s)] + ', ' + fmt.date(s);
    },
    points: n => n + ' ' + plural(n, 'балл', 'балла', 'баллов'),
    pointsGen: n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'балла' : 'баллов'),          /* до 4 баллов, до 1 балла */
    pairs(n) {
      const w = ['Пар нет', 'Одна пара', 'Две пары', 'Три пары', 'Четыре пары', 'Пять пар'];
      return w[n] || n + ' ' + plural(n, 'пара', 'пары', 'пар');
    }
  };

  /* ------------------------------------------------------------------ хранилище браузера с запасом в памяти */
  /* В рамке предпросмотра localStorage и sessionStorage могут отсутствовать или бросать исключение.
     Тогда всё продолжает работать в памяти этой вкладки. */
  function makeStore(kind) {
    const mem = new Map();
    let live = true;
    const real = () => window[kind];                 /* само обращение может бросить исключение */
    return {
      get(key) {
        if (live) { try { return real().getItem(key); } catch (e) { live = false; } }
        return mem.has(key) ? mem.get(key) : null;
      },
      set(key, val) {
        mem.set(key, val);
        if (live) { try { real().setItem(key, val); } catch (e) { live = false; } }
      },
      del(key) {
        mem.delete(key);
        if (live) { try { real().removeItem(key); } catch (e) { live = false; } }
      },
      isLive: () => live
    };
  }
  const local = makeStore('localStorage');
  const tab = makeStore('sessionStorage');
  const KEY = 'dekanat:v1', SKEY = 'dekanat:session', PKEY = 'dekanat:prefs', IKEY = 'dekanat:intro', DKEY = 'dekanat:drafts', QKEY = 'dekanat:popped';
  /* LKEY — последний вход в этом браузере: новая вкладка открывается с ним (у каждой вкладки потом свой вход,
     чтобы в двух вкладках можно было держать студента и сотрудника). NKEY — «начался новый демо-день»: одна плашка. */
  const LKEY = 'dekanat:last', NKEY = 'dekanat:newday';
  /* «Готова» и перенос пары доходят до студентов не сразу: сообщение ждёт в очереди отправки, пока сотрудник
     может нажать «Отменить». Уходит оно по первому из событий: плашку закрыли, сделано следующее действие,
     сменился экран или вход, прошло HOLD_MS (порог условный). Пока сообщение ждёт, студент видит прежнее состояние. */
  const HOLD_MS = 8000;
  /* Чужая вкладка подбирает просроченное сообщение только с запасом: в срок его отправляет вкладка сотрудника сама.
     Так две вкладки не пишут одно и то же почти одновременно и не затирают правки друг друга. */
  const GRACE_MS = 1500;

  /* ------------------------------------------------------------------ справочники */
  const GROUP = 'g1';
  const SLOTS = [['09:00', '10:30'], ['10:40', '12:10'], ['12:20', '13:50'], ['14:30', '16:00'], ['16:10', '17:40']];
  const TYPES = {
    lec: { word: 'Лекция', kind: 'lec' }, sem: { word: 'Семинар', kind: 'sem' }, prac: { word: 'Практикум', kind: 'sem' },
    test: { word: 'Зачёт', kind: 'exam' }, exam: { word: 'Экзамен', kind: 'exam' }
  };
  /* Шаблон недели: день (1 — понедельник … 6 — суббота) → [слот, предмет, вид, аудитория] */
  const WEEK = {
    1: [[0, 'Английский язык', 'prac', '2104'], [1, 'Международное право', 'sem', '3041'], [3, 'Экономическая теория', 'lec', '1011']],
    2: [[1, 'История дипломатии', 'lec', '1011'], [2, 'Английский язык', 'prac', '2104']],
    3: [[0, 'Философия', 'lec', '1011'], [1, 'Экономическая теория', 'sem', '3020'], [3, 'Информатика', 'prac', '2210']],
    4: [[1, 'Международное право', 'lec', '1011'], [2, 'История дипломатии', 'sem', '3041']],
    5: [[0, 'Английский язык', 'prac', '2104'], [1, 'Информатика', 'prac', '2210']],
    6: [[1, 'История дипломатии', 'sem', '3041'], [2, 'Экономическая теория', 'lec', '1011']]
  };
  const REQ_TYPES = {
    study: { title: 'Справка об обучении', days: 1, note: 'по месту требования' },
    army: { title: 'Справка для военкомата', days: 3, note: 'для отсрочки' },
    acad: { title: 'Академическая справка', days: 5, note: 'предметы и оценки' },
    grant: { title: 'Справка о стипендии', days: 2, note: 'размер выплат' }
  };
  const STATUS = { new: 'Подана', work: 'В работе', need: 'Нужно уточнение', done: 'Готова' };
  /* Контакты деканата — вымышленные: адрес в зоне example, номер из нулей. */
  const DEAN = { room: 'каб. 1205', hours: 'пн–пт, 10:00–17:00', mail: 'dekanat@university.example', phone: '+7 (000) 000-00-00' };
  const LEVELS = { urgent: 'Срочно', important: 'Важно', fyi: 'К сведению' };

  /* Три вымышленные записи. Паролей в коде нет: только соль и хэш PBKDF2-HMAC-SHA-256, 120 000 итераций, 32 байта. */
  const PBKDF2_ROUNDS = 120000;
  const ACCOUNTS = [
    { login: 'student.a', userId: 'u-a', salt: '653874a904cbc09275cc4f30802ee28c', hash: 'cb98228a5a42f0514eb015479cd8c829ca999cf026f320ad0dd047848286ed78' },
    { login: 'student.b', userId: 'u-b', salt: '57f37de66ce0de2b52b2074fa85315a7', hash: 'de4af7687155aa0e424fd636cd5fd58d5a284b5a57f3afb384c068a376dc7ee5' },
    { login: 'dekanat', userId: 'u-s', salt: '9b553e665a9c0705f28f12d561190bee', hash: '27159ae2c464deb1234b3f79cd985d30da09e74f97e3e5ed66b4151cd63cb95d' }
  ];
  /* Для неизвестного логина считаем хэш так же долго, чтобы по времени ответа нельзя было угадать логин. */
  const NOBODY = { login: '', userId: '', salt: '00112233445566778899aabbccddeeff', hash: '' };

  /* ------------------------------------------------------------------ демо-часы */
  /* Учебный день демо: сегодня, если пн–сб; в воскресенье — понедельник. От него считаются все даты посева. */
  function demoDay(real) {
    const d = new Date(real.getFullYear(), real.getMonth(), real.getDate());
    if (d.getDay() === 0) d.setDate(d.getDate() + 1);
    return ymd(d);
  }
  const Clock = {
    MORNING: '08:40',
    /* 'morning' — утро учебного дня (демо, по умолчанию); 'now' — настоящее время */
    mode: () => (prefs().clock === 'now' ? 'now' : 'morning'),
    set(mode) { DB.pref('clock', mode === 'now' ? 'now' : 'morning'); },
    real: () => new Date(),
    now() { return Clock.mode() === 'now' ? new Date() : at(demoDay(new Date()), Clock.MORNING); },
    today: () => ymd(Clock.now()),
    demoDay: () => demoDay(new Date())
  };

  /* ------------------------------------------------------------------ расписание */
  const slotOf = n => ({ start: SLOTS[n][0], end: SLOTS[n][1] });
  /* Пары одного дня с учётом зачётов и переносов. ghosts — прежние места перенесённых пар. */
  function dayPairs(st, group, date) {
    const exams = (st.exams || []).filter(e => e.group === group && e.date === date);
    let list = (WEEK[dow(date)] || [])
      .filter(r => !exams.some(e => e.slot === r[0]))
      .map(r => ({ orig: r[0], n: r[0], subject: r[1], tp: r[2], room: r[3] }));
    exams.forEach(e => list.push({ orig: e.slot, n: e.slot, subject: e.subject, tp: e.type, room: e.room, exam: true }));
    const ghosts = [];
    (st.changes || []).filter(c => c.group === group && c.date === date).forEach(c => {
      const p = list.find(x => x.orig === c.from && !x.moved && !x.exam);
      if (!p || c.to === c.from || !SLOTS[c.to] || list.some(x => x !== p && x.n === c.to)) return;
      ghosts.push({ n: c.from, start: SLOTS[c.from][0], subject: p.subject, to: SLOTS[c.to][0], changeId: c.id });
      p.was = { n: c.from, start: SLOTS[c.from][0], end: SLOTS[c.from][1], room: p.room };
      p.n = c.to; p.room = c.room; p.moved = true; p.changeId = c.id; p.changedAt = c.at;
    });
    const pairs = list.sort((a, b) => a.n - b.n).map(p => ({
      date, n: p.n, orig: p.orig, start: SLOTS[p.n][0], end: SLOTS[p.n][1], subject: p.subject,
      type: TYPES[p.tp].word, kind: TYPES[p.tp].kind, room: p.room, exam: !!p.exam,
      moved: !!p.moved, was: p.was || null, changeId: p.changeId || null, changedAt: p.changedAt || null
    }));
    return { date, pairs, ghosts };
  }
  /* Ближайший учебный день: сегодня, пока не кончилась последняя пара; иначе следующий день с парами. */
  function studyDay(st, group, now) {
    let date = ymd(now);
    for (let i = 0; i < 14; i++, date = addDays(date, 1)) {
      const pairs = dayPairs(st, group, date).pairs;
      if (!pairs.length) continue;
      if (i === 0 && at(date, pairs[pairs.length - 1].end) <= now) continue;
      return date;
    }
    return ymd(now);
  }
  function weekOf(st, group, date) {
    const shift = dow(date) === 0 ? -6 : 1 - dow(date);
    const monday = addDays(date, shift);
    return [0, 1, 2, 3, 4, 5].map(i => dayPairs(st, group, addDays(monday, i)));
  }
  function nextPair(st, group, now) {
    let date = ymd(now);
    for (let i = 0; i < 14; i++, date = addDays(date, 1)) {
      const p = dayPairs(st, group, date).pairs.find(x => at(date, x.start) > now);
      if (p) return p;
    }
    return null;
  }
  /* Что сотрудник может перенести: пары ближайших двух учебных дней, которые ещё не начались, и свободные поздние слоты. */
  function movable(st, group, now) {
    const out = [];
    let date = studyDay(st, group, now);
    for (let days = 0, guard = 0; days < 2 && guard < 14; guard++, date = addDays(date, 1)) {
      const day = dayPairs(st, group, date);
      if (!day.pairs.length) continue;
      days++;
      day.pairs.forEach(p => {
        if (p.exam || at(date, p.start) <= now) return;
        const free = SLOTS.map((s, n) => n).filter(n => n > p.orig && n !== p.n && !day.pairs.some(x => x.n === n) && at(date, SLOTS[n][0]) > now);
        if (free.length) out.push({ key: date + '|' + p.orig, date, from: p.orig, n: p.n, start: p.start, subject: p.subject, type: p.type, room: p.room, moved: p.moved, free });
      });
    }
    return out;
  }
  const Sched = { SLOTS, day: dayPairs, studyDay, week: weekOf, next: nextPair, movable };

  /* ------------------------------------------------------------------ посев вымышленных данных */
  /* Перенос для посева: вторая пара дня уходит в первый свободный поздний слот. */
  function autoMove(date) {
    const rows = WEEK[dow(date)] || [];
    const second = rows[1];
    if (!second) return null;

      st.notes.forEach(n => {
        if (n.kind !== 'answered' || n.href !== '#req-' + r.id || n.to !== u.id) return;
        n.kind = 'need'; n.title = 'Деканат просит уточнить'; n.text = r.title + ': нужен ваш ответ.';
      });
      return { text: last.text };
    } },
    withdraw: { roles: ['student'], run(st, u, p, now) {
      const i = st.requests.findIndex(x => x.id === String(p.id) && x.owner === u.id);
      if (i < 0 || st.requests[i].status !== 'new') return NO;
      const r = st.requests.splice(i, 1)[0];
      st.notes = st.notes.filter(n => n.href !== '#req-' + r.id);
      note(st, 'staff', 'new', 'Заявка отозвана', u.name + ', ' + r.title.toLowerCase() + '.', '#staff', now);
    } },
    /* Карточку заявки открыли: её уведомления прочитаны; готовая справка у студента больше не «новая». */
    seen: { roles: ['student', 'staff'], run(st, u, p) {
      const r = st.requests.find(x => x.id === String(p.id) && OWN.request(x, u));
      if (!r) return NO;
      if (u.role === 'student' && r.status === 'done' && !r.hold) r.seen = true;
      st.notes.forEach(n => { if (n.href === '#req-' + r.id && OWN.note(n, u)) (n.read = n.read || {})[u.id] = true; });
    } },
    deadline: { roles: ['student'], run(st, u, p) {
      const d = st.deadlines.find(x => x.id === p.id && x.owner === u.id);
      if (!d) return NO;
      d.done = !!p.done;
    } },
    plan: { roles: ['student'], run(st, u, p) {
      let item = null;
      st.plans.filter(x => x.owner === u.id).forEach(pl => pl.items.forEach(w => { if (w.id === p.id) item = w; }));
      if (!item) return NO;
      item.done = !!p.done;
    } },
    read: { roles: ['student', 'staff'], run(st, u, p) {
      const n = st.notes.find(x => x.id === p.id && OWN.note(x, u));
      if (!n) return NO;
      (n.read = n.read || {})[u.id] = true;
    } },
    readAll: { roles: ['student', 'staff'], run(st, u) {
      st.notes.forEach(n => { if (OWN.note(n, u)) (n.read = n.read || {})[u.id] = true; });
    } },
    /* Смена статуса. «В работе» доходит до студента сразу. «Готова» ждёт в очереди отправки (см. HOLD_MS).
       Из «Готова» назад — «Вернуть в работу»: если сообщение ещё ждёт, оно просто не уйдёт; если ушло — студенту поправка. */
    status: { roles: ['staff'], run(st, u, p, now) {
      const r = st.requests.find(x => x.id === String(p.id));
      const next = pick({ new: ['work'], work: ['done'], need: ['done'], done: ['work'] }, r ? r.status : '') || [];
      if (!r || !next.includes(p.status)) return NO;
      if (r.status === 'done') {
        if (r.hold) { Object.assign(r, unhold(st, r)); return { undone: true }; }
        r.status = 'work'; r.doneAt = null; r.seen = false; r.replied = false; r.told = false; delete r.replyUndo;
        if (!r.workAt) r.workAt = stamp(now);
        note(st, r.owner, 'back', 'Справку вернули в работу', r.title + '. Ответим до ' + fmt.date(r.due) + '.', '#req-' + r.id, now, null, LIVE);
        return { back: true };
      }
      const prev = { status: r.status, workAt: r.workAt || null, doneAt: r.doneAt || null, replied: !!r.replied, replyBy: r.replyBy || null, seen: !!r.seen };
      r.status = p.status; r.replied = false; delete r.replyBy; delete r.replyUndo;
      if (p.status === 'work') {
        r.workAt = stamp(now);
        note(st, r.owner, 'status', r.title + ': в работе', 'Ответим до ' + fmt.date(r.due) + '.', '#req-' + r.id, now, null, LIVE);
        return {};
      }
      if (!r.workAt) r.workAt = stamp(now);
      r.doneAt = stamp(now); r.seen = false;
      return hold(st, u, 'request', r, prev, { to: r.owner, kind: 'ready', title: r.title + ' готова', text: 'Можно открыть образец и напечатать.', href: '#req-' + r.id }, now);
    } },
    /* «Отменить» на плашке: работает, только пока сообщение ещё не ушло. */
    undo: { roles: ['staff'], run(st, u, p) {
      const w = st.pending.find(x => x.id === String(p.pid) && x.by === u.id);
      if (!w) return { error: 'Сообщение уже ушло. Исправить можно кнопкой «' + (p.kind === 'move' ? 'Вернуть пару' : 'Вернуть в работу') + '».' };
      const list = w.target === 'change' ? st.changes : st.requests;
      const x = list.find(r => String(r.id) === String(w.ref));
      if (!x || !x.hold || x.hold.pid !== w.id) { st.pending = st.pending.filter(q => q !== w); return NO; }
      const prev = unhold(st, x);
      if (prev) Object.assign(x, prev);
      else st.changes = st.changes.filter(c => c !== x);                 /* новый перенос: его просто нет */
      return { target: w.target, id: x.id };
    } },
    /* Отправить ждущие сообщения этого сотрудника сейчас: плашку закрыли, сделано следующее действие, сменился экран. */
    commit: { roles: ['staff'], run(st, u, p) {
      const sent = deliver(st, w => w.by === u.id && (!p.pid || w.id === String(p.pid)));
      return sent ? { sent } : { sent, same: true };                /* нечего отправлять — и записывать нечего */
    } },
    clarify: { roles: ['staff'], run(st, u, p, now) {
      const r = st.requests.find(x => x.id === String(p.id));
      if (!r || r.status === 'done') return NO;
      const text = clean(p.text, 400);
      if (!text) return { error: 'Напишите вопрос студенту.' };
      const options = (Array.isArray(p.options) ? p.options : String(p.options || '').split(';')).map(x => clean(x, 60)).filter(Boolean);
      /* вариантов столько, сколько написали; больше шести — честный отказ, а не тихая обрезка */
      if (options.length > MAX_OPTS) return { error: 'Вариантов не больше шести, сейчас ' + options.length + '. Уберите лишние.', field: 'options' };
      const msg = { from: 'staff', at: stamp(now), text };
      if (options.length > 1) msg.options = options;
      /* Студент видит вопрос, когда сообщение ушло (плашка «Отменить» у сотрудника, правила как у «Готова»). */
      const prev = { status: r.status, workAt: r.workAt || null, replied: !!r.replied, replyBy: r.replyBy || null, thread: copy(r.thread) };
      /* Неотвеченный прежний вопрос не висит молча: он помечается «вопрос заменён» (у студента без кнопок ответа). */
      const last = r.thread[r.thread.length - 1];
      if (r.status === 'need' && last && last.from === 'staff') last.replaced = true;
      r.thread.push(msg);
      if (!r.workAt) r.workAt = stamp(now);
      r.status = 'need'; r.replied = false; r.replyBy = workDays(ymd(now), 1); delete r.replyUndo;
      return Object.assign({ replaced: !!(last && last.replaced) }, hold(st, u, 'request', r, prev, { to: r.owner, kind: 'need', title: 'Деканат просит уточнить', text: r.title + ': нужен ваш ответ.', href: '#req-' + r.id }, now));
    } },
    /* Перенос пары. С ключом dry (DB.act(..., { dry: true })) — только проверка и сводка «кто и что» для шага проверки.
       Сообщение группе ждёт в очереди отправки; студенты видят пару на прежнем месте, пока оно не ушло. */
    move: { roles: ['staff'], run(st, u, p, now) {
      const m = movable(st, GROUP, now).find(x => x.key === p.key);
      const to = Number(p.to), room = clean(p.room, 8);
      if (!m || !m.free.includes(to)) return { error: 'Эту пару уже нельзя перенести на выбранное время.' };
      if (!/^[0-9A-Za-zА-Яа-яЁё\- ]{1,8}$/.test(room)) return { error: 'Укажите аудиторию: до восьми букв и цифр.' };
      const sum = { subject: m.subject, type: m.type, date: m.date, was: m.start, wasRoom: m.room, start: SLOTS[to][0], room };
      let c = st.changes.find(x => x.group === GROUP && x.date === m.date && x.from === m.from), prev = null;
      if (c) {
        prev = c.hold ? unhold(st, c) : { to: c.to, room: c.room, at: c.at, ack: c.ack || {} };
        c.to = to; c.room = room; c.at = stamp(now); c.ack = {};
      } else { c = { id: 'c' + newId(st), group: GROUP, date: m.date, from: m.from, to, room, wasRoom: m.room, at: stamp(now), ack: {} }; st.changes.push(c); }
      const msg = { to: 'students', kind: 'move', title: 'Пара перенесена: ' + m.subject, ref: c.id,
        text: fmt.dayLong(m.date) + ': ' + SLOTS[m.from][0] + ' → ' + SLOTS[to][0] + ', ' + roomShift(c.wasRoom || m.room, room) + '.', href: '#schedule' };
      return Object.assign(sum, { id: c.id }, hold(st, u, 'change', c, prev, msg, now));
    } },
    /* «Вернуть пару»: перенос откатывается. Если сообщение о нём ещё ждёт — оно не уйдёт; если ушло — группе «Перенос отменён». */
    moveBack: { roles: ['staff'], run(st, u, p, now) {
      const c = st.changes.find(x => x.id === String(p.id) && x.group === GROUP);
      if (!c || !SLOTS[c.from] || !SLOTS[c.to]) return NO;
      if (at(c.date, SLOTS[Math.min(c.from, c.to)][0]) <= now) return { error: 'Пара уже началась: вернуть её нельзя.' };
      const subject = subjectOf(c);
      if (c.hold) {
        const prev = unhold(st, c);
        if (prev) Object.assign(c, prev); else st.changes = st.changes.filter(x => x !== c);
        return { undone: true, subject };
      }
      st.changes = st.changes.filter(x => x !== c);
      const students = st.users.filter(x => x.role === 'student').map(x => x.id);
      moveNotes(st, c).forEach(n => { n.read = n.read || {}; students.forEach(id => { n.read[id] = true; }); });
