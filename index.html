     блока заголовок называет содержимое. «Что сделать…» при плане не повторяется: план и есть ответ. */
  const fold = (key, title, about, body) => h`<details class="more fold" data-open="${key}" id="${key === 'book' ? 'book' : key + '-fold'}">
    <summary id="${key}-sum"><b>${title}</b><span>${about}</span><span class="sp"></span>${ico('chev')}</summary><div class="fold-in">${body}</div></details>`;
  /* «2 зачёта», «4 экзамена», «1 зачёт и 3 экзамена» */
  function examWords(list) {
    const t = list.filter(e => e.type === 'test').length, x = list.length - t;
    const w = (n, a, b, c) => n + ' ' + plural(n, a, b, c);
    return [t ? w(t, 'зачёт', 'зачёта', 'зачётов') : '', x ? w(x, 'экзамен', 'экзамена', 'экзаменов') : ''].filter(Boolean).join(' и ');
  }
  function viewStudy(c) {
    const adm = S.admission(c.v, c.me.id);
    const risk = adm.filter(a => !a.ok).sort((a, b) => b.need - a.need)[0] || adm.find(a => a.plan) || null;
    const exams = c.v.exams.filter(e => e.date >= c.today).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.slot - b.slot));
    const dls = c.v.deadlines.slice().sort((a, b) => (a.done === b.done ? (a.due < b.due ? -1 : a.due > b.due ? 1 : 0) : a.done ? 1 : -1));
    /* Срок, который истекает сегодня, стоит первым на странице: ссылка «Открыть работу» приводит прямо к нему. */
    const hot = dls.filter(d => !d.done && S.diffDays(d.due, c.today) <= 0), calmDls = dls.filter(d => !hot.includes(d));
    const dlRow = d => h`<li id="dl-${d.id}"><label class="check wide${d.done ? ' done' : ''}">
      <input type="checkbox"${on('deadline', { id: d.id })}${d.done ? raw(' checked') : ''}>
      <span><b>${d.title}</b><br><span class="fine">${d.subject ? d.subject + ' · ' : ''}${d.done ? 'сделано' : low(fmt.until(d.due, c.today))}</span></span></label></li>`;
    const planList = a => (a.plan ? h`<h3 class="cap">План до допуска</h3>
      <ul class="plan">${a.plan.items.map((w, i) => h`<li><span class="n">${i + 1}</span><b class="pt">${w.title}</b>
        <label class="check"><input type="checkbox"${on('plan', { id: w.id })}${w.done ? raw(' checked') : ''} aria-label="Сдано: ${w.title}"><span aria-hidden="true">Сдано</span></label>
        <span class="fine pf">до ${fmt.pointsGen(w.max)} · ${w.done ? 'сдано, ждёт проверки' : 'сдать до ' + fmt.date(w.due)}</span></li>`)}</ul>` : '');
    /* шаг «что сделать» нужен, только когда плана нет или его не хватает: иначе он пересказывает план */
    const planSays = r => !r.ok && !r.wait && !!r.plan && r.enough && r.works > 0;
    const block = !risk
      ? h`<section class="card adm st-adm" aria-label="Допуск к экзаменам"><h2 class="cap">Допуск к экзаменам</h2>
          <p class="adm-big">${ico('check')}<span>Допуск есть по всем предметам</span></p>
          <p>Баллы по каждому предмету выше порога. Для допуска больше ничего не нужно.</p></section>`
      : h`<section class="card adm st-adm" aria-label="Допуск к экзамену: ${risk.subject}"><h2 class="cap">Допуск к экзамену · ${risk.subject}</h2>
          ${risk.ok ? h`<p class="adm-big">${ico('check')}<span>Допуск есть</span></p>`
            : risk.wait ? h`<p class="adm-big">${ico('check')}<span>Работы сданы — ждём проверки</span></p>`
            : h`<p class="adm-big"><span class="flaps" data-flap="${risk.need}" data-fk="adm-${risk.subject}"></span><span>${plural(risk.need, 'балл', 'балла', 'баллов')} ${risk.pending ? 'осталось закрыть' : 'до допуска'}</span></p>`}
          ${admBar(risk.points, risk.max, risk.thr, risk.pending)}
          ${planSays(risk) ? '' : h`<p>${risk.step}</p>`}
          ${planList(risk)}</section>`;
    const examRow = e => {
      const a = adm.find(x => x.subject === e.subject);
      return h`<li><p class="t"><span class="tag exam">${EXAM_WORD[e.type] || 'Экзамен'}</span> ${e.subject}</p>
        <p class="m">${shortDay(e.date)} · ${startOf(e.slot)} · ауд. ${e.room}${a && !a.ok ? (a.wait ? ' · допуск ждёт проверки' : h` · <b>до допуска ${fmt.points(a.need)}</b>`) : ''}</p></li>`;
    };
    const near = exams.slice(0, 2), later = exams.slice(2);
    const span = later.length ? (later.length > 1 ? weekSpan(later[0].date, later[later.length - 1].date) : fmt.date(later[0].date)) : '';
    const examCard = h`<section class="card st-exams" aria-label="Ближайшие зачёты и экзамены"><h2 class="cap">Ближайшие зачёты и экзамены</h2>
      ${exams.length ? h`<ul class="list">${near.map(examRow)}</ul>
        ${later.length ? h`<details class="sub" data-open="exams"><summary id="exams-sum"><b>Ещё ${examWords(later)}</b><span>${span}</span><span class="sp"></span>${ico('chev')}</summary>
          <ul class="list">${later.map(examRow)}</ul></details>` : ''}` : h`<p class="muted">Ближайших зачётов и экзаменов нет.</p>`}</section>`;
    const okN = adm.filter(a => a.ok).length;
    const points = fold('points', 'Баллы за семестр', adm.length + ' ' + plural(adm.length, 'предмет', 'предмета', 'предметов') + ', допуск есть по ' + okN + ' из ' + adm.length, h`<div class="tw"><table class="t">
        <thead><tr><th scope="col">Предмет</th><th scope="col">Баллы</th><th scope="col">Допуск</th></tr></thead>
        <tbody>${adm.map(a => h`<tr><td>${a.subject}</td>
          <td class="n">${a.points}${a.pending ? h`<small> + до ${a.pending}</small>` : ''}<span class="mini-bar" aria-hidden="true"><i style="width:${pct(a.points / a.max)}%"></i><em style="left:${pct(a.thr / a.max)}%"></em></span></td>
          <td>${a.ok ? 'есть' : a.wait ? 'ждёт проверки' : h`<b>не хватает ${a.need}</b>`}</td></tr>`)}</tbody>
      </table></div>
      <p class="fine">Порог допуска — ${adm.length ? adm[0].thr : 40} из ${adm.length ? adm[0].max : 60} баллов, пунктир на полоске — порог.</p>`);
    const terms = Array.from(new Set(c.v.records.slice().sort((a, b) => a.order - b.order).map(r => r.term)));
    const book = terms.length ? fold('book', 'Зачётка', 'прошлые семестры: ' + terms.length + ', оценок: ' + c.v.records.length,
      h`${terms.map(term => h`<h3 class="book-h">${term}</h3><div class="tw"><table class="t book">
        <thead><tr><th scope="col">Предмет</th><th scope="col">Форма</th><th scope="col">Оценка</th></tr></thead>
        <tbody>${c.v.records.filter(r => r.term === term).map(r => h`<tr><td>${r.subject}</td><td>${r.kind}</td><td><b>${r.mark}</b></td></tr>`)}</tbody></table></div>`)}`) : '';
    return { title: 'Учёба', main: h`${head('Учёба')}
      <div class="cols study">
        <div class="stack">
          ${hot.length ? h`<section class="card flow hot st-hot" aria-label="Срок сегодня"><h2 class="cap">${hot.some(d => S.diffDays(d.due, c.today) < 0) ? 'Срок прошёл' : 'Срок сегодня'}</h2>
            <ul class="list">${hot.map(dlRow)}</ul></section>` : ''}
          ${block}
          <div class="st-points">${points}</div>
          <div class="st-book">${book}</div>
        </div>
        <div class="stack">
          ${examCard}
          <section class="card flow st-dl" aria-label="Сроки"><h2 class="cap">Сроки</h2>
            ${calmDls.length ? h`<ul class="list">${calmDls.map(dlRow)}</ul>` : h`<p class="muted">${hot.length ? 'Других сроков нет.' : 'Сроков нет.'}</p>`}</section>
        </div>
      </div>` };
  }

  /* ------------------------------------------------------------------ Заявки */
  /* Заявки студента: готовые наверх, потом те, где ждут ответа, потом поданные и в работе. */
  const REQ_ORDER = { done: 0, need: 1, new: 2, work: 3 };
  const reqSort = (a, b) => REQ_ORDER[a.status] - REQ_ORDER[b.status]
    || (a.status === 'done' ? String(b.doneAt || '').localeCompare(String(a.doneAt || '')) : 0)
    || (a.created < b.created ? 1 : a.created > b.created ? -1 : Number(b.id) - Number(a.id));
  /* Порядок строк не меняется, пока человек на экране: строка, у которой сменился статус, остаётся на месте
     и бледнеет, а над списком — «Порядок изменился · Обновить». Новый порядок — по кнопке или при новом входе на экран.
     Новые строки (заявка из другой вкладки) встают в конец: то, что под пальцем, не сдвигается. */
  function frozen(state, sorted) {
    const ids = sorted.map(r => r.id), now = {};
    sorted.forEach(r => { now[r.id] = r.status; });
    if (!state.order) { state.order = ids.slice(); state.st = Object.assign({}, now); }
    const have = new Set(ids);
    const order = state.order.filter(id => have.has(id)).concat(ids.filter(id => !state.order.includes(id)));
    order.forEach(id => { if (!has(state.st, id)) state.st[id] = now[id]; });
    state.order = order;
    const byId = new Map(sorted.map(r => [r.id, r]));
    return {
      rows: order.map(id => byId.get(id)),
      stale: order.join() !== ids.join(),
      pale: id => state.st[id] !== now[id] && order.indexOf(id) !== ids.indexOf(id)
    };
  }
  /* Полоса над списком. Высота у неё постоянная: надпись «Порядок изменился» появляется, а строки не сдвигаются. */
  const orderBar = (fz, action, left, cls) => h`<div class="qbar${cls ? ' ' + cls : ''}${fz.stale ? ' stale' : ''}">${left}${fz.stale
    ? h`<span class="qbar-alert"><span class="qbar-t" role="status">Порядок изменился<span aria-hidden="true"> · </span></span><button class="link-btn" type="button"${on(action)}>Обновить</button></span>` : ''}</div>`;
  const workdays = n => n + ' ' + plural(n, 'рабочий день', 'рабочих дня', 'рабочих дней');
  const dayOf = stamp => String(stamp || '').slice(0, 10);
  /* Статус всегда словом — прилагательным или причастием, не глаголом. Самые заметные метки — «Готова» (справку можно
     забрать) и там, где от человека что-то нужно. «Нужно уточнение» — одно для студента и сотрудника (решение 7);
     после ответа студента — «Ответ отправлен» у него и «Ответ получен» у сотрудника: один смысл, оба причастия. */
  const answered = r => r.status === 'work' && !!r.replied;
  function statusTag(r, staff) {
    if (r.status === 'done') return h`<span class="tag done">${ico('check')}Готова</span>`;
    if (r.status === 'need') return h`<span class="tag ${staff ? 'new' : 'need'}">Нужно уточнение</span>`;
    if (staff) {
      if (r.status === 'new') return h`<span class="tag need">Новая</span>`;
      return answered(r) ? h`<span class="tag need">Ответ получен</span>` : h`<span class="tag work">В работе</span>`;
    }
    if (answered(r)) return h`<span class="tag work">Ответ отправлен</span>`;
    if (r.status === 'work') return h`<span class="tag work">В работе</span>`;
    return h`<span class="tag new">Подана</span>`;
  }
  function reqNote(r, today) {
    if (r.status === 'done') return 'С ' + fmt.date(dayOf(r.doneAt || r.created)) + ' · можно напечатать';
    if (r.status === 'need') return 'Деканат ждёт вашего ответа';
    if (r.status === 'work') return 'Ответим до ' + fmt.date(r.due);
    return 'Подана ' + fmt.when(r.created, today) + ' · ответим до ' + fmt.date(r.due);
  }
  function viewRequests(c) {
    /* Заявка, которую человек только что заказал сам, стоит первой в «Моих заявках» — на видном месте, с подсветкой.
       Это не «порядок изменился»: строку добавил он сам, поэтому полосы «Обновить» от неё нет. После ухода с экрана
       и по «Обновить» порядок обычный. */
    const fresh = (ui.rq.fresh || []).filter(id => c.v.requests.some(r => r.id === id));
    const sorted = c.v.requests.slice().sort(reqSort);
    const all = fresh.map(id => sorted.find(r => r.id === id)).concat(sorted.filter(r => !fresh.includes(r.id)));
    if (ui.rq.order) ui.rq.order = fresh.filter(id => !ui.rq.order.includes(id)).concat(ui.rq.order);
    const fz = frozen(ui.rq, all);
    const list = fz.rows;
    return { title: 'Заявки', main: h`${head('Заявки')}
      <div class="cols">
        <div class="stack">
          <section aria-label="Заказать справку"${guard('order')}><h2 class="cap">Заказать справку</h2>
            <div class="quick">${Object.keys(S.REQ_TYPES).map(t => h`<button type="button"${on('order', { type: t })}${off('order')}><b>${S.REQ_TYPES[t].title}</b><span>${S.REQ_TYPES[t].note} · ${workdays(S.REQ_TYPES[t].days)}</span></button>`)}</div></section>
          <section aria-label="Мои заявки">${orderBar(fz, 'rq-sort', h`<h2 class="cap">Мои заявки</h2>`, 'rq')}
            ${list.length ? h`<ul class="rows">${list.map(r => h`<li${fz.pale(r.id) ? raw(' class="pale"') : ''}><a class="rowb" href="#req-${r.id}" id="row-${r.id}"><span class="t">${r.title}</span><span class="m">${reqNote(r, c.today)}</span><span class="st">${statusTag(r, false)}</span></a></li>`)}</ul>`
              : h`<p class="card muted">Заявок пока нет. Нажмите на нужную справку выше — заявка уйдёт сразу.</p>`}</section>
        </div>
      </div>` };
  }

  /* Трекер «Подана → В работе → Готова» с датами и «Ответим до…». */
  function tracker(r, today, staff) {
    const step = r.status === 'done' ? 2 : r.status === 'new' ? 0 : 1;
    const li = (i, title, sub) => h`<li class="${i > step ? 'todo' : ''}${i === step ? ' cur' : ''}${i >= step && i < 2 ? ' next' : ''}"${i === step ? raw(' aria-current="step"') : ''}><b>${title}</b><span>${sub}</span></li>`;
    const mid = r.status === 'need' ? (staff ? 'ждём ответа студента' : 'нужно ваше уточнение') : r.workAt ? fmt.when(r.workAt, today) : 'ждёт очереди';
    return h`<ol class="steps" aria-label="Шаги заявки">${li(0, 'Подана', fmt.when(r.created, today))}${li(1, 'В работе', mid)}
      ${li(2, 'Готова', r.doneAt ? fmt.when(r.doneAt, today) : (staff ? 'ответить до ' : 'ответим до ') + fmt.date(r.due))}</ol>`;
  }
  const PAPER_TEXT = {
    study: 'Справка выдана для предъявления по месту требования.',
    army: 'Справка выдана для военкомата.',
    acad: 'К справке прилагается перечень предметов и баллов.',
    grant: 'К справке прилагаются сведения о стипендии.'
  };
  /* Образец для печати. Не документ: без герба, печати и подписи, с крупной пометкой. */
  const paper = (r, owner) => h`<div class="paper">
    <div class="wm" aria-hidden="true">образец</div>
    <h3>${r.title}</h3>
    <p>Выдана: <b>${owner ? owner.name : 'студент'}</b>${owner && owner.about ? ', ' + owner.about : ''}.</p>
    <p>Подтверждает, что студент учится очно. ${has(PAPER_TEXT, r.type) ? PAPER_TEXT[r.type] : ''}</p>
    <p>Заявка № ${r.id} · готова ${fmt.date(dayOf(r.doneAt || r.created))}</p>
    <p class="paper-note">Образец из прототипа «Цифровой деканат». Не документ: без печати и подписи.</p>
  </div>`;
  function viewReq(c) {
    const r = DB.get('request', c.route.id, c.session);
    if (!r) return viewNotFound(c);
    const staff = c.me.role === 'staff', today = c.today;
    const owner = staff ? DB.get('user', r.owner, c.session) : c.me;
    const mine = m => (m.from === 'staff') === staff;
    const author = m => (m.from === 'staff' ? 'Деканат' : owner ? owner.name : 'Студент');
    /* Если деканат дал варианты ответа, студент отвечает одной кнопкой; поле остаётся для своего ответа. */
    const lastAsk = r.thread.filter(m => m.from === 'staff').slice(-1)[0] || null;
    const opts = !staff && r.status === 'need' && lastAsk && Array.isArray(lastAsk.options) ? lastAsk.options : [];
    /* Ответ можно изменить, пока сотрудник не сменил статус после него. */
    const lastMsg = r.thread[r.thread.length - 1];
    const editable = !staff && r.status === 'work' && r.replied && lastMsg && lastMsg.from === 'student';
    const thread = r.thread.length ? h`<section class="card flow" aria-label="Переписка"${guard('thr-' + r.id)}><h2 class="cap">${staff ? 'Уточнение' : 'Вопрос деканата'}</h2>
      <div class="thread">${r.thread.map(m => h`<div class="msg ${mine(m) ? 'me' : 'staff'}${m.replaced ? ' replaced' : ''}"><small>${mine(m) ? 'Вы' : author(m)} · ${fmt.when(m.at, today)}${m.replaced ? ' · вопрос заменён' : ''}</small>${m.text}${staff && Array.isArray(m.options) ? h`<small class="opts">Варианты ответа: ${m.options.join('; ')}</small>` : ''}</div>`)}</div>
      ${opts.length ? h`<div class="answers" role="group" aria-label="Варианты ответа"><p class="cap">Ответить одной кнопкой</p>
        ${opts.map((o, i) => h`<button class="ghost" type="button"${on('answer', { id: r.id, v: String(i) })}${off('thr-' + r.id)}>${o}</button>`)}</div>` : ''}
      ${!staff && r.status === 'need' ? h`<form class="form" data-form="reply" data-id="${r.id}" novalidate>
        <label for="reply-text">${opts.length ? 'Или свой ответ' : 'Ваш ответ'}</label>
        <textarea id="reply-text" name="text" maxlength="400" data-draft data-keep></textarea>
        <p class="err" role="alert" data-err="reply" hidden></p>
        <button class="btn" type="submit" id="reply-go"${off('thr-' + r.id)}>Отправить ответ</button></form>` : ''}
      ${editable ? h`<p class="after"><button class="ghost" type="button"${on('reply-edit', { id: r.id })}${off('thr-' + r.id)}>Изменить ответ</button></p>` : ''}</section>` : '';
    const sample = r.status === 'done' ? h`<section aria-label="Образец справки">
      ${paper(r, owner)}
      ${staff ? '' : h`<div class="now-actions after"><button class="btn" type="button"${on('print')}>Напечатать</button>
        <button class="ghost" type="button"${on('again', { type: r.type })}>Заказать ещё раз</button></div>
        <p class="fine" data-hint="print" hidden>Откройте страницу отдельно, чтобы напечатать.</p>`}</section>` : '';
    const next = r.status === 'done' ? 'Настоящую справку выдаёт деканат.'
      : r.status === 'need' ? (r.replyBy ? 'Ответьте до ' + fmt.date(r.replyBy) + ': без ответа' : 'Без ответа') + ' справку не подготовят.'
      : r.status === 'work' ? 'Справку готовят. Ответим до ' + fmt.date(r.due) + '; о готовности придёт уведомление.'
      : 'Заявка в очереди. Деканат возьмёт её в работу и ответит до ' + fmt.date(r.due) + '.';
    /* Пока студент не ответил на вопрос, второй вопрос — только явной заменой: прежний у студента помечается «вопрос заменён». */
    const waitAsk = staff && r.status === 'need' && lastAsk && r.thread[r.thread.length - 1] === lastAsk && !ui.replace[r.id];
    const clarify = r.status === 'done' ? '' : waitAsk ? h`<div class="ask-wait"><p>Ждём ответа на вопрос «${lastAsk.text}».</p>
        <p><button class="ghost" type="button"${on('replace-ask', { id: r.id })}${off('req-' + r.id)}>Заменить вопрос</button></p></div>`
      : h`<form class="form" data-form="clarify" data-id="${r.id}" novalidate>
      <label for="clarify-text">${r.status === 'need' && staff ? 'Новый вопрос вместо прежнего' : 'Вопрос студенту'}</label>
      <textarea id="clarify-text" name="text" maxlength="400" data-draft data-keep></textarea>
      <label for="clarify-opts">Варианты ответа через точку с запятой, до шести — студент ответит одной кнопкой (необязательно)</label>
      <input id="clarify-opts" name="options" type="text" maxlength="400" autocomplete="off" data-draft data-keep>
      <p class="err" role="alert" data-err="clarify" hidden></p>
      <button class="ghost" type="submit" id="clarify-go">${r.status === 'need' ? 'Заменить вопрос' : 'Спросить студента'}</button></form>`;
    const g = 'req-' + r.id, dis = off(g);
    const side = staff
      ? h`<section class="card flow" aria-label="Действия"${guard(g)}><h2 class="cap">Действия</h2>
          ${r.status === 'new' ? h`<p>Заявка ждёт очереди. Ответить нужно до ${fmt.date(r.due)}.</p><p><button class="btn" type="button"${on('status', { id: r.id, v: 'work' })}${dis}>Взять в работу</button></p>`
            : r.status === 'work' ? h`<p>${r.replied ? 'Студент ответил на уточнение. ' : ''}Справка в работе до ${fmt.date(r.due)}.</p><p><button class="btn" type="button"${on('status', { id: r.id, v: 'done' })}${dis}>Отметить готовой</button></p>`
            : r.status === 'need' ? h`<p>Ждём ответа студента${r.replyBy ? ' до ' + fmt.date(r.replyBy) : ''}.</p><p><button class="ghost" type="button"${on('status', { id: r.id, v: 'done' })}${dis}>Отметить готовой</button></p>`
            : h`<p>${r.hold ? 'Справка готова. Сообщение студенту ещё не ушло.' : 'Заявка закрыта: справка готова.'}</p><p><button class="ghost" type="button"${on('status', { id: r.id, v: 'back' })}${dis}>Вернуть в работу</button></p>`}
          ${clarify}</section>`
      : h`<section class="card flow" aria-label="Что дальше"><h2 class="cap">Что дальше</h2><p>${next}</p>
          ${r.status === 'new' ? h`<p><button class="ghost" type="button"${on('withdraw', { id: r.id })}>Отозвать заявку</button></p>` : ''}</section>`;
    const unreadHere = c.v.notes.some(n => n.href === '#req-' + r.id && !(n.read && n.read[c.me.id]));
    return { title: r.title, seen: unreadHere || (!staff && r.status === 'done' && !r.seen) ? r.id : null,
      main: h`<p class="crumb"><a class="link-btn" href="${staff ? '#staff' : '#requests'}">${ico('back', 'i sm')}${staff ? 'Очередь' : 'Все заявки'}</a></p>
        ${head(r.title, 'Заявка № ' + r.id + (staff && owner ? ' · ' + owner.name + ', ' + owner.about : '') + ' · подана ' + fmt.when(r.created, today))}
        <div class="cols">
          <div class="stack">
            <section class="card" aria-label="Статус"><div class="hrow"><h2 class="cap">Статус</h2>${statusTag(r, staff)}</div>
              ${!staff && r.status === 'need' ? h`<p class="st-line">Деканат ждёт вашего ответа</p>` : ''}${tracker(r, today, staff)}</section>
            ${thread}${sample}
          </div>
          <aside class="stack">${side}</aside>
        </div>` };
  }

  /* ------------------------------------------------------------------ Уведомления */
  function viewNotes(c) {
    const rows = c.v.notes.map((n, i) => ({ n, i })).sort((a, b) => (a.n.at < b.n.at ? 1 : a.n.at > b.n.at ? -1 : b.i - a.i));
    const unread = c.unread;
    return { title: 'Уведомления', main: h`${head('Уведомления', unread ? 'Непрочитанных: ' + unread : 'Всё прочитано')}
      <div class="cols">
        <div class="stack">
          <div class="qbar"><span class="sp"></span><button class="ghost" type="button"${on('read-all')}${unread ? '' : raw(' disabled')}>Отметить всё прочитанным</button></div>
          ${rows.length ? h`<ul class="rows">${rows.map(({ n }) => {
            const isNew = !(n.read && n.read[c.me.id]);
            return h`<li><a class="rowb${isNew ? ' unread' : ''}" href="${hrefOf(n.href)}"${on('note', { id: n.id })}>
              <span class="t">${isNew ? h`<span class="vh">Новое: </span>` : ''}${n.kind === 'move' ? moveSign() : ''}${n.title}</span>
              <span class="m">${n.text}</span><span class="st fine">${fmt.when(n.at, c.today)}</span></a></li>`;
          })}</ul>` : h`<p class="card muted">Уведомлений пока нет.</p>`}
        </div>
        <aside class="stack"><section class="card flow" aria-label="О журнале"><h2 class="cap">Журнал</h2>
          <p>Сюда приходят переносы пар, ответы деканата и объявления. Нажмите на строку, чтобы открыть, о чём она.</p></section></aside>
      </div>` };
  }

  /* ------------------------------------------------------------------ Профиль, Сотрудник, Лицензии, «Не найдено» */
  /* Шесть автопроверок ранжирования: считаются в браузере на заготовках, список раскрывается. */
  function checksFold() {
    const r = S.runChecks();
    return h`<details class="more" data-open="checks">
      <summary id="checks-sum"><b>Автопроверки: ${r.passed} из ${r.total}</b><span>как выбирается «Главное сейчас»</span><span class="sp"></span>${ico('chev')}</summary>
      ${r.list.map(x => h`<div class="item"><span class="tag ${x.ok ? 'done' : 'need'}">${x.ok ? h`${ico('check')}Пройдена` : 'Не пройдена'}</span><p class="t">${x.name}</p></div>`)}
      <p class="empty">Шесть правил важности проверяются прямо в браузере на заготовленных данных и ваши не трогают.</p></details>`;
  }
  /* «О концепте» — отдельный экран по ссылке из подвала: всё, что обращено к жюри, а не к студенту. Из профиля и
     с экрана сотрудника блок убран. Здесь же демо-время, «Автопроверки: 6 из 6» и у сотрудника «Сбросить демо». */
  function viewAbout(c) {
    const info = DB.info(), me = c && c.me ? c.me : null, staff = !!me && me.role === 'staff';
    const back = me ? Router.home(me.role) : '#login';
    return { title: 'О концепте', main: h`${head('О концепте')}
      <div class="stack prose">
        <section class="card flow about" id="about" aria-label="О концепте">
          <p>«${BRAND}» — конкурсный концепт для MGIMO AI Challenge. Здесь собрано то, что важно знать жюри; студенту в настоящем сервисе этот экран не понадобился бы.</p>
          <dl class="facts">
            <div><dt>Сервера нет; показана логика доступа</dt><dd>Данные остаются в этом браузере, а права проверяет код страницы: чужую заявку и чужой раздел он не откроет. Настоящую защиту даёт только сервер.</dd></div>
            <div><dt>Данные вымышлены</dt><dd>Люди, оценки, заявки и справки придуманы. ${info.persistent ? 'Демо хранится в этом браузере, вход запоминается.' : 'Хранилище браузера недоступно: данные живут, пока открыта вкладка.'} В полночь начинается новый демо-день: заявки и ответы прошлого дня сбрасываются.${me ? ' Демо-запись: ' + me.login + '.' : ''}</dd></div>
            <div><dt>Время на экранах <span class="concept">демо</span></dt><dd>${clockSeg('prof')}<br>«Утро учебного дня» — ${Clock.MORNING} ближайшего учебного дня: так виден срочный перенос. «Сейчас» — настоящее время.</dd></div>
            ${staff ? h`<div><dt>Демо-данные</dt><dd>Сброс вернёт заявки, переносы и уведомления к началу учебного дня.
              <br><button class="ghost" type="button"${on('reset')}>Сбросить демо</button></dd></div>` : ''}
          </dl>
          ${checksFold()}
          <p><a class="link-btn" href="#licenses">Лицензии и источники</a></p></section>
      </div>
      <p class="after"><a class="ghost" href="${back}">${ico('back', 'i sm')}Назад</a></p>` };
  }
  function viewProfile(c) {
    const staff = c.me.role === 'staff', me = c.me, D = S.DEAN;
    const who = staff
      ? h`<div class="tiles"><div class="tile"><span class="k">Роль</span><span class="v">Сотрудник деканата</span><span class="m">очередь заявок, переносы пар, объявления</span></div>
          <a class="tile" href="#staff"><span class="k">Очередь</span><span class="v">${c.v.requests.filter(r => r.status !== 'done').length}</span><span class="m">открытых заявок</span></a></div>`
      : h`<div class="tiles">
          <div class="tile"><span class="k">Курс и группа</span><span class="v">${me.course || ''}, ${me.groupName || ''}</span><span class="m">${me.form || ''}</span></div>
          <div class="tile"><span class="k">Направление</span><span class="v name">${me.program || ''}</span><span class="m">учебный план и зачётка — в разделе «Учёба»</span></div>
        </div>
        <section class="card flow" aria-label="Деканат"><h2 class="cap">Деканат</h2>
          <ul class="list contacts"><li><p class="t">${D.room}</p><p class="m">${D.hours}</p></li>
            <li><a class="t" href="mailto:${D.mail}">${D.mail}</a><p class="m">почта деканата</p></li><li><a class="t" href="tel:${D.phone.replace(/[^+0-9]/g, '')}">${D.phone}</a><p class="m">телефон</p></li></ul>
          <p class="fine">Справку можно заказать без похода в деканат — в разделе <a href="#requests">«Заявки»</a>.</p></section>`;
    /* ФИО — заголовком, курс и группа — плиткой: в первом экране каждое по одному разу. У сотрудника роль — в плитке. */
    return { title: 'Профиль', main: h`${head(staff ? me.name : me.full || me.name, staff ? '' : 'Зачётная книжка № ' + (me.book || '—'))}
      <div class="cols prof">
        <section class="card prof-view" aria-label="Вид и выход"><h2 class="cap">Вид и выход</h2>
          <div class="set-row"><span>Тема</span>${themeSeg('prof')}<span class="sp"></span><button class="ghost" type="button"${on('logout', {}, 'prof')}>${ico('out')}Выйти</button></div></section>
        <div class="stack prof-main">
          ${who}
          <a class="rowb card-link" href="#notifications"><span class="t">Уведомления</span><span class="m">${c.unread ? 'непрочитанных: ' + c.unread : 'всё прочитано'}</span></a>
        </div>
      </div>` };
  }
  function viewStaff(c) {
    const today = c.today;
    const rank = r => (r.status === 'new' ? 0 : r.status === 'work' && r.replied ? 1 : r.status === 'work' ? 2 : r.status === 'need' ? 3 : 4);
    const sorted = c.v.requests.slice().sort((a, b) => rank(a) - rank(b) || (rank(a) === 4 ? (dayOf(a.doneAt) < dayOf(b.doneAt) ? 1 : -1) : (a.due < b.due ? -1 : a.due > b.due ? 1 : Number(a.id) - Number(b.id))));
    const fz = frozen(ui.q, sorted), list = fz.rows;
    const name = id => { const u = c.v.users.find(x => x.id === id); return u ? u.name : 'Студент'; };
    const open = sorted.filter(r => r.status !== 'done').length;
    const rowNote = r => name(r.owner) + ' · ' + (r.status === 'done' ? 'готова ' + fmt.rel(dayOf(r.doneAt || r.created), today) : 'подана ' + fmt.when(r.created, today) + ' · ответить до ' + fmt.date(r.due));
    /* Одна главная кнопка на строку («Взять в работу», «Отметить готовой»); «Вернуть в работу» у готовой — второстепенная.
       После касания место строки 1 с неактивно. */
    const rowAct = r => {
      const d = off('q-' + r.id);
      return r.status === 'new' ? h`<button class="btn" type="button"${on('status', { id: r.id, v: 'work' })}${d}>Взять в работу</button>`
        : r.status === 'work' ? h`<button class="btn" type="button"${on('status', { id: r.id, v: 'done' })}${d}>Отметить готовой</button>`
        : r.status === 'done' ? h`<button class="ghost" type="button"${on('status', { id: r.id, v: 'back' })}${d}>Вернуть в работу</button>` : '';
    };
    const users = c.v.users.find(u => u.role === 'student' && u.group === S.GROUP);
    const group = cap(users && users.groupName ? users.groupName : 'группа');
    const mv = Sched.movable(c.v, S.GROUP, c.now);
    /* В форме ничего не выбрано заранее: кнопка активна, когда выбраны пара и новое время. */
    const cur = mv.find(m => m.key === ui.mv.key) || null;
    const toVal = ui.drafts['mv-to'];
    const ready = !!cur && cur.free.some(n => String(n) === String(toVal));
    const moved = [];
    [0, 1, 2, 3, 4, 5, 6].forEach(i => Sched.day(c.v, S.GROUP, S.addDays(today, i)).pairs.forEach(p => { if (p.moved) moved.push(p); }));
    const step = ui.mv.step;

    function draw(p0) {
      /* Путь камеры в прежней шкале (q = p · KZ): 2–48 % — приближение, с 14 % из проёма идёт свет; завеса — по veilAt(p). */
      const p = p0 * KZ;
      const zt = clamp((p - 0.02) / 0.46), z = zt * zt;
      const s = Math.exp(lnS * z);
      put(title, 't', 'transform', s > 1.0005 ? 'scale(' + s.toFixed(4) + ')' : 'none');
      const f = 1 - smooth(0.02, 0.1, p);
      fades.forEach((el, i) => fade(el, 'f' + i, f));
      const c = 1 + 0.36 * smooth(0.02, 0.5, p);
      put(cam, 'c', 'transform', c > 1.0005 ? 'scale(' + c.toFixed(4) + ')' : 'none');
      const v = veilAt(p0), under = v >= 1 ? 'hidden' : 'visible';
      const e = smooth(0.14, 0.5, p);
      put(bloom, 'b', 'transform', 'scale(' + (0.9 + 9 * e * e).toFixed(4) + ')');
      fade(bloom, 'b', v >= 1 ? 0 : smooth(0.16, 0.42, p));
      fade(veil, 'v', v);
      fade(title, 't', v < 1 ? 1 : 0);                             /* под сплошной завесой надпись и сцена не рисуются */
      put(cam, 'c', 'visibility', under);

    function frame(ts) {
      raf = 0;

      const y = pageY(), goal = clamp((y - top) / travel);
      if (still) { flags(goal, y); hold(0); return; }
      const dt = last ? Math.min(0.05, Math.max(0.001, (ts - last) / 1000)) : 1 / 60;
      last = ts;
      /* первый кадр и кадр за концом пути (переход ко входу, прыжок вниз) встают сразу; остальное догоняет плавно */
      sp = sp < 0 || y >= top + travel ? goal : damp(sp, goal, 10, dt);
      if (Math.abs(goal - sp) < 0.0004) sp = goal;

    const sync = () => {
      if (!photo) return;

    let fonts = null;

  function compose() {

    if (!session) {

      return r.view === 'licenses' ? guestPage(viewLicenses(null)) : r.view === 'about' ? guestPage(viewAbout(null)) : homePage(r);

    if (!ui.kept) { ui.drafts = Object.assign(DB.drafts(session), ui.drafts); ui.kept = true; }   /* черновики из этой вкладки */
    const v = DB.view(session), now = Clock.now();

  /* ------------------------------------------------------------------ запуск отрисовки */
  function render() {

  /* ------------------------------------------------------------------ действия */

  async function doLogin(form) {

    if (res.ok && res.session) { enter(res.session); return; }
    ui.errs.login = res.error || 'Войти не получилось.';

    if (!pass.isConnected) return;
    /* фокус туда, где нужно исправить: пустой логин — в «Логин», пустой пароль — в «Пароль», не подошли — пароль заново */

    'move-back'(el) {
      const id = el.dataset.id;
      ask({ title: 'Вернуть пару?', text: (el.dataset.say || '') + '. Студенты получат «Перенос отменён».', ok: 'Вернуть пару', cancel: 'Назад' })
        .then(yes => {
          if (!yes) return;
          lock('mb-' + id);
          const res = act('moveBack', { id });
          if (res.ok) toast(res.undone ? 'Перенос отменён. Студенты ничего не получили.' : 'Пара на прежнем времени. Студентам ушло «Перенос отменён».');
        });
    },
    reset() {
      ask({ title: 'Сбросить демо?', text: 'Заявки, переносы и уведомления вернутся к началу учебного дня. Это увидят все открытые вкладки.', ok: 'Сбросить' })
        .then(yes => { if (yes) { hideToast(); act('reset', {}, 'Демо-данные сброшены.'); } });
    },
    recover() { DB.recover(); leave(); }
  };
  /* Черновик поля: ключ — id поля и заявки (у каждой заявки свой черновик). Поля с data-keep переживают перезагрузку. */
  const draftKey = el => el.id + (el.form && el.form.dataset && el.form.dataset.id ? '@' + el.form.dataset.id : '');
  function dropDraft(el) {
    const key = draftKey(el), s = Auth.session();
    delete ui.drafts[key];
    if (s && el.hasAttribute('data-keep')) DB.draft(s, key, '');
  }
  /* Формы: текст человека уходит в ядро как есть, а на экран возвращается только через esc(). */
  function sendText(form, name, key, done, opt) {
    const field = form.elements.text;
    const res = DB.act(Auth.session(), name, { id: form.dataset.id, text: field.value });
    if (!res.ok) { ui.errs[key] = res.error; applyUi(); field.focus(); return res; }
    ui.errs[key] = '';
    dropDraft(field);
    field.value = '';
    applyUi();
    toast(typeof done === 'function' ? done(res) : done, opt);
    return res;
  }
  const FORMS = {
    login(form) { doLogin(form); },
    reply(form) {
      const id = form.dataset.id;
      lock('thr-' + id);
      sendText(form, 'reply', 'reply', res => 'Ответ отправлен: «' + res.text + '».', { undo: () => unreply(id, false), valid: () => canUnreply(id) });
    },
    clarify(form) {
      const field = form.elements.text, opts = form.elements.options;
      const res = DB.act(Auth.session(), 'clarify', { id: form.dataset.id, text: field.value, options: opts ? opts.value : '' });
      if (!res.ok) { ui.errs.clarify = res.error; applyUi(); (res.field === 'options' && opts ? opts : field).focus(); return; }
      ui.errs.clarify = '';
      dropDraft(field);
      if (opts) dropDraft(opts);
      field.value = ''; if (opts) opts.value = '';
      const id = form.dataset.id;
      lock('req-' + id);                                             /* второй щелчок по «Спросить студента» — без ошибки «Напишите вопрос» */
      ui.replace[id] = false;
      toast(res.replaced ? 'Вопрос заменён. Студент получит уведомление' : 'Вопрос отправлен студенту.', { held: { pid: res.pid, ref: id, kind: 'need', due: res.due }, undo: () => undoHeld(res.pid, 'need') });
    },
    announce(form) { sendText(form, 'announce', 'announce', 'Объявление опубликовано. Студенты увидят его сразу.'); },
    /* «Перенести пару» не переносит сразу: сначала проверка аудитории и шаг «кто и что». */
    move(form) {
      const payload = { key: form.elements.pair.value, to: form.elements.to.value, room: form.elements.room.value };
      const res = DB.act(Auth.session(), 'move', payload, { dry: true });
      if (!res.ok) { ui.errs.move = res.error; applyUi(); return; }
      ui.errs.move = '';
      lock('mv');
      ui.mv.step = { payload, subject: res.subject, date: res.date, was: res.was, wasRoom: res.wasRoom, start: res.start, room: res.room };
      ui.focus = 'mv-check-h';
      requestRender();
    }
  };
  /* Новое сообщение от деканата студенту (статус заявки, перенос, объявление): плашка при следующем открытии.
     Не поверх плашки с «Отменить» и не в фоновой вкладке — дождёмся, когда её откроют. */
  function popFresh() {
    const s = Auth.session();
    if (!s || s.role !== 'student' || held || doc.hidden || doc.getElementById('toast-undo') || doc.getElementById('toast-day')) return;
    const fresh = DB.fresh(s);
    if (!fresh.length) return;
    DB.popped(s, fresh.map(n => n.id));
    const one = fresh.length === 1 ? fresh[0] : null;
    toast(one ? one.title : 'Новых уведомлений: ' + fresh.length, { go: { label: 'Посмотреть', href: one ? hrefOf(one.href) : '#notifications' } });
  }
  /* Начался новый демо-день (в полночь посев начинается заново): при следующем открытии кабинета — одна плашка,
     чтобы человек не решил, что заявка потерялась. Показывается один раз на весь браузер. */
  /* Круг 5 (Н2): сброс в полночь, когда страница открыта, тоже не молчит. Каждая вкладка помнит демо-день, который
     показывала (seenDay); сменился — плашка сразу, во всех открытых вкладках и у сотрудника (фоновая — когда её откроют).
     Черновик в поле не теряется: он живёт во вкладке; если его заявки после сброса нет — об этом сказано в плашке. */
  let seenDay = '';
  function dayNote() {
    const s = Auth.session(), day = DB.info().seedDay;
    const turned = !!seenDay && day !== seenDay;
    if (!doc.hidden) seenDay = day;
    if (!s || held || doc.hidden) return false;
    if (!turned && !DB.newDay()) return false;
    DB.newDay(true);
    const lost = [];
    Object.keys(ui.drafts).forEach(k => {
      const m = /@([a-z0-9]{1,12})$/.exec(k);
      if (!m || !String(ui.drafts[k] || '').trim() || DB.get('request', m[1], s)) return;
      if (!lost.includes(m[1])) lost.push(m[1]);
      delete ui.drafts[k];
      DB.draft(s, k, '');
    });
    toast('Начался новый демо-день. Вчерашние заявки и ответы сброшены.' + (lost.length ? ' Черновик по заявке № ' + lost.join(', ') + ' сброшен вместе с ней.' : ''), { close: true, life: 30000 });
    const line = $('#toast .toast-t');
    if (line) line.id = 'toast-day';                                 /* пока плашка видна, сообщения о новом её не сменят */
    return true;
  }

  /* ------------------------------------------------------------------ события: одно делегирование на страницу */
  /* Место, которое только что сменило статус, 1 с не принимает касаний (см. lock). */
  doc.addEventListener('click', e => {
    const t = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    const g = t && t.closest ? t.closest('[data-guard]') : null;
    if (g && app.contains(g) && locked(g.dataset.guard)) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  doc.addEventListener('click', e => {
    const t = e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement;
    if (!t || !t.closest) return;
    if (t.closest('a.skip')) {                                      /* «К содержимому»: фокус без смены адреса */
      e.preventDefault();
      const main = doc.getElementById('main');
      if (main) main.focus();
      return;
    }
    const sum = t.closest('summary');
    if (sum && app.contains(sum) && sum.parentElement && sum.parentElement.matches('details[data-open]')) {
      /* Список раскрыли: он мог оказаться ниже края окна или под нижним меню — подводим его к верху. */
      const d = sum.parentElement;
      window.requestAnimationFrame(() => { if (d.open && d.isConnected) { try { d.scrollIntoView({ block: 'start', behavior: calm() ? 'auto' : 'smooth' }); } catch (err) { d.scrollIntoView(); } } });
    }
    const keys = e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey;
    const el = t.closest('[data-action]');
    if (el && app.contains(el)) {
      if (el.disabled || (el.tagName === 'A' && keys)) return;
      if (el.tagName === 'A') e.preventDefault();
      /* Следующее действие: ждущее сообщение студентам уходит. Кроме отката того же самого — тогда оно просто не уйдёт. */
      const same = held && el.dataset.id === held.ref && (el.dataset.action === 'status' || el.dataset.action === 'move-back');
      const was = held && !same ? held : null;
      if (was) hideToast();
      if (has(ACTIONS, el.dataset.action)) ACTIONS[el.dataset.action](el, e);
      sendAfter(was);
      return;
    }
    const link = t.closest('a[href^="#"]');
    if (link && app.contains(link) && !keys && !e.defaultPrevented) {
      e.preventDefault();
      Router.go(link.getAttribute('href'));
    }
  });
  doc.addEventListener('submit', e => {
    const form = e.target;
    if (!form || !app.contains(form)) return;
    e.preventDefault();
    const g = form.closest('[data-guard]');
    if (g && locked(g.dataset.guard)) return;
    const was = held;
    if (was) hideToast();
    if (has(FORMS, form.dataset.form)) FORMS[form.dataset.form](form);
    sendAfter(was);
  });
  doc.addEventListener('input', e => {
    const el = e.target;
    if (!el || !el.matches || !app.contains(el)) return;
    if (el.matches('[data-draft]') && el.id) {
      const key = draftKey(el), s = Auth.session();
      ui.drafts[key] = el.value;
      if (s && el.hasAttribute('data-keep')) DB.draft(s, key, el.value);
    }
    const key = el.form && el.form.dataset ? el.form.dataset.form : '';
    if (key && ui.errs[key]) { ui.errs[key] = ''; applyUi(); }
  });
  doc.addEventListener('change', e => {
    const el = e.target;
    if (!el || !el.matches || !app.contains(el)) return;
    if (el.matches('[data-draft]') && el.id) ui.drafts[draftKey(el)] = el.value;
    if (el.dataset.change === 'mv-pair') {                          /* другая пара — другой набор свободного времени и своя аудитория */
      ui.mv.key = el.value;
      delete ui.drafts['mv-to'];
      delete ui.drafts['mv-room'];
      ui.errs.move = '';
      requestRender();
    }
    if (el.dataset.change === 'mv-to') requestRender();             /* выбрано время — кнопка «Перенести пару» становится активной */
  });
  doc.addEventListener('toggle', e => {
    const d = e.target;
    if (d && d.matches && d.matches('details[data-open]')) ui.open[d.dataset.open] = d.open;
  }, true);

  /* ------------------------------------------------------------------ живое обновление и запуск */
  DB.on(why => { if (why === 'prefs') applyTheme(); requestRender(); });
  window.addEventListener('hashchange', () => { Router.synced(); requestRender(); });
  window.addEventListener('fx:ready', () => { mountFx(); });
  window.addEventListener('pageshow', e => { if (e.persisted) requestRender(); });
  window.addEventListener('pagehide', () => { commitHeld(); });     /* вкладку закрыли или перезагрузили: ждущее сообщение уходит */
  doc.addEventListener('visibilitychange', () => { if (!doc.hidden) requestRender(); });
  try {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', requestRender);
  } catch (e) { /* тема просто не переключится сама */ }
  /* В режиме «Сейчас» время идёт: раз в полминуты сверяем, не началась ли пара и не сменился ли день. */
  setInterval(() => { if (!doc.hidden) requestRender(); }, 30000);

  /* Положение страницы после перезагрузки ставит сам сайт (верх экрана или блок входа), а не браузер по памяти. */
  try { if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual'; } catch (e) { /* останется как у браузера */ }
  applyTheme();
  render();                                                          /* сразу, не дожидаясь эффектов и фото */
})();
</script>
<style>
/* ===== Эффекты «Цифрового деканата» (d_fx.html) =====
   Главная (раньше — экран входа): живая сцена заказчика (фото, воздух, крона, светлячки) и зимний снег;
   без фото — планета. Блок сцены по-прежнему называется .login-photo, функция — FX.login.
   Расписание: пролёт по парам дня. (Наклон и линза «как было» у плашки переноса убраны 24.11: на сайте их больше нет.)
   Свои классы начинаются с fx-. Правила каркаса дополнены в оговорённых местах:
   тень подписи на фото, раскладка внутри .fly и (обложка, 24.11) затемнение
   первого экрана .hero-shade — вместо сплошного слоя локальная подложка под надписью — плюс две кнопки
   обложки внутри .hero-stage («Перейти ко входу» и «Пауза»). */

/* --- вход: слои сцены. Порядок: фото и его правки (воздух, крона) → затемнение каркаса (::after)
       → свет и снег перед кадром (.fx-front) → подпись .login-cap --- */
.login-photo .fx-scene{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#0b1018;animation:fx-in .4s ease-out both}
@keyframes fx-in{from{opacity:0}to{opacity:1}}
.login-photo .fx-shift{position:absolute;inset:0}
.login-photo .fx-shift canvas,.login-photo canvas.fx-front{inset:auto;left:0;top:0;width:0;height:0;display:block;pointer-events:none}
.login-photo canvas.fx-front{z-index:1}
.login-photo.has-photo .login-cap{text-shadow:0 1px 12px rgba(4,8,14,.9),0 0 2px rgba(4,8,14,.7)}
/* Глубина: кадр и его правки сносятся за указателем одним числом, воздух перед кадром — другим.
   Запас по кромке под этот снос даёт scale до 1.006. Только там, где есть точный указатель, и только
   пока указатель над блоком (класс fx-deep ставит JS): у заказчика scale стоит всегда, но слой
   с преобразованием пересчитывается целиком в каждом кадре, и без видеокарты кадр выходил втрое дольше.
   Запас растёт вместе со сносом (--fx-k от 0 до 1), поэтому скачка масштаба нет. */
@media (hover:hover) and (pointer:fine){
  .login-photo.fx-deep .fx-shift{transform:translate3d(calc(var(--fx-mx,0) * 1.1px),calc(var(--fx-my,0) * .8px),0) scale(calc(1 + var(--fx-k,0) * .006))}
  .login-photo.fx-deep canvas.fx-front{transform:translate3d(calc(var(--fx-mx,0) * 2.8px),calc(var(--fx-my,0) * 2px),0)}
}
@media (prefers-reduced-motion:reduce){
  .login-photo .fx-scene{animation:none}
  .login-photo.fx-deep .fx-shift,.login-photo.fx-deep canvas.fx-front{transform:none}
  .login-photo canvas.fx-front{display:none}
}

/* --- обложка главной (решение заказчика 24.11, 17:08: «обложку оставляем, только она неживая»).
       Затемнение каркаса (.hero-shade) лежало сплошным слоем 60–72 % чёрного на весь кадр и гасило движение
       крон и неба втрое: у заказчика в proba.html под кадром только лёгкие виньетки (.home-scrim, 0 в середине,
       до .26 внизу). Здесь так же: по всему кадру — виньетки сверху (под шапку) и снизу, а плотная подложка —
       только под надписью (::before) и под подсказкой «листайте» (::after). Их место и размер ставит JS по самим
       строкам (переменные --fx-t* и --fx-h* на .hero-shade); без JS — запасной прямоугольник по центру.
       Плотность подложки .6 выбрана по худшему пикселю: самое яркое, что есть в сцене (лампа в окне, фонарь,
       снежинка, светлячок), под ней не светлее 105 из 255, и текст #F7F4EC держит не меньше 4,9:1 против
       худшего пикселя под строкой — это и требование к мелкому «Цифровой деканат» (4,5:1), и проверка
       tools/home_check.py. Ядро подложки накрывает строки с запасом (JS даёт +14 px), спад — тенью наружу.
       Подложка лежит над снегом и огнями (слой каркаса выше сцены), поэтому снежинка под буквами гаснет вместе
       с кадром и ярче букв не бывает. --- */
.home.photo .hero-shade{background:linear-gradient(180deg,rgba(5,8,13,.2) 0,rgba(5,8,13,.06) 12%,rgba(5,8,13,0) 24%,rgba(5,8,13,0) 68%,rgba(5,8,13,.12) 86%,rgba(5,8,13,.3) 100%)}
.home.photo .hero-shade::before,.home.photo .hero-shade::after{content:"";position:absolute;background:rgba(5,8,13,.6);pointer-events:none}
.home.photo .hero-shade::before{left:var(--fx-tx,16%);top:var(--fx-ty,30%);width:var(--fx-tw,68%);height:var(--fx-th,46%);border-radius:28px;
  box-shadow:0 0 var(--fx-tb,112px) var(--fx-ts,56px) rgba(5,8,13,.6)}
.home.photo .hero-shade::after{left:var(--fx-hx,calc(50% - 64px));top:var(--fx-hy,calc(100% - 46px));width:var(--fx-hw,128px);height:var(--fx-hh,26px);border-radius:14px;
  box-shadow:0 0 36px 18px rgba(5,8,13,.6)}
/* Нижняя виньетка самой сцены (.login-photo.has-photo::after, до .62) на обложке не нужна: низ держит виньетка выше. */
.hero-cam .login-photo.has-photo::after{background:none}
/* Две кнопки обложки: «Перейти ко входу» (сразу к блоку входа, без пролёта сквозь буквы) и «Пауза» фоновой
   анимации (WCAG 2.2.2: движение дольше 5 с можно остановить). Ставит их JS внутрь .hero-stage: слой над кадром
   и подложкой, под завесой; когда завеса закрыла кадр, кнопки прячутся и из обхода с клавиатуры уходят.
   Зона нажатия 44 px. При «меньше движения» фоновой анимации нет, и «Паузы» тоже нет. */
.fx-hero-ctl{position:absolute;left:0;right:0;bottom:12px;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 12px;pointer-events:none}
.fx-hero-ctl>*{pointer-events:auto}
.fx-hero-ctl.fx-hide{visibility:hidden}
.fx-hero-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 14px;margin:0;border-radius:99px;
  font:600 13px/1 var(--font-body);letter-spacing:0;text-decoration:none;white-space:nowrap;cursor:pointer;
  color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.home.photo .fx-hero-btn{color:#F7F4EC;background:rgba(5,8,13,.74);border-color:rgba(247,244,236,.3)}
.fx-hero-btn:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.fx-hero-btn[hidden]{display:none}
.fx-hero-btn .fx-ico{position:relative;display:block;width:10px;height:12px;flex:none}
.fx-hero-btn .fx-ico::before,.fx-hero-btn .fx-ico::after{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:1px;background:currentColor}
.fx-hero-btn .fx-ico::before{left:1px}.fx-hero-btn .fx-ico::after{right:1px}
.fx-hero-btn.fx-on .fx-ico::before{left:1px;width:0;height:0;border-radius:0;background:none;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent currentColor}
.fx-hero-btn.fx-on .fx-ico::after{display:none}
/* Узкий экран: по углам кнопкам не хватает места рядом с «листайте» — они встают парой по центру над подсказкой,
   с зазором 8 px над ней: подсказка — 16 px от низа + слово 12 + 9 + черта 30 (на окне ниже 460 px черта 16, у каркаса). */
@media (max-width:559px){.fx-hero-ctl{bottom:80px;justify-content:center}}
@media (max-width:559px) and (max-height:460px){.fx-hero-ctl{bottom:64px}}
@media (min-width:720px){.fx-hero-ctl{bottom:18px;padding:0 24px}}
/* --- вход без фото: планета --- */
.login-photo canvas.fx-planet{display:block;touch-action:auto}
@media (hover:hover) and (pointer:fine){.login-photo canvas.fx-planet{cursor:grab}.login-photo canvas.fx-planet:active{cursor:grabbing}}

/* --- пролёт по дню: сцена сверху, подпись и шкала сплошной панелью внизу (линии пола под текст не заходят).
       Положение мира и точку схода ставит JS по высоте панели; здесь — значения до первой раскладки. --- */
.fly.fx-fly{perspective-origin:50% 36%}
.fx-fly canvas.fx-floor{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.fx-fly .world{top:calc(50% - 46px)}
.fx-fly .st{pointer-events:none}
.fx-fly-ui{position:absolute;left:0;right:0;bottom:0;z-index:2;display:grid;grid-template-columns:minmax(0,1fr);background:var(--surface)}
.fx-fly-ui::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:36px;background:linear-gradient(transparent,var(--surface));pointer-events:none}
.fx-fly-ui .fly-cap{position:static;background:none;padding:4px 16px 4px;align-content:start}

    /* ---------- ветер ----------
       Сила — сумма трёх несоизмеримых порывов через порог: покой → порыв → затухание.
       Фазы ярусов накапливаются со скоростью, зависящей от порыва, и назад не идут. */
    function gust(t) {
      var g = 0, P1 = WIND.gustPeriod, F1 = WIND.gustPhase, W1 = WIND.gustWeight;

    /* ---------- крона ----------

    /* ---------- рой светлячков ----------

    }
    /* Погода сцены: снег идёт — строка «снег» таблицы заказчика, иначе «ясно». */

    function placeSwarm() {

    /* Блуждание: случайные толчки на цели скорости плюс инерция; мягкие стены только снаружи дома. */
    function stepSwarm(dt) {

        p.gx += (Math.random() * 2 - 1) * ks * p.shake - p.gx * p.back * dt;
        p.gy += (Math.random() * 2 - 1) * ks * p.shake * 0.74 - p.gy * p.back * dt;
        p.vx += (p.gx - p.vx) * p.inert * dt;

        if (sx !== 0) { p.gx += sx * WALL * dt; p.vx += sx * WALL * dt; }
        if (sy !== 0) { p.gy += sy * WALL * dt; p.vy += sy * WALL * dt; }

    }
    function drawSwarm() {
      gFront.globalCompositeOperation = 'lighter';
      for (var i = 0; i < swarm.length; i++) {

        if (life <= 0) continue;

        var f = 0.5 + 0.5 * Math.sin(6.283 * p.mf * t + p.mp);
        var m = 1 - 2 * p.dip * Math.pow(1 - f, p.shape);
        var b = 0.82 + 0.18 * Math.sin(6.283 * p.bf * t + p.bp);

        range.max = String(N); range.step = '1';
        var box = mk('div', 'fx-steps');
        prevB = icoBtn('i-back', 'Предыдущая пара', onPrev); nextB = icoBtn('i-arrow', 'Следующая пара', onNext);
        box.appendChild(prevB); box.appendChild(nextB); scrub.appendChild(box);
      } else {
        range.max = '1000'; range.step = '1';
        play = mk('button', 'ghost'); play.type = 'button'; play.textContent = 'Проиграть';
        play.addEventListener('click', onPlay); scrub.appendChild(play);
      }
      scrub.appendChild(range);
    }
    range.type = 'range'; range.min = '0';
    range.addEventListener('input', onRange);
    controls();
    if (!N) scrub.hidden = true;
    el.appendChild(floor); el.appendChild(world); el.appendChild(ui);

    function onSize() { clearTimeout(tSize); tSize = setTimeout(function () { if (!dead) layout(); }, 60); }
    var ro = null;
    if (win.ResizeObserver) { ro = new ResizeObserver(onSize); ro.observe(el); } else win.addEventListener('resize', onSize);
    var vis = watcher(el, function () { if (playing && !vis.ok()) pause(); });
    var unTheme = onTheme(function () { if (!dead) { palette(); drawFloor(); } });
    /* настройку движения сменили на ходу — управление пересобирается под новый режим */
    var unReduce = watch(mqReduce, function () {
      if (dead) return;
      pause(); calm = reduced(); capI = -2; controls();
      if (calm) { var near = 0; for (var i = 1; i <= N; i++) if (Math.abs(stops[i] - t) < Math.abs(stops[near] - t)) near = i; stop = near; t = stops[near] || 0; }
      layout();
    });
    /* шрифты догрузились: высота станций и подписи могла смениться */
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function () { if (!dead) layout(); }, noop);
    layout();

    function off() {
      if (dead) return;
      flyLast = { sig: sig, t: t, stop: stop, playing: playing, at: now() };
      dead = true; pause(); clearTimeout(tSize);
      range.removeEventListener('input', onRange);
      if (play) play.removeEventListener('click', onPlay);
      built.forEach(function (b) { b[0].removeEventListener('click', b[1]); });
      if (ro) ro.disconnect(); else win.removeEventListener('resize', onSize);
      vis.off(); unTheme(); unReduce();
      [floor, world, ui].forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });
      el.classList.remove('fx-fly');
      el.style.perspectiveOrigin = hadPO;
      if (!hadRole) el.removeAttribute('role');
      if (!hadLabel) el.removeAttribute('aria-label');
      reg.fly.delete(el);
    }
    off.sig = sig;
    off.play = start; off.pause = pause;
    off.seek = function (v) { pause(); if (calm) go(Math.round(v)); else { t = clamp(+v || 0, 0, 1); render(); } };
    off.info = function () { return { stations: N, t: Math.round(t * 1000) / 1000, stop: stop, playing: playing, calm: calm, scale: S, caption: capT.textContent, at: stops.slice() }; };
    reg.fly.set(el, off);
    /* Блок открывают кнопкой «Пролистать день», поэтому полёт начинается сам, один раз; дальше — «Пауза»
       и шкала. Не начинается: при «меньше движения», при opts.autoplay === false и когда блок только что
       перестроен с тем же днём — тогда возвращается прежнее место. */
    if (flyLast.sig === sig && now() - flyLast.at < 1500) {
      if (calm) go(flyLast.stop); else { t = flyLast.t; render(); if (flyLast.playing) start(); }
    } else if (!opts || opts.autoplay !== false) start();
    return off;
  }

  /* ================= наружу ================= */
  function safe(fn) { return function () { try { return fn.apply(null, arguments) || noop; } catch (e) { if (win.console && console.warn) console.warn('FX:', e); return noop; } }; }
  win.FX = {
    login: safe(login),
    fly: safe(fly),
    reduced: reduced,
    /* Снег: 'on' / 'off' — принудительно, 'auto' — по календарю (SNOW_MONTHS). Нужен стенду и проверке. */
    snow: function (mode) {
      snowForce = mode === 'on' || mode === true ? true : mode === 'off' || mode === false ? false : null;
      scenes.slice().forEach(function (s) { s.weather(); });
      return snowSeason();
    },
    snowMonths: SNOW_MONTHS.slice(),
    /* Пауза фоновой анимации обложки — то же, что кнопка «Пауза»: FX.pause(true/false); без аргумента — состояние. */
    pause: function (v) { return v === undefined ? bgPaused : setPaused(v); }
  };
  win.dispatchEvent(new Event('fx:ready'));
})();
</script>
</body>
</html>
